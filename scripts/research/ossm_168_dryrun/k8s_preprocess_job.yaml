apiVersion: batch/v1
kind: Job
metadata:
  name: lemon-preprocess-${SUBJECT_ID}
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: preprocessor
        image: python:3.11-slim
        command: ["python3"]
        args:
          - "-c"
          - |
            import sys
            sys.path.insert(0, '/workspace/sounio')
            from scripts.research.ossm_168_dryrun import lemon_preprocess as lp
            from pathlib import Path
            import json
            import numpy as np
            import time

            sid = '${SUBJECT_ID}'
            raw_root = '/workspace/data/lemon/raw_eeg'
            cache_dir = Path('/workspace/data/lemon/preprocessed')
            cache_dir.mkdir(parents=True, exist_ok=True)

            npy = cache_dir / f'{sid}_epochs.npy'
            meta = cache_dir / f'{sid}_meta.json'

            if npy.exists() and meta.exists():
                print(f'[{sid}] Already cached')
                sys.exit(0)

            t0 = time.time()
            try:
                res = lp.preprocess_subject(raw_root, sid)
                epochs = np.asarray(res.epochs, dtype=np.float64)

                prov = {
                    'subject': sid,
                    'sfreq': res.sfreq,
                    'n_total_epochs': res.n_total_epochs,
                    'n_retained_epochs': res.n_retained_epochs,
                    'retention_rate': res.retention_rate(),
                    'n_ica_rejected': res.n_ica_rejected,
                    'n_ica_total': res.n_ica_total,
                    'wall_time_s': time.time() - t0,
                }

                np.save(npy, epochs)
                meta.write_text(json.dumps(prov, indent=2))
                print(f'[{sid}] Success: {res.n_retained_epochs} epochs')
            except Exception as e:
                print(f'[{sid}] Error: {e}')
                sys.exit(1)
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
          limits:
            memory: "16Gi"
            cpu: "4000m"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: sounio-workspace-pvc
  backoffLimit: 3
