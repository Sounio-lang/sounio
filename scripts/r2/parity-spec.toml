version = 1
name = "souc-r2-parity"
artifact_root = "artifacts/r2"

[suite]
default_backend = "driver"
oracle_backend = "rust"
timeout_seconds = 120
parallel_jobs = 2

[cultural_fidelity]
enabled = true
forbidden_terms = ["cargo", "rustc", "crate", "crates.io", "rustup", "clippy"]
scan_logs = true
scan_help = true
scan_errors = true

[[case]]
id = "run_if_eq_smoke"
command = "run"
args = ["tests/selfhost-driver-output/if_eq_2_3_42_7.sio"]
expected_exit_code = 0
expected_stdout = "7\n"
expected_stderr_contains = ["event=driver_output"]
expected_stderr_excludes = ["SELFHOST=driver_orchestration status=fallback"]

[[case]]
id = "run_arithmetic_chain_smoke"
command = "run"
args = ["tests/selfhost-driver-output/let_div_mod_chain.sio"]
expected_exit_code = 0
expected_stdout = "2\n"
expected_stderr_contains = ["event=driver_output"]
expected_stderr_excludes = ["SELFHOST=driver_orchestration status=fallback"]

[[case]]
id = "check_driver_smoke"
command = "check"
args = ["tests/selfhost-driver-output/if_eq_2_3_42_7.sio"]
expected_exit_code = 0
expected_stdout_contains = ["All checks passed:"]
expected_stderr_excludes = ["fallback", "cargo", "rustc"]

[[case]]
id = "help_text_contract"
command = "help"
args = ["--help"]
expected_exit_code = 0
expected_stdout_contains = ["Sounio", "Usage:", "Commands:"]
expected_stderr_excludes = ["cargo", "rustc", "crate"]

[[case]]
id = "version_contract"
command = "version"
args = ["--version"]
