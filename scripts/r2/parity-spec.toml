id = "help_text_contract"
command = "help"
args = ["--help"]
expected_exit_code = 0
expected_stdout_file = "golden/help_text_contract.stdout"
expected_stderr_file = "golden/help_text_contract.stderr"
expected_stdout_contains = [
  "Sounio",
  "Usage: souc-linux-x86_64 [OPTIONS] <COMMAND>",
