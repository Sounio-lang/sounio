# litellm-triangle.yaml — LiteLLM gateway for Iterative Convergence triangle partners
#
# Usage:
#   litellm --config scripts/mcp/litellm-triangle.yaml --port 4000
#
# Requires: OPENROUTER_API_KEY in ~/.sounio-keys.env
#   (covers both refuter and formaliser via OpenRouter)
#
# Optional direct keys (higher quota, lower latency):
#   OPENAI_API_KEY  — swap refuter to openai/gpt-4o or openai/gpt-5
#   GEMINI_API_KEY  — swap formaliser to gemini/gemini-2.5-pro
#
# Models exposed at http://localhost:4000/v1/

model_list:
  - model_name: refuter
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      temperature: 0.2
      max_tokens: 8192

  - model_name: formaliser
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      temperature: 0.5
      max_tokens: 8192

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - refuter: [formaliser]

litellm_settings:
  request_timeout: 180
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
