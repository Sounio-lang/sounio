[package]
name = "sounio-units"
version = "0.1.0"
description = "Dimensional analysis and ISO/BIPM metrological calibration with GUM uncertainty propagation"
authors = ["Sounio Project"]
license = "Apache-2.0"
edition = "2026"
repository = "https://github.com/sounio-lang/sounio"
readme = "docs/README.md"
keywords = ["units", "metrology", "gum", "dimensional-analysis", "calibration"]
categories = ["scientific", "metrology", "core"]

[science]
schema = "sounio.science-manifest.v1"
ring = "scientific-package"
evidence-status = "passes-gate"
context-of-use = "dimensional analysis and metrology research software"
visibility = "public"
allowed-claim-classes = ["compile", "runtime", "validated_research"]
evidence-refs = ["gate:sounio_package_support_gate", "gate:package_import_science_gate"]
next-gate = "package-boundary-receipt"
declared-by = "SOUNIO-SCIENCE-RESEARCH-BOUNDARY"
declared-at = "2026-07-15"
review-state = "draft"

[lib]
path = "src/lib.sio"
name = "sounio_units"

[[test]]
name = "test_units_e2e"
path = "tests/test_units_e2e.sio"
run = true

[[test]]
name = "test_calibration_e2e"
path = "tests/test_calibration_e2e.sio"
run = true
