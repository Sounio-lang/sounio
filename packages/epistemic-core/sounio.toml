[package]
name = "epistemic-core"
version = "0.1.0"
description = "Core epistemic types for Sounio: KCoreKnowledge, first-order uncertainty propagation, confidence gates, source metadata"
authors = ["Sounio Project"]
license = "Apache-2.0"
edition = "2026"
repository = "https://github.com/sounio-lang/epistemic-core"
readme = "docs/README.md"
keywords = ["epistemic", "uncertainty", "gum", "knowledge", "provenance"]
categories = ["scientific", "epistemic", "core"]

[science]
schema = "sounio.science-manifest.v1"
ring = "scientific-package"
evidence-status = "passes-gate"
context-of-use = "epistemic measurement primitives for research software"
visibility = "public"
allowed-claim-classes = ["compile", "runtime", "validated_research"]
evidence-refs = ["gate:sounio_package_support_gate", "gate:package_import_science_gate"]
next-gate = "package-boundary-receipt"
declared-by = "SOUNIO-SCIENCE-RESEARCH-BOUNDARY"
declared-at = "2026-07-15"
review-state = "draft"

[lib]
path = "src/lib.sio"
name = "epistemic_core"

[[test]]
name = "test_knowledge"
path = "tests/test_knowledge.sio"
run = true

[[test]]
name = "test_gum_propagation"
path = "tests/test_gum_propagation.sio"
run = true

[[example]]
name = "basic_measurement"
path = "src/examples/basic_measurement.sio"
maturity = "implemented"
context-of-use = "epistemic measurement primitives for research software"
evidence-refs = ["source:src/examples/basic_measurement.sio", "gate:package_import_science_gate"]
