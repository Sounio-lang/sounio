[package]
name = "epistemic-core"
version = "0.1.0"
description = "Core epistemic types for Sounio: Knowledge<T>, GUM uncertainty propagation, confidence gates, provenance ledger"
authors = ["Sounio Project"]
license = "Apache-2.0"
edition = "2026"
repository = "https://github.com/sounio-lang/epistemic-core"
documentation = "https://registry.sounio.org/packages/epistemic-core/docs"
readme = "docs/README.md"
keywords = ["epistemic", "uncertainty", "gum", "knowledge", "provenance"]
categories = ["scientific", "epistemic", "core"]

[epistemic]
score = 0.97
confidence-threshold = 0.95
provenance-level = "strong"
gum-compliant = true
regulatory-ready = true
validation-coverage = 0.98
uncertainty-propagation = "first-order-gum"

[lib]
path = "src/lib.sio"
name = "epistemic_core"

[[test]]
name = "test_knowledge"
path = "tests/test_knowledge.sio"
run = true

[[test]]
name = "test_gum_propagation"
path = "tests/test_gum_propagation.sio"
run = true

[[test]]
name = "test_provenance"
path = "tests/test_provenance.sio"
run = true

[[example]]
name = "basic_measurement"
path = "src/examples/basic_measurement.sio"

[[example]]
name = "pbpk_uncertainty"
path = "src/examples/pbpk_uncertainty.sio"
