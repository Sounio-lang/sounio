[package]
name = "sounio-io-primitives"
version = "0.1.0"
description = "Low-level I/O primitives: byte paths, structured logging, and comparisons"
authors = ["Sounio Project"]
license = "Apache-2.0"
edition = "2026"
readme = "docs/README.md"
keywords = ["path", "log", "cmp", "io", "primitives"]
categories = ["core", "io"]

[science]
schema = "sounio.science-manifest.v1"
ring = "scientific-package"
evidence-status = "passes-gate"
context-of-use = "low-level IO support for scientific packages"
visibility = "public"
allowed-claim-classes = ["compile", "runtime"]
evidence-refs = ["gate:sounio_package_support_gate", "gate:package_import_science_gate"]
next-gate = "package-boundary-receipt"
declared-by = "SOUNIO-SCIENCE-RESEARCH-BOUNDARY"
declared-at = "2026-07-15"
review-state = "draft"

[lib]
path = "src/lib.sio"
name = "sounio_io_primitives"

[[test]]
name = "test_log_path_cmp_e2e"
path = "tests/test_log_path_cmp_e2e.sio"
run = true
