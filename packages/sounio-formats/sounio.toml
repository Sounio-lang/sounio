[package]
name = "sounio-formats"
version = "0.1.0"
description = "Structured data format parsers: YAML, TOML, and MessagePack"
authors = ["Sounio Project"]
license = "Apache-2.0"
edition = "2026"
readme = "docs/README.md"
keywords = ["yaml", "toml", "msgpack", "serialization", "parser"]
categories = ["encoding", "io", "core"]

[science]
schema = "sounio.science-manifest.v1"
ring = "scientific-package"
evidence-status = "passes-gate"
context-of-use = "structured-data support for scientific packages"
visibility = "public"
allowed-claim-classes = ["compile", "runtime"]
evidence-refs = ["gate:sounio_package_support_gate", "gate:package_import_science_gate"]
next-gate = "package-boundary-receipt"
declared-by = "SOUNIO-SCIENCE-RESEARCH-BOUNDARY"
declared-at = "2026-07-15"
review-state = "draft"

[lib]
path = "src/lib.sio"
name = "sounio_formats"

[[test]]
name = "test_yaml_e2e"
path = "tests/test_yaml_e2e.sio"
run = true

[[test]]
name = "test_toml_e2e"
path = "tests/test_toml_e2e.sio"
run = true

[[test]]
name = "test_msgpack_e2e"
path = "tests/test_msgpack_e2e.sio"
run = true
