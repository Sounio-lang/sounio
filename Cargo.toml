[workspace]
resolver = "2"
members = [
    "crates/souc",
    "crates/runtime", "crates/soir", "crates/poseidon-vm",
]
exclude = ["jupyter"]

[workspace.package]
version = "1.0.0-beta.3"
edition = "2024"
authors = [
    "Demetrios Chiuratto Agourakis <demetrios@sounio-lang.org>",
    "Dionisio Chiuratto Agourakis",
]
description = "The Sounio Programming Language - epistemic computing at the horizon of certainty"
license = "Apache-2.0"
repository = "https://github.com/sounio-lang/sounio"
homepage = "https://sounio-lang.org"
documentation = "https://docs.rs/sounio"

[workspace.dependencies]
# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "1"
libc = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Data structures
indexmap = "2"
petgraph = "0.6"
id-arena = "2"

# String interning
string-interner = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Markdown parsing
pulldown-cmark = "0.10"

# Lexer generation
logos = "0.14"

# Source code management
codespan-reporting = "0.11"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system utilities
walkdir = "2"

# Build system
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
glob = "0.3"
num_cpus = "1.16"

# Signal handling
ctrlc = "3.4"

# Cross-compilation
which = "6"
dirs = "5"
chrono = "0.4"

# Ontology support
lru = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }

# Ontology parsing (RDF/OWL)
rio_turtle = "0.8"
rio_xml = "0.8"
rio_api = "0.8"

# LLM integration
regex = "1.10"
lazy_static = "1.4"

# Cranelift JIT
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
cranelift-jit = "0.116"
cranelift-module = "0.116"
cranelift-native = "0.116"
cranelift-object = "0.116"
target-lexicon = "0.12"

# REPL
rustyline = "14"

# SMT Solver
z3 = { version = "0.12", features = ["static-link-z3"] }

# LLVM Backend
inkwell = "0.5"

# GPU Backend
rspirv = "0.12"
spirv = "0.3"
cudarc = { version = "0.12", default-features = false, features = ["driver", "cuda-12060"] }
rustc-hash = "2.0"

# WASM support
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

# LSP Server
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
dashmap = "5.5"
ropey = "1.6"
url = "2.5"

# Parallel processing
rayon = "1.10"

# Distributed builds
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "blocking"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
flate2 = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
hyper = "1.0"
rand = "0.8"
serde_yaml = "0.9"

# Package manager
tar = "0.4"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
futures = "0.3"
base64 = "0.22"

# Dev dependencies
criterion = "0.5"
pretty_assertions = "1"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
wgpu = "23"
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
