[package]
name = "sounio-pkg"
version = "0.1.0"
authors = ["Sounio Team"]
edition = "2024"
license = "Apache-2.0"
description = "Package manager for the Sounio programming language"
repository = "https://github.com/sounio-lang/sounio"

# Epistemic metadata
[package.metadata]
confidence = 0.95
provenance = "Official Sounio tooling"
validation_status = "beta"

# Dependencies (will be implemented in Sounio)
[dependencies]
# Core Sounio libraries will be added here

[dev-dependencies]
# Test dependencies

# Build configuration
[build]
target = "native"
optimization = "performance"

# Features
[features]
default = ["cli", "toml-parser"]
cli = []
toml-parser = []
registry = []
workspace = []

# Binary targets
[[bin]]
name = "sounio-pkg"
path = "src/main.sio"

# Library (for extensibility)
[lib]
name = "sounio_pkg"
path = "src/lib.sio"

# Examples
[[example]]
name = "basic-usage"
path = "examples/basic_usage.sio"

[[example]]
name = "custom-commands"
path = "examples/custom_commands.sio"

# Workspace (empty for now, can add sub-crates later)
[workspace]
# members = ["crates/*"]
