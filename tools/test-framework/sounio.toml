[package]
name = "sounio-test"
version = "0.1.0"
authors = ["Sounio Testing Team"]
edition = "2024"
license = "Apache-2.0"
description = "Epistemic test framework for the Sounio programming language"
repository = "https://github.com/sounio-lang/sounio-test"

# Epistemic metadata
[package.metadata]
confidence = 0.96
provenance = "Official Sounio testing framework"
validation_status = "beta"
testing_framework = true

# Dependencies
[dependencies]
# Core Sounio libraries
epistemic-core = "^1.0"

[dev-dependencies]
# Self-test dependencies

# Build configuration
[build]
target = "native"
optimization = "performance"

# Features
[features]
default = ["assertions", "runner", "statistical"]
assertions = []           # Assertion library
runner = []               # Test runner
statistical = []          # Statistical testing
property = []             # Property-based testing
fuzzing = []              # Fuzzing engine
coverage = []             # Code coverage
reporting = []            # HTML/JSON reporting
cli = []                  # Command-line interface

# Library
[lib]
name = "sounio_test"
path = "src/lib.sio"

# Examples
[[example]]
name = "basic-tests"
path = "examples/basic_tests.sio"
description = "Basic test examples"

[[example]]
name = "epistemic-tests"
path = "examples/epistemic_tests.sio"
description = "Tests with epistemic uncertainty"
required-features = ["assertions"]

[[example]]
name = "statistical-tests"
path = "examples/statistical_tests.sio"
description = "Statistical testing examples"
required-features = ["statistical"]

# Binary for CLI
[[bin]]
name = "sounio-test"
path = "src/cli.sio"
required-features = ["cli"]

# Configuration file example
[[config]]
name = "test-config"
path = "examples/sounio.test.toml"
description = "Example test configuration"
