[package]
name = "odep-prover"
version = "0.1.0"
edition = "2021"
description = "ODEP (Oblivious Differential Epistemic Privacy) witness generator for Sounio ZD-based unlearning."
license = "Apache-2.0 OR MIT"

[lib]
name = "odep_prover"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "odep-prove"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

# Future phases:
# halo2 = "0.3"      # Phase 2: real ZK
# nova-snark = "0.38" # Phase 3: recursion
