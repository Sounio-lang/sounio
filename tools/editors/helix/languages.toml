# Helix editor language config for Sounio.
#
# Install: copy this snippet (or its contents) to one of
#   $XDG_CONFIG_HOME/helix/languages.toml
#   ~/.config/helix/languages.toml
# Helix merges per-user languages.toml with its bundled defaults.
#
# Requires `souc` on PATH (or set `command =` to an absolute path).
# `souc lsp --stdio` starts the checked preview LSP route in bin/souc. The
# pure-Sounio server rebuild is tracked separately.

[[language]]
name = "sounio"
scope = "source.sounio"
file-types = ["sio"]
roots = ["souc.toml", ".git"]
comment-tokens = ["//"]
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "    " }
auto-format = false
language-servers = ["sounio-lsp"]

[language-server.sounio-lsp]
command = "souc"
args = ["lsp", "--stdio"]

# Helix uses tree-sitter for syntax highlighting; a Sounio grammar is
# not yet shipped here. Until then, hover / completion / definition /
# references / rename / diagnostics flow over LSP just as they do in
# VS Code. The TextMate grammar at
# tools/editors/vscode/syntaxes/sounio.tmLanguage.json can be ported
# to tree-sitter when someone has appetite for it.
