[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sounio-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server exposing the Sounio compiler over local stdio."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Sounio contributors" }
]
dependencies = [
  "mcp>=1.12.4,<2.0"
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.22",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5"
]

[project.scripts]
sounio-mcp-server = "sounio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sounio_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sounio_mcp"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
