site_name: Sounio Ecosystem
site_description: "Epistemic Computing with Python, Jupyter, and Sounio"
repo_url: https://github.com/sounio-org/sounio
repo_name: sounio-org/sounio

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - sounio-py:
    - Overview: sounio-py/overview.md
    - Quickstart: sounio-py/quickstart.md
    - API Reference: sounio-py/api.md
  - sounio-jupyter:
    - Overview: sounio-jupyter/overview.md
    - Usage Guide: sounio-jupyter/usage.md
  - Drug Discovery:
    - Tutorial: drug-discovery/tutorial.md
    - Pipeline Reference: drug-discovery/reference.md

markdown_extensions:
  - admonition
  - pymdownx.codehilite:
      use_pygments: true
  - pymdownx.arithmatex
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - meta

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sounio-org/sounio
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/sounio

copyright: Copyright &copy; 2026 Sounio Project
