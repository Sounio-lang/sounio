[package]
name = "sounio"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the Sounio programming language"
license = "Apache-2.0"

[lib]
name = "_sounio_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py38", "extension-module"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
strip = true
