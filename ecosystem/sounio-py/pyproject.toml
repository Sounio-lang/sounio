[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "sounio"
version = "0.1.0"
description = "Python bindings for Sounio — the epistemic scientific computing language"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = [
    "epistemic-computing",
    "uncertainty-quantification",
    "pharmacokinetics",
    "scientific-computing",
    "gum-compliance",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2.0"]
dev = ["pytest>=7.0", "numpy>=1.24", "pandas>=2.0"]

[project.urls]
Homepage = "https://sounio.org"
Repository = "https://github.com/sounio/sounio"
Documentation = "https://docs.sounio.org"
Registry = "https://registry.sounio.org"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "sounio._sounio_native"
