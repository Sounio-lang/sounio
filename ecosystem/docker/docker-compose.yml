version: '3.8'

services:
  sounio-lab:
    build:
      context: ../..
      dockerfile: ecosystem/docker/Dockerfile
    container_name: sounio-lab
    ports:
      - "8888:8888"
    volumes:
      - ./work:/home/sounio/work
      - ./examples:/home/sounio/examples
    environment:
      JUPYTER_TOKEN: sounio
      JUPYTER_ENABLE_LAB: "true"
      SOUNIO_STDLIB_PATH: /opt/sounio/stdlib
      SOUC: /usr/local/bin/souc
    restart: unless-stopped
