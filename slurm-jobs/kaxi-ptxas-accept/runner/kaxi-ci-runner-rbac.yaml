# Least-privilege RBAC for the K-AXI PTX acceptance runner.
# Grants exactly what `submit_jit.sh` does against the cluster: resolve the
# login pod and exec into it (sbatch/squeue/cat/tar). Namespaced to slurm-pilot
# only — no cluster-wide rights, no node access.
#
#   kubectl apply -f slurm-jobs/kaxi-ptxas-accept/runner/kaxi-ci-runner-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaxi-ci-runner
  namespace: slurm-pilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaxi-ci-runner
  namespace: slurm-pilot
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaxi-ci-runner
  namespace: slurm-pilot
subjects:
  - kind: ServiceAccount
    name: kaxi-ci-runner
    namespace: slurm-pilot
roleRef:
  kind: Role
  name: kaxi-ci-runner
  apiGroup: rbac.authorization.k8s.io
