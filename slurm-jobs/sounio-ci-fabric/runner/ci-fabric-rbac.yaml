# Minimal RBAC for the first Sounio CI Fabric runner pool.
#
# ServiceAccount only -- no Role, no RoleBinding, no pods/exec. A runner pool
# that only executes ordinary CI steps (lint, build, sharded test legs) does
# not need any Kubernetes API access at all, and this pool does not run
# anything Slurm-related yet (its only workflow, ci-fabric-pool-smoke.yml, is
# `nproc`/`free -h`). Least privilege means granting pods/exec into the
# slurm-pilot namespace when a job actually needs it, not ahead of that need
# on the theory that a future Qualification-submitting job will want it --
# an earlier version of this file granted the same RBAC shape as
# slurm-jobs/kaxi-ptxas-accept/runner/kaxi-ci-runner-rbac.yaml pre-emptively,
# which a compromised or mistakenly-dispatched ordinary CI job could then use
# as a bridge into the cluster before any Qualification workload exists to
# justify it.
#
# When a real Slurm-submitting job is introduced (see RUNNER_SETUP.md), add a
# Role/RoleBinding then, scoped to that job's own dedicated ServiceAccount --
# mirror kaxi-ci-runner-rbac.yaml's Role/RoleBinding at that point, not before.
#
#   kubectl apply -f slurm-jobs/sounio-ci-fabric/runner/ci-fabric-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-fabric-runner
  namespace: slurm-pilot
