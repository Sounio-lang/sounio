# Least-privilege RBAC for the first Sounio CI Fabric runner pool.
#
# Mirrors slurm-jobs/kaxi-ptxas-accept/runner/kaxi-ci-runner-rbac.yaml exactly:
# a runner pool that only executes ordinary CI steps (lint, build, sharded
# test legs) does not, by itself, need any Kubernetes API access at all. This
# RBAC is granted anyway, in the same least-privilege shape as the proven
# kaxi lane, because the natural next use of a CI Fabric pool is a job that
# submits a Slurm Qualification workload the same way kaxi's `submit_jit.sh`
# does (resolve the slurm-pilot login pod, exec sbatch/squeue/cat/tar into
# it) -- see docs/ops/fork_pr_self_hosted_runner_policy.md and this runner's
# own RUNNER_SETUP.md for why that bridge is not wired up yet. No cluster-wide
# rights, no node access, namespaced to slurm-pilot only, same as kaxi.
#
#   kubectl apply -f slurm-jobs/sounio-ci-fabric/runner/ci-fabric-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-fabric-runner
  namespace: slurm-pilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-fabric-runner
  namespace: slurm-pilot
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-fabric-runner
  namespace: slurm-pilot
subjects:
  - kind: ServiceAccount
    name: ci-fabric-runner
    namespace: slurm-pilot
roleRef:
  kind: Role
  name: ci-fabric-runner
  apiGroup: rbac.authorization.k8s.io
