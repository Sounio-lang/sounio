baseURL = "https://souniolang.org/"
title = "Sounio"
languageCode = "en-us"
defaultContentLanguage = "en"
enableMissingTranslationPlaceholders = false

# Output formats
[outputs]
home = ["HTML", "RSS", "JSON"]

# Sitemap generation
[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

# Multilingual configuration
[languages]
[languages.en]
languageName = "English"
languageCode = "en"
weight = 1
title = "Sounio — Epistemic Computing"

[languages.pt]
languageName = "Português"
languageCode = "pt"
weight = 2
title = "Sounio — Computação Epistêmica"

[languages.el]
languageName = "Ελληνικά"
languageCode = "el"
weight = 3
title = "Sounio — Επιστημική Υπολογιστική"

[languages.zh]
languageName = "中文"
languageCode = "zh"
weight = 4
title = "Sounio — 认识论计算"

[languages.ja]
languageName = "日本語"
languageCode = "ja"
weight = 5
title = "Sounio — エピステミック・コンピューティング"

[languages.es]
languageName = "Español"
languageCode = "es"
weight = 6
title = "Sounio — Computación Epistémica"

# Site params
[params]
version = "0.99.0"
description = "A systems programming language for epistemic computing"
author = "Demetrios Chiuratto Agourakis"
github = "https://github.com/sounio-lang/sounio"
playground = "https://sounio-lang.github.io/playground"

# Menu configuration
[menu]
[[menu.main]]
name = "Features"
url = "#features"
weight = 1

[[menu.main]]
name = "Performance"
url = "#performance"
weight = 2

[[menu.main]]
name = "Research"
url = "#research"
weight = 3

[[menu.main]]
name = "Architecture"
url = "#architecture"
weight = 4

[[menu.main]]
name = "Install"
url = "#install-guide"
weight = 5

[[menu.main]]
name = "Docs"
url = "#docs"
weight = 6

[[menu.main]]
name = "Showcases"
url = "/showcases/"
weight = 7

[[menu.main]]
name = "GitHub"
url = "https://github.com/sounio-lang/sounio"
weight = 8

# Markup configuration
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4

  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
