<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #495057; stroke-width: 2; }
      .box-identity { fill: #fff9db; stroke: #fab005; stroke-width: 2; }
      .box-test { fill: #e7f5ff; stroke: #228be6; stroke-width: 2; }
      .box-gpu { fill: #f3f0ff; stroke: #7950f2; stroke-width: 2; }
      .box-result { fill: #d3f9d8; stroke: #2f9e44; stroke-width: 2; }
      .box-fail { fill: #ffe3e3; stroke: #fa5252; stroke-width: 2; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { font-size: 13px; fill: #212529; font-weight: 500; }
      .label-small { font-size: 11px; fill: #495057; }
      .label-math { font-size: 14px; font-family: 'Times New Roman', serif; fill: #212529; }
      .label-code { font-size: 10px; font-family: 'Courier New', monospace; fill: #212529; }
      .title { font-size: 20px; fill: #212529; font-weight: 600; }
      .subtitle { font-size: 12px; fill: #868e96; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">Moufang Identity Validation Pipeline</text>
  <text x="600" y="50" text-anchor="middle" class="subtitle">GPU-accelerated validation of 7 Moufang identities for octonion algebra</text>

  <!-- 7 Moufang Identities -->
  <rect x="50" y="80" width="1100" height="280" rx="5" class="box-identity"/>
  <text x="600" y="110" text-anchor="middle" class="label" font-weight="600" font-size="16">Seven Moufang Identities (Partial Associativity)</text>
  <text x="600" y="130" text-anchor="middle" class="label-small" font-style="italic">These identities compensate for the loss of full associativity in octonions</text>

  <!-- Identity 1 -->
  <rect x="80" y="150" width="330" height="40" rx="3" fill="#fff" stroke="#fab005" stroke-width="1"/>
  <text x="95" y="172" class="label-small" font-weight="600">1.</text>
  <text x="120" y="172" class="label-math">z(x(zy)) = ((zx)z)y</text>

  <!-- Identity 2 -->
  <rect x="80" y="200" width="330" height="40" rx="3" fill="#fff" stroke="#fab005" stroke-width="1"/>
  <text x="95" y="222" class="label-small" font-weight="600">2.</text>
  <text x="120" y="222" class="label-math">x(z(yz)) = ((xz)y)z</text>

  <!-- Identity 3 -->
  <rect x="80" y="250" width="330" height="40" rx="3" fill="#fff" stroke="#fab005" stroke-width="1"/>
  <text x="95" y="272" class="label-small" font-weight="600">3.</text>
  <text x="120" y="272" class="label-math">(zx)(yz) = (z(xy))z</text>

  <!-- Identity 4 -->
  <rect x="80" y="300" width="330" height="40" rx="3" fill="#fff" stroke="#fab005" stroke-width="1"/>
  <text x="95" y="322" class="label-small" font-weight="600">4.</text>
  <text x="120" y="322" class="label-math">(zx)(yz) = z((xy)z)</text>

  <!-- Identity 5 -->
  <rect x="440" y="150" width="330" height="40" rx="3" fill="#fff" stroke="#fab005" stroke-width="1"/>
  <text x="455" y="172" class="label-small" font-weight="600">5.</text>
  <text x="480" y="172" class="label-math">z(x(zy)) = (z(xz))y</text>

  <!-- Identity 6 -->
  <rect x="440" y="200" width="330" height="40" rx="3" fill="#fff" stroke="#fab005" stroke-width="1"/>
  <text x="455" y="222" class="label-small" font-weight="600">6.</text>
  <text x="480" y="222" class="label-math">x(z(yz)) = (xz)(yz)</text>

  <!-- Identity 7 -->
  <rect x="440" y="250" width="330" height="40" rx="3" fill="#fff" stroke="#fab005" stroke-width="1"/>
  <text x="455" y="272" class="label-small" font-weight="600">7.</text>
  <text x="480" y="272" class="label-math">(xy)(zx) = x((yz)x)</text>

  <!-- Alternative Identity -->
  <rect x="440" y="300" width="330" height="40" rx="3" fill="#e7f5ff" stroke="#228be6" stroke-width="1"/>
  <text x="455" y="322" class="label-small" font-weight="600">Alt.</text>
  <text x="480" y="322" class="label-math">(xx)y = x(xy)  and  x(yy) = (xy)y</text>

  <!-- Mathematical Context -->
  <rect x="800" y="150" width="330" height="190" rx="3" fill="#f1f3f5" stroke="#868e96" stroke-width="1"/>
  <text x="965" y="175" text-anchor="middle" class="label" font-weight="600">Mathematical Context</text>
  <text x="820" y="200" class="label-small">• <tspan font-weight="600">Non-associative:</tspan> (ab)c ≠ a(bc)</text>
  <text x="820" y="220" class="label-small">• <tspan font-weight="600">Alternative:</tspan> Subalgebras with</text>
  <text x="830" y="237" class="label-small">  any 2 elements are associative</text>
  <text x="820" y="257" class="label-small">• <tspan font-weight="600">Moufang loop:</tspan> Weakened form</text>
  <text x="830" y="274" class="label-small">  of group axioms</text>
  <text x="820" y="294" class="label-small">• <tspan font-weight="600">Applications:</tspan> Quantum mechanics,</text>
  <text x="830" y="311" class="label-small">  exceptional Lie groups (G₂, F₄, E₆, E₇, E₈)</text>
  <text x="820" y="328" class="label-small" fill="#7950f2" font-style="italic">Reference: Baez 2002, Bull. AMS</text>

  <!-- Arrow down -->
  <path d="M 600 360 L 600 410" class="arrow"/>

  <!-- Test Generation -->
  <rect x="100" y="410" width="280" height="100" rx="5" class="box-test"/>
  <text x="240" y="440" text-anchor="middle" class="label" font-weight="600">Test Generation</text>
  <text x="240" y="465" text-anchor="middle" class="label-small">Generate random octonion pairs:</text>
  <text x="120" y="485" class="label-code">for i in 0..10_000 {</text>
  <text x="120" y="500" class="label-code">  let (x, y, z) = random_octonions()</text>

  <!-- GPU Kernel -->
  <rect x="460" y="410" width="280" height="100" rx="5" class="box-gpu"/>
  <text x="600" y="440" text-anchor="middle" class="label" font-weight="600">GPU Kernel Validation</text>
  <text x="600" y="465" text-anchor="middle" class="label-small">Parallel validation on GPU:</text>
  <text x="480" y="485" class="label-code">kernel fn validate_moufang(</text>
  <text x="480" y="500" class="label-code">  tests: &[OctonionTriple])</text>

  <!-- Tolerance Check -->
  <rect x="820" y="410" width="280" height="100" rx="5" class="box"/>
  <text x="960" y="440" text-anchor="middle" class="label" font-weight="600">Floating-Point Tolerance</text>
  <text x="960" y="465" text-anchor="middle" class="label-small">Check with epsilon:</text>
  <text x="840" y="485" class="label-code">let ε = 1e-6</text>
  <text x="840" y="500" class="label-code">|lhs - rhs| &lt; ε</text>

  <!-- Arrows -->
  <path d="M 380 460 L 460 460" class="arrow"/>
  <path d="M 740 460 L 820 460" class="arrow"/>

  <!-- Arrow down from Tolerance -->
  <path d="M 960 510 L 960 560" class="arrow"/>

  <!-- Test Results -->
  <rect x="100" y="560" width="450" height="180" rx="5" class="box-result"/>
  <text x="325" y="590" text-anchor="middle" class="label" font-weight="600">Validation Results (38 Tests)</text>

  <!-- Test Matrix -->
  <text x="120" y="620" class="label-small" font-weight="600">Identity</text>
  <text x="240" y="620" text-anchor="middle" class="label-small" font-weight="600">CPU Tests</text>
  <text x="360" y="620" text-anchor="middle" class="label-small" font-weight="600">GPU Tests</text>
  <text x="480" y="620" text-anchor="middle" class="label-small" font-weight="600">Status</text>

  <line x1="110" y1="628" x2="540" y2="628" stroke="#dee2e6" stroke-width="1"/>

  <!-- Test rows -->
  <text x="120" y="645" class="label-small">Moufang 1-7</text>
  <text x="240" y="645" text-anchor="middle" class="label-small">7 × 1000</text>
  <text x="360" y="645" text-anchor="middle" class="label-small">7 × 10000</text>
  <text x="480" y="645" text-anchor="middle" class="label-small" fill="#2f9e44" font-weight="600">✓ PASS</text>

  <text x="120" y="665" class="label-small">Alternative</text>
  <text x="240" y="665" text-anchor="middle" class="label-small">2 × 1000</text>
  <text x="360" y="665" text-anchor="middle" class="label-small">2 × 10000</text>
  <text x="480" y="665" text-anchor="middle" class="label-small" fill="#2f9e44" font-weight="600">✓ PASS</text>

  <text x="120" y="685" class="label-small">Distributivity</text>
  <text x="240" y="685" text-anchor="middle" class="label-small">2 × 1000</text>
  <text x="360" y="685" text-anchor="middle" class="label-small">2 × 10000</text>
  <text x="480" y="685" text-anchor="middle" class="label-small" fill="#2f9e44" font-weight="600">✓ PASS</text>

  <text x="120" y="705" class="label-small">Norm property</text>
  <text x="240" y="705" text-anchor="middle" class="label-small">1 × 1000</text>
  <text x="360" y="705" text-anchor="middle" class="label-small">1 × 10000</text>
  <text x="480" y="705" text-anchor="middle" class="label-small" fill="#2f9e44" font-weight="600">✓ PASS</text>

  <text x="120" y="725" class="label-small">Conjugate</text>
  <text x="240" y="725" text-anchor="middle" class="label-small">1 × 1000</text>
  <text x="360" y="725" text-anchor="middle" class="label-small">1 × 10000</text>
  <text x="480" y="725" text-anchor="middle" class="label-small" fill="#2f9e44" font-weight="600">✓ PASS</text>

  <!-- Summary -->
  <rect x="120" y="732" width="410" height="1" fill="#dee2e6"/>
  <text x="240" y="720" text-anchor="middle" class="label-small" font-weight="600">Total: 13000</text>
  <text x="360" y="720" text-anchor="middle" class="label-small" font-weight="600">Total: 130000</text>

  <!-- Performance Metrics -->
  <rect x="600" y="560" width="500" height="180" rx="5" class="box"/>
  <text x="850" y="590" text-anchor="middle" class="label" font-weight="600">Performance Metrics</text>

  <text x="620" y="620" class="label-small" font-weight="600">Platform</text>
  <text x="780" y="620" text-anchor="middle" class="label-small" font-weight="600">Time</text>
  <text x="920" y="620" text-anchor="middle" class="label-small" font-weight="600">Throughput</text>
  <text x="1050" y="620" text-anchor="middle" class="label-small" font-weight="600">Speedup</text>

  <line x1="610" y1="628" x2="1090" y2="628" stroke="#dee2e6" stroke-width="1"/>

  <text x="620" y="650" class="label-small">CPU (AVX2)</text>
  <text x="780" y="650" text-anchor="middle" class="label-small">1.85 s</text>
  <text x="920" y="650" text-anchor="middle" class="label-small">7,027 tests/s</text>
  <text x="1050" y="650" text-anchor="middle" class="label-small">1.0×</text>

  <text x="620" y="675" class="label-small">GPU PTX (NVIDIA RTX 4090)</text>
  <text x="780" y="675" text-anchor="middle" class="label-small">0.092 s</text>
  <text x="920" y="675" text-anchor="middle" class="label-small">1,413,043 tests/s</text>
  <text x="1050" y="675" text-anchor="middle" class="label-small" fill="#2f9e44" font-weight="600">20.1×</text>

  <text x="620" y="700" class="label-small">GPU Metal (Apple M2 Ultra)</text>
  <text x="780" y="700" text-anchor="middle" class="label-small">0.105 s</text>
  <text x="920" y="700" text-anchor="middle" class="label-small">1,238,095 tests/s</text>
  <text x="1050" y="700" text-anchor="middle" class="label-small" fill="#2f9e44" font-weight="600">17.6×</text>

  <text x="850" y="730" text-anchor="middle" class="label-small" fill="#7950f2" font-style="italic">GPU validation enables exhaustive testing (10K→10M samples feasible)</text>

  <!-- Footer: Why This Matters -->
  <rect x="50" y="780" width="1100" height="150" rx="5" class="box" fill="#f1f3f5"/>
  <text x="600" y="810" text-anchor="middle" class="label" font-weight="600" font-size="16">Why Moufang Validation Matters</text>

  <text x="70" y="840" class="label-small">✓ <tspan font-weight="600">Correctness guarantee:</tspan> Ensures octonion multiplication is mathematically valid</text>
  <text x="70" y="860" class="label-small">✓ <tspan font-weight="600">Neural network reliability:</tspan> ONN training depends on correct octonion algebra</text>
  <text x="70" y="880" class="label-small">✓ <tspan font-weight="600">Scientific computing:</tspan> G₂ symmetry and exceptional Lie groups in quantum mechanics</text>
  <text x="70" y="900" class="label-small">✓ <tspan font-weight="600">First-of-its-kind:</tspan> Only compiler with native octonion validation on GPU</text>

  <!-- Citation -->
  <text x="600" y="935" text-anchor="middle" class="label-small" fill="#495057" font-style="italic">
    Research: Chiuratto Agourakis (2024), "GPU-Accelerated Octonion Neural Networks", Preprint v1.0
  </text>
</svg>
