# Why Sounio Section
section_why_title = "Por que Sounio?"
section_why_description = "A computação científica moderna exige mais do que aritmética correta — exige integridade epistêmica. A maioria das linguagens trata a incerteza como um pensamento posterior. Sounio a torna fundamental."

# Feature Cards
feature_uncertainty_title = "Incerteza é de Primeira Classe"
feature_uncertainty_desc = "Cada valor pode carregar sua incerteza. O tipo Knowledge<T> envolve valores com incerteza, confiança e metadados de procedência."
feature_propagation_title = "Propagação Automática"
feature_propagation_desc = "Propagação de incerteza compatível com GUM através de todas as operações matemáticas. Você escreve a física, o compilador cuida da estatística."
feature_provenance_title = "Rastreamento de Procedência"
feature_provenance_desc = "Dados sem origem são dados sem confiança. Cada medição remete à sua fonte — essencial para reprodutibilidade e conformidade regulatória."
feature_confidence_title = "Portões de Confiança"
feature_confidence_desc = "Quando a confiança cai abaixo de um limiar, a execução pode pausar, avisar ou tomar caminhos alternativos. O sistema sabe o que não sabe."
feature_domain_title = "Poder Específico de Domínio"
feature_domain_desc = "DSLs integradas para modelagem PK/PD (MedLang), neuroimagem (fMRI), inferência causal e computação acelerada por GPU."
feature_standards_title = "Conforme Padrões"
feature_standards_desc = "Projetado para GUM, ISO 17025, 21 CFR Part 11 e princípios FAIR. A conformidade não é opcional — é arquitetural."

