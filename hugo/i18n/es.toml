# Use Cases Section
usecases_title = "Casos de Uso"
usecases_description = "Sounio destaca en dominios donde la cuantificación de incertidumbre y la procedencia importan más."
usecase_pharma_title = "Farmacometría"
usecase_pharma_desc = "Modelado PK/PD con MedLang para optimización de dosis de fármacos y diseño de ensayos clínicos con manejo riguroso de incertidumbre."
usecase_fmri_title = "Neuroimagen"
usecase_fmri_desc = "Análisis de pipeline fMRI con procesamiento con puertas de confianza y seguimiento de procedencia para neurociencia reproducible."
usecase_causal_title = "Inferencia Causal"
usecase_causal_desc = "Redes bayesianas con tipos epistémicos para descubrimiento causal y estimación de efectos de tratamiento con incertidumbre."
usecase_gpu_title = "Computación GPU"
usecase_gpu_desc = "Simulaciones físicas con kernels GPU nativos, computación de alto rendimiento sin salir del lenguaje."
usecase_quantum_title = "Química Cuántica"
usecase_quantum_desc = "Algoritmos VQE con cuantificación de incertidumbre para implementaciones de solucionadores de valores propios cuánticos variacionales."
usecase_compliance_title = "Cumplimiento Regulatorio"
usecase_compliance_desc = "Sistemas de medición compatibles con GUM para ISO 17025, 21 CFR Part 11 y principios de datos FAIR."
