# Why Sounio Section
section_why_title = "なぜSounioか？"
section_why_description = "現代の科学的計算は正しい算術だけを要求するわけではありません—それは認識論的完全性を要求します。ほとんどの言語は不確実性を後付けとして扱います。Sounioはそれを基盤にします。"

# Feature Cards
feature_uncertainty_title = "不確実性をファーストクラスに"
feature_uncertainty_desc = "すべての値がその不確実性を保持できます。Knowledge<T> 型は値に不確実性、信頼性、由来メタデータを包み込みます。"
feature_propagation_title = "自動伝播"
feature_propagation_desc = "すべての数学演算を通じたGUM準拠の不確実性伝播。物理学を書くのはあなたで、統計はコンパイラが扱います。"
feature_provenance_title = "由来追跡"
feature_provenance_desc = "起源のないデータは信頼のないデータです。すべての測定値はそのソースに遡れます—再現性と規制遵守に不可欠です。"
feature_confidence_title = "信頼性ゲート"
feature_confidence_desc = "信頼性が閾値以下になると、実行を一時停止、警告、または代替パスを取ることができます。システムは知らないことを知っています。"
feature_domain_title = "ドメイン特化のパワー"
feature_domain_desc = "PK/PDモデリング（MedLang）、神経画像（fMRI）、因果推論、GPU加速計算のための組み込みDSL。"
