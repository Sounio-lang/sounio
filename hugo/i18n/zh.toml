# Why Sounio Section
section_why_title = "为什么选择 Sounio？"
section_why_description = "现代科学计算不仅仅需要正确的算术——它需要认识论完整性。大多数语言将不确定性视为事后考虑。Sounio 将其作为基础。"

# Feature Cards
feature_uncertainty_title = "不确定性是第一类"
feature_uncertainty_desc = "每个值都可以携带其不确定性。Knowledge<T> 类型用不确定性、置信度和来源元数据包装值。"
feature_propagation_title = "自动传播"
feature_propagation_desc = "符合 GUM 的不确定性传播，适用于所有数学运算。您编写物理学，编译器处理统计学。"
feature_provenance_title = "来源跟踪"
feature_provenance_desc = "没有来源的数据就是没有信任的数据。每个测量都可以追溯到其来源——对于可重复性和法规合规性至关重要。"
feature_confidence_title = "置信门"
feature_confidence_desc = "当置信度低于阈值时，执行可以暂停、警告或采取替代路径。系统知道自己不知道什么。"
feature_domain_title = "领域特定能力"
feature_domain_desc = "内置 DSL 用于 PK/PD 建模 (MedLang)、神经成像 (fMRI)、因果推理和 GPU 加速计算。"
feature_standards_title = "符合标准"
feature_standards_desc = "专为 GUM、ISO 17025、21 CFR Part 11 和 FAIR 原则设计。合规性不是可选的——它是架构性的。"

