# Why Sounio Section
section_why_title = "Γιατί Sounio;"
section_why_description = "Η σύγχρονη επιστημονική υπολογιστική απαιτεί περισσότερα από σωστή αριθμητική—απαιτεί ακεραιότητα γνώσης. Οι περισσότερες γλώσσες αντιμετωπίζουν την αβεβαιότητα ως παράπλευρη σκέψη. Το Sounio την καθιστά θεμελιώδη."

# Feature Cards
feature_uncertainty_title = "Η Αβεβαιότητα είναι Πρώτης Τάξης"
feature_uncertainty_desc = "Κάθε τιμή μπορεί να φέρει την αβεβαιότητά της. Ο τύπος Knowledge<T> τυλίγει τιμές με αβεβαιότητα, εμπιστοσύνη και μεταδεδομένα προέλευσης."
feature_propagation_title = "Αυτόματη Διάδοση"
feature_propagation_desc = "Διάδοση αβεβαιότητας συμβατή με GUM μέσω όλων των μαθηματικών πράξεων. Γράφετε τη φυσική, ο μεταγλωττιστής χειρίζεται τη στατιστική."
feature_provenance_title = "Παρακολούθηση Προέλευσης"
feature_provenance_desc = "Δεδομένα χωρίς προέλευση είναι δεδομένα χωρίς εμπιστοσύνη. Κάθε μέτρηση ιχνηλατείται πίσω στην πηγή της—απαραίτητο για αναπαραγωγικότητα και συμμόρφωση με κανονισμούς."
feature_confidence_title = "Πύλες Εμπιστοσύνης"
feature_confidence_desc = "Όταν η εμπιστοσύνη πέσει κάτω από ένα όριο, η εκτέλεση μπορεί να παύσει, να προειδοποιήσει ή να πάρει εναλλακτικές διαδρομές. Το σύστημα γνωρίζει τι δεν γνωρίζει."
feature_domain_title = "Δύναμη Ειδικών Τομέων"
feature_domain_desc = "Ενσωματωμένες DSLs για μοντελοποίηση PK/PD (MedLang), νευροαπεικόνιση (fMRI), αιτιώδη συμπερασματολογία και υπολογισμούς επιταχυνόμενους από GPU."
feature_standards_title = "Συμβατότητα με Πρότυπα"
feature_standards_desc = "Σχεδιασμένο για GUM, ISO 17025, 21 CFR Part 11 και αρχές FAIR. Η συμμόρφωση δεν είναι προαιρετική—είναι αρχιτεκτονική."

