{{ define "main" }}
<div class="docs-container">
    <main class="docs-content">
        {{ partial "breadcrumb.html" . }}

        <article>
            <header class="docs-header">
                <h1>{{ .Title }}</h1>
                {{ if .Params.description }}
                <p class="docs-description">{{ .Params.description }}</p>
                {{ end }}
            </header>

            {{ .Content }}
        </article>
    </main>

    <aside class="docs-toc">
        <h3>{{ i18n "toc_title" }}</h3>
        {{ .TableOfContents }}
    </aside>
</div>
{{ end }}
