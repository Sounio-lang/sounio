<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — {{ .Site.Title }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="icon" href="{{ .Site.BaseURL }}favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --blue: #1a365d;
            --gold: #c4a574;
            --orange: #ed8936;
            --light: #f7fafc;
            --dark: #1a202c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Crimson Pro', Georgia, serif;
            line-height: 1.7;
            color: var(--dark);
        }

        .nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            background: rgba(26, 54, 93, 0.95);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(196, 165, 116, 0.2);
        }

        .nav a { color: white; text-decoration: none; font-size: 0.95rem; }
        .nav a:hover { color: var(--gold); }

        .page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--blue);
            margin-bottom: 1rem;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 0.5rem;
        }

        .page-description {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .page-body {
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .page-body h2 {
            font-size: 1.8rem;
            color: var(--blue);
            margin-top: 3rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 0.5rem;
        }

        .page-body h3 {
            font-size: 1.4rem;
            color: var(--orange);
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .page-body h4 {
            font-size: 1.15rem;
            color: var(--blue);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .page-body p {
            margin-bottom: 1rem;
            color: #333;
        }

        .page-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            background: rgba(26, 54, 93, 0.06);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
        }

        .page-body pre {
            background: var(--dark);
            color: var(--gold);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .page-body pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .page-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .page-body th {
            background: var(--blue);
            color: white;
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
        }

        .page-body td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .page-body tr:hover { background: var(--light); }

        .page-body blockquote {
            border-left: 4px solid var(--gold);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            background: rgba(196, 165, 116, 0.05);
            font-style: italic;
        }

        .page-body ul, .page-body ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }

        .page-body li {
            margin-bottom: 0.5rem;
        }

        .page-body a {
            color: var(--gold);
            font-weight: 500;
        }

        .page-body a:hover {
            color: var(--orange);
        }

        .page-body hr {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 3rem 0;
        }

        .page-body strong { color: var(--dark); }

        .page-footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
            font-size: 0.9rem;
            color: #888;
        }

        .breadcrumb {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            color: #888;
        }

        .breadcrumb a {
            color: var(--gold);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .footer {
            background: var(--dark);
            color: white;
            padding: 2rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer a { color: var(--gold); text-decoration: none; }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 1.8rem; }
            .page-container { padding: 1.5rem 1rem; }
            .nav { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    {{ partial "nav.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
</body>
</html>
