{{ define "main" }}
<div class="taxonomy-term">
    <h1>{{ .Title }}</h1>
    <ul class="post-list">
    {{ range .Pages }}
        <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
            {{ with .Description }}
                <p>{{ . }}</p>
            {{ end }}
        </li>
    {{ end }}
    </ul>
</div>
{{ end }}
