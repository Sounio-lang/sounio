{{ define "main" }}
<div class="taxonomy-page">
    <h1>{{ .Title }}</h1>
    <ul class="taxonomy-list">
    {{ range .Pages }}
        <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
            <span class="count">({{ len .Pages }})</span>
        </li>
    {{ end }}
    </ul>
</div>
{{ end }}
