# Runner pods execute repository code. They may reach GitHub (to fetch the job,
# report results, download actions and artifacts) and the Ubuntu archive (to
# provision gcc/python3), and nothing else: not the LAN, not Ceph, not Proxmox,
# not the Kubernetes API, not other pods. Ingress is denied entirely.
# Requires Cilium with the L7 DNS proxy (cluster: v1.19.4, enable-l7-proxy=true).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ci-runner-egress-allowlist
  namespace: arc-runners
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: ghcr.io
        - matchPattern: "*.github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.githubapp.com"
        - matchPattern: "*.blob.core.windows.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: archive.ubuntu.com
        - matchName: security.ubuntu.com
        - matchPattern: "*.archive.ubuntu.com"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
