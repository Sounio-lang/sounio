# Helm values for oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
# Workflows select these runners with `runs-on: sounio-ci`.
# The GitHub App secret `sounio-ci-github-app` (keys github_app_id,
# github_app_installation_id, github_app_private_key) is created by the operator
# by hand in namespace arc-runners -- it is deliberately not scripted here.
githubConfigUrl: https://github.com/Sounio-lang/sounio
githubConfigSecret: sounio-ci-github-app
runnerScaleSetName: sounio-ci
minRunners: 1            # one warm runner: no pod start-up on the first job
maxRunners: 4

template:
  spec:
    automountServiceAccountToken: false   # job code gets no Kubernetes credentials
    securityContext:
      fsGroup: 1001                       # runner uid in ghcr.io/actions/actions-runner
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [r770-proxmox, dl380-proxmox]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [r770-proxmox]
    tolerations:
      - key: sounio.dev/pool
        operator: Equal
        value: gpu-batch
        effect: NoSchedule
      - key: sounio.dev/compute
        operator: Equal
        value: heavy
        effect: NoSchedule
    containers:
      - name: runner
        # Pinned by digest (what `:latest` resolved to on 2026-09-25) so a runner
        # rollout is reproducible; bump deliberately.
        image: ghcr.io/actions/actions-runner@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
        command: ["/home/runner/run.sh"]
        env:
          - name: SOUNIO_MADAROS_CACHE_SHARED
            value: /cache/madaros
        resources:
          # A Madaros self-compile is one core. Peak RSS, measured on one node
          # with one script (Slurm 22773, 2026-11-11): 19.6 GiB for gen1
          # compiling main.sio at 37fdea3e, 55.0 GiB for gen2 compiling it at
          # 1954cbed (job cgroup peak 56.8 GiB). Since #3046 gen3 exists and the
          # post-merge rung runs both, so 48Gi no longer fits it; 72Gi leaves
          # room for the steps that run beside it. The test suite runs --jobs 4.
          # Hard limits keep CI from ever saturating a node the way the
          # 2026-05-29 build stampede did.
          requests:
            cpu: "4"
            memory: 24Gi
          limits:
            cpu: "8"
            memory: 72Gi
        volumeMounts:
          - name: madaros-cache
            mountPath: /cache
    volumes:
      - name: madaros-cache
        persistentVolumeClaim:
          claimName: sounio-ci-cache
