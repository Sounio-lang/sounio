# Two namespaces: the ARC controller (trusted, needs the Kubernetes API) and the
# runner pods (untrusted job code, no API, no LAN). Pod Security "baseline" on
# the runner side forbids privileged pods, hostPath and host networking.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    app.kubernetes.io/part-of: sounio-ci
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    app.kubernetes.io/part-of: sounio-ci
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
