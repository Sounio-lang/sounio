# Shared, content-addressed Madaros cache (scripts/dev/madaros-cache.sh).
# RWX on CephFS so every ephemeral runner -- PR run, merge-queue run, push to
# main -- sees the same entries. Correctness rests on the content keys inside,
# not on this volume: an entry that does not match its key is a plain miss.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sounio-ci-cache
  namespace: arc-runners
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs-scratch
  resources:
    requests:
      storage: 100Gi
