# Axolotl LoRA fine-tune: Qwen2.5-Coder-7B-Instruct + SOUNIO NOVELTY
# Mix: Sounio raw source (completion) + Novelty dataset (alpaca)

base_model: Qwen/Qwen2.5-Coder-7B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

datasets:
  - path: /data/datasets/sounio-train.jsonl
    type: completion
    field: text
  - path: /data/datasets/sounio-novelty-alpaca.jsonl
    type: alpaca

dataset_num_proc: 1
dataset_prepared_path: /data/cache/axolotl-prepared-novelty
val_set_size: 0.0
test_datasets:
  - path: /data/datasets/sounio-val.jsonl
    type: completion
    field: text
    split: train

adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
peft_use_rslora: true

sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true
eval_sample_packing: false

micro_batch_size: 1
gradient_accumulation_steps: 16
num_epochs: 3
optimizer: adamw_torch_fused
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0

bf16: auto
fp16: false
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
flash_attention: true

output_dir: /data/checkpoints/sounio-novelty-7b-v1
logging_steps: 5
save_steps: 200
save_total_limit: 3
eval_steps: 100
eval_strategy: steps

special_tokens:
  pad_token: "<|endoftext|>"
  eos_token: "<|im_end|>"

seed: 42
wandb_project: sounio-novelty
wandb_run_id: qwen-7b-novelty-v1
