# Composicao: SAN catastrophe-scan alimentado direto pela rede.
#
# A coorte entra pela fibra de 100G, atravessa CMAC -> networklayer, e cai
# no kernel por AXI-Stream. O host nao participa do caminho de dados: ele so
# carrega a LUT de custo, os escalares e le os resultados (que sao pequenos).
#
# Baseline a bater: 511 Msamples/s via DMA (T3_GREEN, spec T3).
# Hipotese: latencia ponta a ponta menor. O throughput ja era limitado por
# barramento, entao nao se espera ganho ali.
#
# INSTANCIA 1, nao 0: medido 2026-08-12 pelo BAR PCIe, o CMAC vivo e o
# cmac_1 (base 0x1420000, conf_tx=1 conf_rx=1 stat_rx_status=0x3). O cmac_0
# (0x1410000) esta com a gaiola QSFP sem cabo.
#
# Portas conferidas contra o xclbin (xclbinutil --info), nao contra o README:
#   networklayer  S_AXIS_eth2nl / M_AXIS_nl2eth  = lado ETHERNET, ap_axiu<512,0,0,0>
#   networklayer  S_AXIS_sk2nl  / M_AXIS_nl2sk   = lado APLICACAO, ap_axiu<512,0,0,16>
# O kernel usa TDEST de 16 bits para casar com o lado da aplicacao.

[connectivity]
nk=cmac_1:1:cmac_1
nk=networklayer:1:networklayer_1
nk=krnl_san_scan_net:1:krnl_san_scan_net_1
# o v++ exige TODA porta de stream conectada; a S_AXIS_sk2nl (lado TX da
# aplicacao) fica sem fonte se so ligarmos o RX. Usamos o krnl_mm2s do
# proprio VNx para alimenta-la, que e a topologia que eles ja validaram.
nk=krnl_mm2s:1:krnl_mm2s_1

# --- caminho de dados: fibra -> kernel ---
# CMAC RX -> network layer (lado ethernet)
stream_connect=cmac_1.M_AXIS:networklayer_1.S_AXIS_eth2nl
# network layer -> kernel (lado aplicacao, TDEST 16)
stream_connect=networklayer_1.M_AXIS_nl2sk:krnl_san_scan_net_1.samples_in
# network layer -> CMAC TX: fecha o lado de transmissao (ARP/ICMP continuam
# respondendo; o kernel nao emite pacote nesta variante)
stream_connect=krnl_mm2s_1.k2n:networklayer_1.S_AXIS_sk2nl
stream_connect=networklayer_1.M_AXIS_nl2eth:cmac_1.S_AXIS

# --- saidas pequenas continuam em memoria, lidas pelo host no fim ---
sp=krnl_mm2s_1.in:DDR[0]
sp=krnl_san_scan_net_1.lut:DDR[0]
sp=krnl_san_scan_net_1.hist_out:DDR[0]
sp=krnl_san_scan_net_1.catastrophe_out:DDR[0]
sp=krnl_san_scan_net_1.flops_out:DDR[0]

# --- colocacao: kernel num SLR livre, longe do VNx ---
# Medido 2026-08-12: VNx ocupa SLR1 (16,4%) e SLR2 (20,3%); SLR3 esta a 0,15%.
# O kernel usa 11.299 LUTs = 0,65% do dispositivo.
slr=krnl_san_scan_net_1:SLR3

[clock]
# Fmax estimada da variante: 342 MHz. 250 MHz da 37% de margem e mantem
# comparabilidade com o artefato aceito.
defaultFreqHz=250000000

[advanced]
# O CMAC precisa do clock de referencia do transceptor (gt_refclk1), que vem
# da gaiola QSFP. Quem amarra isso e o post_sys_link.tcl do VNx — sem ele o
# generate_target falha com 'clock pins are not connected to a valid clock
# source: /cmac_1/gt_refclk1'. O Makefile do VNx injeta este mesmo param.
param=compiler.userPostSysLinkOverlayTcl=/home/devsounio/vnx/Ethernet/post_sys_link.tcl
