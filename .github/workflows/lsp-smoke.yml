name: LSP Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lsp-smoke:
    name: LSP Smoke Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMEGA_SOUC_REQUIRE_PINNED: "1"
      OMEGA_SOUC_ALLOW_LOCAL_FALLBACK: "0"
      SOUNIO_REPO_HARD_NO_RUST: "1"
      SOUNIO_LSP_STRICT_NO_RUST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned souc binary
        run: |
          SOUC_BIN="$(bash scripts/omega/omega_resolve_souc_bin.sh --print-path)"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"

      - name: Run LSP smoke gate
        run: bash scripts/lsp_smoke_gate.sh

      - name: Verify LSP smoke marker
        run: |
          LOG_PATH="${LSP_SMOKE_LOG_PATH:-artifacts/omega/lsp_smoke.log}"
          test -s "$LOG_PATH"
          rg -q "LSP_SMOKE_PASS" "$LOG_PATH"

      - name: Upload LSP smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsp-smoke-artifacts
          path: |
            artifacts/omega/lsp_smoke.log
          retention-days: 7
