name: Website input export
on:
  pull_request:
    paths:
      - 'scripts/release/export_website_inputs.py'
      - 'scripts/release/test_website_inputs.py'
      - '.github/workflows/website-inputs.yml'
      - 'docs/**'
      - 'scripts/docs/governance_registry.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'bin/souc'
      - 'bootstrap/stage0.c'
      - 'artifacts/stdlib/**'
      - 'artifacts/omega/**'
      - 'website/public/assets/generated/render/**'
      - 'examples/render/**'
      - 'formal/lean4/**'
      - 'scripts/release/WEBSITE_INPUTS.md'
  push:
    branches: [main]
    paths:
      - 'scripts/release/export_website_inputs.py'
      - 'scripts/release/test_website_inputs.py'
      - '.github/workflows/website-inputs.yml'
      - 'docs/**'
      - 'scripts/docs/governance_registry.mjs'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'bin/souc'
      - 'bootstrap/stage0.c'
      - 'artifacts/stdlib/**'
      - 'artifacts/omega/**'
      - 'website/public/assets/generated/render/**'
      - 'examples/render/**'
      - 'formal/lean4/**'
      - 'scripts/release/WEBSITE_INPUTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive integrity boundaries
        run: python3 -m unittest discover -s scripts/release -p test_website_inputs.py -v
      - name: Export twice and compare exact bytes
        run: |
          mkdir -p export
          python3 scripts/release/export_website_inputs.py create --output export/website-inputs.tar.gz > export/receipt.json
          python3 scripts/release/export_website_inputs.py create --output export/second.tar.gz > export/second-receipt.json
          cmp export/website-inputs.tar.gz export/second.tar.gz
          digest=$(python3 -c 'import json; print(json.load(open("export/receipt.json"))["sha256"])')
          python3 scripts/release/export_website_inputs.py verify export/website-inputs.tar.gz --sha256 "$digest"
          rm export/second.tar.gz export/second-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: website-inputs-${{ github.sha }}
          path: export/
          retention-days: 7
          if-no-files-found: error
