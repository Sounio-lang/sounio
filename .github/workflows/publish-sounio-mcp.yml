name: Publish Sounio MCP Server

on:
  workflow_dispatch:
  push:
    tags:
      - "sounio-mcp-server-v*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish package to PyPI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        working-directory: tools/mcp
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/mcp/dist
