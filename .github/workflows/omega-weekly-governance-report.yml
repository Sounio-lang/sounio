name: omega-weekly-governance-report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  weekly-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Weekly Drift Report
        run: |
          mkdir -p artifacts/fpga artifacts/omega artifacts/ptx/omega artifacts/sass/omega artifacts/quantum/omega bootstrap/policies
          # Best-effort generation based on currently available tracked artifacts.
          python3 scripts/omega/omega_weekly_drift_report.py \
            --hw-trend artifacts/fpga/hardware_epistemic_power_live_trend.v1.json \
            --rl-trend artifacts/omega/rl_readiness_trend.v1.json \
            --attestation artifacts/omega/governance_attestation.v1.json \
            --baseline-freeze artifacts/omega/baseline_freeze.v1.json \
            --out-json artifacts/omega/weekly_drift_report.v2.json \
            --out-md artifacts/omega/weekly_drift_report.md \
            --window 7

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega-weekly-governance-report
          path: |
            artifacts/omega/weekly_drift_report.v2.json
            artifacts/omega/weekly_drift_report.md
