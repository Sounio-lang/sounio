name: GPU Performance Validation

on:
  push:
    branches: [main]
    paths:
      - 'self-hosted/gpu/**'
      - 'self-hosted/hlir/**'
      - 'scripts/omega/omega_hlir_gpu_cross_coverage.py'
      - 'scripts/omega/omega_gpu_opcode_smoke.sh'
      - '.github/workflows/gpu-performance-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'self-hosted/gpu/**'
      - 'self-hosted/hlir/**'
      - 'scripts/omega/omega_hlir_gpu_cross_coverage.py'
      - 'scripts/omega/omega_gpu_opcode_smoke.sh'

concurrency:
  group: gpu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pinned souc binary
        run: |
          SOUC_BIN="$(bash scripts/omega/omega_resolve_souc_bin.sh --print-path)"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"

      - name: Run HLIR→GPU cross-coverage anti-drift check
        run: |
          python3 scripts/omega/omega_hlir_gpu_cross_coverage.py --strict

      - name: Run opcode-level PTX/Metal smoke
        run: |
          bash scripts/omega/omega_gpu_opcode_smoke.sh

      - name: Capture report
        run: |
          cat > /tmp/gpu_performance_report.md << 'EOF_REPORT'
          # GPU Performance Validation Report

          ## Framework Status: PASS (No-Rust Self-Hosted Path)

          ### Validation Results
          - HLIR→GPU cross-coverage: PASS
          - Opcode smoke PTX+Metal: PASS
          - Rust toolchain dependency in workflow: REMOVED

          ### Notes
          - This workflow validates anti-drift and opcode emission contracts in self-hosted mode.
          - Real hardware dispatch evidence is tracked via Omega artifacts in strict gate runs.
          EOF_REPORT

      - name: Upload performance report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-performance-report
          path: |
            /tmp/gpu_performance_report.md
            artifacts/omega/hlir_gpu_cross_coverage.v1.json
            artifacts/omega/gpu_opcode_smoke.log
          retention-days: 30

  validate-on-gpu:
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 120
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned souc binary
        run: |
          SOUC_BIN="$(bash scripts/omega/omega_resolve_souc_bin.sh --print-path)"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"

      - name: Check NVIDIA GPU
        run: |
          nvidia-smi

      - name: Run opcode smoke on GPU runner
        run: |
          bash scripts/omega/omega_gpu_opcode_smoke.sh
