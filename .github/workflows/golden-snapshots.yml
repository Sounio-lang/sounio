name: Golden Snapshot Update

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Self-hosted parity filter (default: r2 parity sweep)"
        required: false
        default: "r2::parity::"

jobs:
  update-golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned souc binary
        env:
          SOUNIO_CI_SOUC_VERSION: "0.100.3"
          OMEGA_SOUC_REQUIRE_PINNED: "1"
          OMEGA_SOUC_ALLOW_LOCAL_FALLBACK: "0"
        run: bash scripts/build/fix_ci_binary.sh

      - name: Regenerate golden contracts
        run: scripts/ci/update_golden_snapshots.sh "${{ github.event.inputs.test_filter }}"

      - name: Capture golden status and patch
        run: |
          mkdir -p artifacts
          git status --short scripts/r2/golden tests/golden > artifacts/golden-status.txt || true
          git diff -- scripts/r2/golden tests/golden > artifacts/golden.diff || true

      - name: Upload golden update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golden-snapshot-update
          path: artifacts/
