name: Science Boundary Node

on:
  pull_request:
    paths:
      - '.github/workflows/science-boundary-node.yml'
      - 'tools/science_boundary/**'
      - 'bin/madaros'
      - 'website/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-contract:
    name: Python-free boundary metadata controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify vendored parser custody and run metadata controls
        env:
          TMPDIR: ${{ runner.temp }}/boundary-node
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          sha256sum -c tools/science_boundary/vendor/FILES.sha256
          bash -n bin/madaros
          node tools/science_boundary/core_test.mjs | tee "$TMPDIR/core.log"
          node tools/science_boundary/closure_test.mjs | tee "$TMPDIR/closure.log"
          node --test tools/science_boundary/policy_claims_test.mjs | tee "$TMPDIR/policy-claims.log"
          node tools/science_boundary/attestor_test.mjs | tee "$TMPDIR/attestor.log"
      - name: Retain operational metadata receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-boundary-node-controls
          path: ${{ runner.temp }}/boundary-node
          if-no-files-found: error
