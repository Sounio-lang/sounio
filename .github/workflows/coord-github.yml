name: GitHub coordination preflight
on:
  pull_request:
    paths:
      - 'bin/sounio-coord'
      - 'scripts/dev/sounio_coord_github.mjs'
      - 'scripts/dev/sounio_coord_agent_hook.py'
      - 'scripts/ci/sounio_coord_agent_hook_selftest.sh'
      - 'scripts/ci/sounio_coord_github_selftest.mjs'
      - '.github/workflows/coord-github.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/ci/sounio_coord_github_selftest.mjs
      - run: bash scripts/ci/sounio_coord_selftest.sh
      - run: bash scripts/ci/sounio_coord_agent_hook_selftest.sh
