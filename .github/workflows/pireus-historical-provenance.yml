name: Pireus Historical Provenance

on:
  pull_request:
    paths:
      - '.github/workflows/pireus-historical-provenance.yml'
      - 'stdlib/coordination/spark_pair_historical_provenance.sio'
      - 'tools/cluster/spark_pair_historical_provenance*'
      - 'tools/cluster/spark_pair_historical_source_observation.material-parity.v1'
      - 'scripts/dev/build_sounio_spark_pair_historical_provenance.sh'
      - 'scripts/ci/spark_pair_historical_provenance_selftest.sh'
      - 'scripts/ci/spark_pair_historical_source_assessment_selftest.sh'
      - 'tests/fixtures/spark_pair_arbiter/spark_pair_historical_provenance_vectors.sio'
      - 'docs/internal/concepts/spark-pair-reversible-decommission.md'
      - 'docs/internal/concepts/bindings.tsv'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pireus-historical-provenance.yml'
      - 'stdlib/coordination/spark_pair_historical_provenance.sio'
      - 'tools/cluster/spark_pair_historical_provenance*'
      - 'tools/cluster/spark_pair_historical_source_observation.material-parity.v1'
      - 'scripts/dev/build_sounio_spark_pair_historical_provenance.sh'
      - 'scripts/ci/spark_pair_historical_provenance_selftest.sh'
      - 'scripts/ci/spark_pair_historical_source_assessment_selftest.sh'
      - 'tests/fixtures/spark_pair_arbiter/spark_pair_historical_provenance_vectors.sio'
      - 'docs/internal/concepts/spark-pair-reversible-decommission.md'
      - 'docs/internal/concepts/bindings.tsv'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-historical-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Sounio authority, freeze, and fail-closed assessment
        run: bash scripts/ci/spark_pair_historical_provenance_selftest.sh
      - name: Verify discovered preinstall fragments remain non-authoritative
        run: bash scripts/ci/spark_pair_historical_source_assessment_selftest.sh
      - name: Parse orchestration surfaces
        run: |
          bash -n scripts/dev/build_sounio_spark_pair_historical_provenance.sh
          bash -n scripts/ci/spark_pair_historical_provenance_selftest.sh
          bash -n scripts/ci/spark_pair_historical_source_assessment_selftest.sh
      - name: Validate semantic and documentation registries
        run: |
          bash scripts/dev/sounio_semantic_status.sh
          bash scripts/dev/check_docs_registry.sh
