name: LLM Offload Grok Identity

on:
  pull_request:
    paths:
      - '.github/workflows/llm-offload-grok-identity.yml'
      - 'bin/llm-offload'
      - 'scripts/mcp/llm-offload.sh'
      - 'scripts/ci/llm_offload_grok_identity_selftest.sh'
      - '.claude/offload-routing.md'
      - '.claude/AGENT_OFFLOAD_POLICY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/llm-offload-grok-identity.yml'
      - 'bin/llm-offload'
      - 'scripts/mcp/llm-offload.sh'
      - 'scripts/ci/llm_offload_grok_identity_selftest.sh'
      - '.claude/offload-routing.md'
      - '.claude/AGENT_OFFLOAD_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-grok-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Grok 4.6 for every xAI alias
        run: bash scripts/ci/llm_offload_grok_identity_selftest.sh
