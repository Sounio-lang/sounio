name: Native v2 legacy driver

# Leaf gates that compile examples through self-hosted/compiler/native_compile_driver.sio
# (legacy driver_lex_source_to_globals lexer). Orchestrated by native_v2_struct_gate.sh
# but not previously reachable from any workflow (#1978).

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'self-hosted/compiler/native_compile_driver.sio'
      - '.github/workflows/native-v2-legacy-driver.yml'

concurrency:
  group: native-v2-legacy-driver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-driver-gates:
    name: native_compile_driver leaf gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Legacy driver regression suite
        run: |
          ulimit -s unlimited || true
          export SOUNIO_STDLIB_PATH="$(pwd)/stdlib"
          bash scripts/ci/native_v2_array_gate.sh
          bash scripts/ci/native_v2_logical_gate.sh
          bash scripts/ci/native_v2_enum_match_gate.sh
          bash scripts/ci/native_v2_nested_field_gate.sh
          bash scripts/ci/native_v2_struct_mutation_gate.sh
          bash scripts/ci/native_v2_struct_param_gate.sh
          bash scripts/ci/native_v2_struct_return_gate.sh
          bash scripts/ci/native_v2_out_param_boundary_gate.sh
