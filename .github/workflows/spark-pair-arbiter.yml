name: Spark Pair Arbiter

on:
  pull_request:
    paths:
      - '.github/workflows/spark-pair-arbiter.yml'
      - 'stdlib/coordination/spark_pair_arbiter.sio'
      - 'tools/cluster/spark_pair_arbiter*'
      - 'scripts/dev/*spark_pair_arbiter*'
      - 'scripts/ci/spark_pair_arbiter*'
      - 'tests/fixtures/spark_pair_arbiter/**'
      - 'docs/ops/spark_pair_arbiter.md'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/spark-pair-arbiter.yml'
      - 'stdlib/coordination/spark_pair_arbiter.sio'
      - 'tools/cluster/spark_pair_arbiter*'
      - 'scripts/dev/*spark_pair_arbiter*'
      - 'scripts/ci/spark_pair_arbiter*'
      - 'tests/fixtures/spark_pair_arbiter/**'
      - 'docs/ops/spark_pair_arbiter.md'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-policy-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Sounio authority and negative material fixtures
        run: bash scripts/ci/spark_pair_arbiter_selftest.sh
      - name: Parse material bridge surfaces
        run: |
          bash -n scripts/dev/spark_pair_arbiter.sh
          bash -n scripts/dev/spark_pair_arbiter_k8s_backend.sh
          bash -n scripts/dev/install_spark_pair_arbiter.sh
          bash -n scripts/ci/spark_pair_arbiter_live_gate.sh
          bash -n scripts/ci/spark_pair_arbiter_selftest.sh
          bash -n tests/fixtures/spark_pair_arbiter/mock_backend.sh
      - name: Validate documentation registry
        run: bash scripts/dev/check_docs_registry.sh
