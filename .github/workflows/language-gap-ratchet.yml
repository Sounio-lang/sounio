name: Language gap ratchet

# Asserts the MEASURED behaviour of four language gaps (#2387 f128, #2388
# derived units and unit loss, #2389 IEEE special values) so that a fix cannot
# land unseen: when one flips, this job fails on purpose and the fix must move
# the reproduction to run-pass/compile-fail, update KNOWN_LIMITATIONS.md and
# carry a migration note. Dedicated workflow for the same reason as the
# epistemic shape ratchet: a gate that is not reachable is not a gate (#1978).
# Runs the shipped bin/souc (both engines); no build.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: language-gap-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Language gap ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Twelve witnesses hold their measured gap
        run: bash scripts/ci/language_gap_ratchet_gate.sh
