name: Golden Snapshot Update

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "cargo test filter (default: e2e::golden::)"
        required: false
        default: "e2e::golden::"

jobs:
  update-golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate golden snapshots
        run: scripts/update_golden_snapshots.sh "${{ github.event.inputs.test_filter }}"
      - name: Capture golden status and patch
        run: |
          mkdir -p artifacts
          git status --short crates/souc/tests/golden > artifacts/golden-status.txt
          git diff -- crates/souc/tests/golden > artifacts/golden.diff
      - name: Upload golden update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golden-snapshot-update
          path: artifacts/
