name: Golden Snapshot Update

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Self-hosted parity filter (default: r2 parity sweep)"
        required: false
        default: "r2::parity::"

jobs:
  update-golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned souc binary
        run: |
          SOUC_BIN="$(bash scripts/omega/omega_resolve_souc_bin.sh --print-path)"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"

      - name: Regenerate golden contracts
        run: scripts/update_golden_snapshots.sh "${{ github.event.inputs.test_filter }}"

      - name: Capture golden status and patch
        run: |
          mkdir -p artifacts
          git status --short scripts/r2/golden tests/golden > artifacts/golden-status.txt || true
          git diff -- scripts/r2/golden tests/golden > artifacts/golden.diff || true

      - name: Upload golden update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golden-snapshot-update
          path: artifacts/
