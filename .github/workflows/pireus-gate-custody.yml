name: Pireus Gate Custody

on:
  pull_request:
    paths:
      - '.github/workflows/pireus-gate-custody.yml'
      - 'scripts/ci/pireus*'
      - 'scripts/ci/dgx_ptx_shfl_material_parity_futhark_gate.sh'
      - 'scripts/ci/spark_pair_decommission*'
      - 'scripts/dev/spark_pair_device_barrier_arm64_gate.sh'
      - 'tools/pireus/continuity/ci/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-gate-custody:
    name: Archived script custody (no runtime replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate custody corruption controls
        run: python3 tools/pireus/continuity/ci/test_gate_custody.py
      - name: Verify named scripts and their historical Git inputs
        run: |
          python3 tools/pireus/continuity/ci/verify_gate_custody.py \
            scripts/ci/dgx_ptx_shfl_material_parity_futhark_gate.sh \
            scripts/ci/pireus_apple_a64_tbl_material_parity.sh \
            scripts/ci/pireus_apple_cpu_dependency_latency_interface_feasibility.sh \
            scripts/ci/pireus_apple_cpu_dependency_latency_interface_material_ingestion.sh \
            scripts/ci/pireus_apple_cpu_dependency_latency_interface_material_parity.sh \
            scripts/ci/pireus_apple_cpu_dependency_latency_request.sh \
            scripts/ci/pireus_apple_metal_xor_materializer_gate.sh \
            scripts/ci/pireus_basis_fixed_gauge_rebase_formal_parity.sh \
            scripts/ci/pireus_canonical_target_lowering_sounio.sh \
            scripts/ci/pireus_canonical_target_material_parity.sh \
            scripts/ci/pireus_concrete_quotient_action_formal_parity.sh \
            scripts/ci/pireus_cross_arch_synthesizer_gate.sh \
            scripts/ci/pireus_cubic_operator_forge.sh \
            scripts/ci/pireus_dgx_ptx_shfl_material_parity.sh \
            scripts/ci/pireus_dgx_xor_materializer_gate.sh \
            scripts/ci/pireus_executed_streaming_probe_formal_parity.sh \
            scripts/ci/pireus_finite_action_canonicalization_formal_parity.sh \
            scripts/ci/pireus_gauge_coboundary_action_formal_parity.sh \
            scripts/ci/pireus_gauge_coboundary_faithfulness_formal_parity.sh \
            scripts/ci/pireus_gauge_section_canonicalization_formal_parity.sh \
            scripts/ci/pireus_gl4_action_enumeration_formal_parity.sh \
            scripts/ci/pireus_gl4_analytic_census_formal_parity.sh \
            scripts/ci/pireus_gl4_analytic_scan_bijection_formal_parity.sh \
            scripts/ci/pireus_linear_swap_gauge_descent_formal_parity.sh \
            scripts/ci/pireus_material_engine_admission.sh \
            scripts/ci/pireus_matrix_code_xor_equiv_formal_parity.sh \
            scripts/ci/pireus_multiprobe_block_certification.sh \
            scripts/ci/pireus_multiprobe_block_reuse_admission.sh \
            scripts/ci/pireus_operator_discovery_effect_parity.sh \
            scripts/ci/pireus_operator_discovery_formal_parity.sh \
            scripts/ci/pireus_operator_discovery_material_parity.sh \
            scripts/ci/pireus_operator_genesis.sh \
            scripts/ci/pireus_operator_genesis_bilinear.sh \
            scripts/ci/pireus_operator_genesis_gl4.sh \
            scripts/ci/pireus_operator_genome.sh \
            scripts/ci/pireus_operator_lowering_effect_parity.sh \
            scripts/ci/pireus_operator_lowering_forge.sh \
            scripts/ci/pireus_operator_lowering_formal_parity.sh \
            scripts/ci/pireus_operator_lowering_material_parity.sh \
            scripts/ci/pireus_operator_morphogenesis.sh \
            scripts/ci/pireus_operator_morphogenesis_effect_parity.sh \
            scripts/ci/pireus_operator_morphogenesis_formal_parity.sh \
            scripts/ci/pireus_operator_morphogenesis_material_parity.sh \
            scripts/ci/pireus_operator_novelty_feedback.sh \
            scripts/ci/pireus_operator_novelty_feedback_effect_parity.sh \
            scripts/ci/pireus_operator_novelty_feedback_formal_parity.sh \
            scripts/ci/pireus_operator_novelty_frontier_effect_parity.sh \
            scripts/ci/pireus_operator_novelty_frontier_formal_parity.sh \
            scripts/ci/pireus_operator_novelty_frontier_material_parity.sh \
            scripts/ci/pireus_operator_orbit_admission_reconstruction_formal_parity.sh \
            scripts/ci/pireus_operator_orbit_archive_reconstruction_formal_parity.sh \
            scripts/ci/pireus_operator_orbit_canonicalization.sh \
            scripts/ci/pireus_operator_orbit_canonicalization_formal_parity.sh \
            scripts/ci/pireus_operator_orbit_class_reconstruction_formal_parity.sh \
            scripts/ci/pireus_quotient_novelty_effect_parity.sh \
            scripts/ci/pireus_quotient_novelty_forge.sh \
            scripts/ci/pireus_quotient_novelty_formal_parity.sh \
            scripts/ci/pireus_quotient_novelty_material_parity.sh \
            scripts/ci/pireus_sedenion_operator_gate.sh \
            scripts/ci/pireus_streaming_minimum_correspondence_formal_parity.sh \
            scripts/ci/pireus_target_cost_observation.sh \
            scripts/ci/pireus_twist_gauge_factorization_gate.sh \
            scripts/ci/pireus_typed_xor_gpu_gate.sh \
            scripts/ci/pireus_u250_dual_card_admission.sh \
            scripts/ci/pireus_u250_execution_engine.sh \
            scripts/ci/pireus_u250_fpga_kernel_artifact.sh \
            scripts/ci/pireus_u250_kernel_launch_receipt.sh \
            scripts/ci/pireus_u250_material_parity.sh \
            scripts/ci/pireus_u250_xclbin_material_receipt.sh \
            scripts/ci/pireus_walsh_twist_channel_spectrum_gate.sh \
            scripts/ci/pireus_xeon_avx512_lowering_gate.sh \
            scripts/ci/pireus_xeon_avx512_material_gate.sh \
            scripts/ci/pireus_xeon_avx512_xor_plan_gate.sh \
            scripts/ci/pireus_xor_hlir_contract_gate.sh \
            scripts/ci/pireus_xor_lowering_darwin_xeon_fleet_parity.sh \
            scripts/ci/pireus_xor_lowering_darwin_xeon_material_parity.sh \
            scripts/ci/pireus_xor_selector_material_admission.sh \
            scripts/ci/spark_pair_decommission_parity_selftest.sh \
            scripts/ci/spark_pair_decommission_selftest.sh \
            scripts/dev/spark_pair_device_barrier_arm64_gate.sh \
            --output "$RUNNER_TEMP/pireus-gate-custody.json"
          cat "$RUNNER_TEMP/pireus-gate-custody.json"
      - name: Current executable Sounio sedenion contract
        run: SOUNIO_SOUC_ENGINE=lean_single bash scripts/ci/pireus_sedenion_operator_gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pireus-gate-custody
          path: ${{ runner.temp }}/pireus-gate-custody.json
          if-no-files-found: error
