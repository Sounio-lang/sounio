name: Release Gate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      native-runtime-filter:
        description: "Optional native runtime case/path filter, e.g. import_struct_shorthand_42"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  seed-policy:
    name: Seed Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve souc binary
        run: bash scripts/build/fix_ci_binary.sh
      - name: Verify no-rust policy
        run: |
          if [ -f scripts/omega/omega_policy_status.sh ]; then
            bash scripts/omega/omega_policy_status.sh || echo "SEED_POLICY_WARN"
          else
            echo "SEED_POLICY_SKIP (script not found)"
          fi

  rust-free-proof:
    name: Rust-Free Proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Runtime proof
        run: |
          if [ -f scripts/build/rust_free_seed_runtime_proof.sh ]; then
            bash scripts/build/rust_free_seed_runtime_proof.sh || echo "RUST_FREE_WARN"
          else
            echo "RUST_FREE_SKIP (script not found)"
          fi

  lsp-smoke:
    name: LSP Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      OMEGA_SOUC_REQUIRE_PINNED: "1"
      OMEGA_SOUC_ALLOW_LOCAL_FALLBACK: "0"
      SOUNIO_REPO_HARD_NO_RUST: "1"
      SOUNIO_LSP_STRICT_NO_RUST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Resolve souc binary
        env:
          SOUNIO_CI_SOUC_VERSION: "0.100.3"
        run: bash scripts/build/fix_ci_binary.sh
      - name: Run LSP smoke
        run: bash scripts/ci/lsp_smoke_gate.sh || echo "LSP_SMOKE_WARN"
      - name: Verify markers
        run: |
          LOG="${LSP_SMOKE_LOG_PATH:-artifacts/omega/lsp_smoke.log}"
          test -s "$LOG" && grep -F -q "LSP_SMOKE_PASS" "$LOG" || echo "LSP_SMOKE_WARN"

  full-selfhost:
    name: Full Self-Host (5 generations)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 5-generation bootstrap
        run: |
          bash scripts/ci/build_native_souc.sh /tmp/souc.elf
          for i in 1 2 3 4 5; do
            /tmp/souc.elf self-hosted/compiler/lean_single.sio /tmp/gen${i}.elf 2>/dev/null
            chmod +x /tmp/gen${i}.elf
            cp /tmp/gen${i}.elf /tmp/souc.elf
            echo "gen${i}: $(md5sum /tmp/gen${i}.elf | cut -d' ' -f1)"
          done
          if cmp -s /tmp/gen4.elf /tmp/gen5.elf; then
            echo "FULL_SELFHOST_FIXED_POINT_PASS"
          else
            echo "FULL_SELFHOST_FIXED_POINT_FAIL"
            exit 1
          fi
      - name: Full feature gate
        run: |
          cp /tmp/gen4.elf /tmp/final_boot4.elf
          chmod +x /tmp/final_boot4.elf
          bash scripts/ci/souc_v2_gate.sh

  source-bootstrap-selfhost:
    name: Source-Bootstrap Self-Host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-source-bootstrap-release-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Source-bootstrap host self-host gate
        run: bash scripts/codex/action-source-bootstrap-host-gate.sh
      - name: Cross-build macOS arm64 compiler artifact
        run: |
          SOUC_STAGE2=/tmp/sounio-source-bootstrap-release-linux-x86_64/artifacts/souc-stage2
          MACOS_OUT=/tmp/souc-self-hosted-arm64-macos
          "$SOUC_STAGE2" self-hosted/compiler/lean_single.sio "$MACOS_OUT" --target aarch64-macos
          chmod +x "$MACOS_OUT"
          file "$MACOS_OUT" | grep -F "Mach-O 64-bit arm64 executable"
          # Typecheck-proof compiler: the native typecheck proof harness invokes
          # `<compiler> --check <fixture>` and greps for E-code diagnostics (E137, ...).
          # The minimal lean_single seed provides neither `--check` nor E-codes, so the
          # proof must run against lean.sio — exactly as the x86 source-bootstrap proof
          # does (ci.yml builds lean.sio -> CHECK_OUT for the same harness). Cross-build
          # it here and wire it in via SOUC_TYPECHECK_NATIVE below.
          MACOS_CHECK_OUT=/tmp/souc-lean-check-arm64-macos
          "$SOUC_STAGE2" self-hosted/compiler/lean.sio "$MACOS_CHECK_OUT" --target aarch64-macos
          chmod +x "$MACOS_CHECK_OUT"
          file "$MACOS_CHECK_OUT" | grep -F "Mach-O 64-bit arm64 executable"
      - name: Upload source-bootstrap macOS compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-source-bootstrap-native-compiler-macos-arm64
          path: |
            /tmp/souc-self-hosted-arm64-macos
            /tmp/souc-lean-check-arm64-macos
          retention-days: 7
      - name: Upload source-bootstrap release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-source-bootstrap-selfhost
          path: /tmp/sounio-source-bootstrap-release-linux-x86_64
          retention-days: 7

  apple-selfhost:
    name: Apple Self-Host
    runs-on: macos-15
    needs: source-bootstrap-selfhost
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-macos-arm64
      FILTER: ${{ github.event.inputs.native-runtime-filter || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download source-bootstrap macOS compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: release-source-bootstrap-native-compiler-macos-arm64
          path: /tmp/source-bootstrap-macos
      - name: Install source-bootstrap macOS compiler artifact
        run: |
          cp /tmp/source-bootstrap-macos/souc-self-hosted-arm64-macos artifacts/self-hosted/souc-self-hosted-arm64-macos
          chmod +x artifacts/self-hosted/souc-self-hosted-arm64-macos
          cp /tmp/source-bootstrap-macos/souc-lean-check-arm64-macos artifacts/self-hosted/souc-lean-check-arm64-macos
          chmod +x artifacts/self-hosted/souc-lean-check-arm64-macos
      - name: Native acceptance gate
        env:
          SOUC_NATIVE: artifacts/self-hosted/souc-self-hosted-arm64-macos
          # The proof harness needs lean.sio's --check + E-code diagnostics; the
          # lean_single seed under test (SOUC_NATIVE) has neither. Mirror x86.
          SOUC_TYPECHECK_NATIVE: artifacts/self-hosted/souc-lean-check-arm64-macos
          WORK_DIR: /tmp/sounio-native-acceptance-macos-arm64
          SOUNIO_MACOS_CRASH_DIAG: "1"
        run: bash scripts/selfhost/selfhost_native_acceptance_gate.sh
      - name: Host self-host gate
        env:
          SOUNIO_DARWIN_SELFHOST_EXEC_MODE: attest
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Upload Apple self-host artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apple-selfhost
          path: |
            /tmp/sounio-selfhost-macos-arm64
            /tmp/sounio-native-acceptance-macos-arm64
          retention-days: 7

  open-release-blockers:
    name: Open Release Blockers
    runs-on: ubuntu-24.04
    steps:
      - name: Check open release-blocker issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label release-blocker \
            --json number,title,url \
            --jq '.[] | "#\(.number) \(.title) \(.url)"' \
            > /tmp/open-release-blockers.txt
          if [ -s /tmp/open-release-blockers.txt ]; then
            echo "OPEN_RELEASE_BLOCKERS"
            cat /tmp/open-release-blockers.txt
            exit 1
          fi
          echo "NO_OPEN_RELEASE_BLOCKERS"

  release-dashboard:
    name: Release Dashboard
    runs-on: ubuntu-24.04
    needs: [seed-policy, rust-free-proof, lsp-smoke, full-selfhost, source-bootstrap-selfhost, apple-selfhost, open-release-blockers]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Generate dashboard
        run: |
          echo "# Release Readiness — $(date -u +%Y-%m-%d)" > /tmp/release-status.md
          echo "" >> /tmp/release-status.md
          echo "| Gate | Status |" >> /tmp/release-status.md
          echo "|------|--------|" >> /tmp/release-status.md
          echo "| Seed Policy | ${{ needs.seed-policy.result }} |" >> /tmp/release-status.md
          echo "| Rust-Free Proof | ${{ needs.rust-free-proof.result }} |" >> /tmp/release-status.md
          echo "| LSP Smoke | ${{ needs.lsp-smoke.result }} |" >> /tmp/release-status.md
          echo "| Full Self-Host | ${{ needs.full-selfhost.result }} |" >> /tmp/release-status.md
          echo "| Source-Bootstrap Self-Host | ${{ needs.source-bootstrap-selfhost.result }} |" >> /tmp/release-status.md
          echo "| Apple Self-Host | ${{ needs.apple-selfhost.result }} |" >> /tmp/release-status.md
          echo "| Open Release Blockers | ${{ needs.open-release-blockers.result }} |" >> /tmp/release-status.md
          cat /tmp/release-status.md
