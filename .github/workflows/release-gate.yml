name: Release Gate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seed-policy:
    name: Seed Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve souc binary
        run: bash scripts/build/fix_ci_binary.sh
      - name: Verify no-rust policy
        run: |
          if [ -f scripts/omega/omega_policy_status.sh ]; then
            bash scripts/omega/omega_policy_status.sh || echo "SEED_POLICY_WARN"
          else
            echo "SEED_POLICY_SKIP (script not found)"
          fi

  rust-free-proof:
    name: Rust-Free Proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Runtime proof
        run: |
          if [ -f scripts/build/rust_free_seed_runtime_proof.sh ]; then
            bash scripts/build/rust_free_seed_runtime_proof.sh || echo "RUST_FREE_WARN"
          else
            echo "RUST_FREE_SKIP (script not found)"
          fi

  lsp-smoke:
    name: LSP Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      OMEGA_SOUC_REQUIRE_PINNED: "1"
      OMEGA_SOUC_ALLOW_LOCAL_FALLBACK: "0"
      SOUNIO_REPO_HARD_NO_RUST: "1"
      SOUNIO_LSP_STRICT_NO_RUST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Resolve souc binary
        env:
          SOUNIO_CI_SOUC_VERSION: "0.100.3"
        run: bash scripts/build/fix_ci_binary.sh
      - name: Run LSP smoke
        run: bash scripts/ci/lsp_smoke_gate.sh
      - name: Verify markers
        run: |
          LOG="${LSP_SMOKE_LOG_PATH:-artifacts/omega/lsp_smoke.log}"
          test -s "$LOG" && grep -F -q "LSP_SMOKE_PASS" "$LOG" || echo "LSP_SMOKE_WARN"

  full-selfhost:
    name: Full Self-Host (5 generations)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 5-generation bootstrap
        run: |
          bash scripts/ci/build_native_souc.sh /tmp/souc.elf
          for i in 1 2 3 4 5; do
            /tmp/souc.elf self-hosted/compiler/lean_single.sio /tmp/gen${i}.elf 2>/dev/null
            chmod +x /tmp/gen${i}.elf
            cp /tmp/gen${i}.elf /tmp/souc.elf
            echo "gen${i}: $(md5sum /tmp/gen${i}.elf | cut -d' ' -f1)"
          done
          if cmp -s /tmp/gen4.elf /tmp/gen5.elf; then
            echo "FULL_SELFHOST_FIXED_POINT_PASS"
          else
            echo "FULL_SELFHOST_FIXED_POINT_FAIL"
            exit 1
          fi
      - name: Full feature gate
        run: |
          cp /tmp/gen4.elf /tmp/final_boot4.elf
          chmod +x /tmp/final_boot4.elf
          bash scripts/ci/souc_v2_gate.sh

  source-bootstrap-selfhost:
    name: Source-Bootstrap Self-Host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-source-bootstrap-release-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Source-bootstrap host self-host gate
        run: bash scripts/codex/action-source-bootstrap-host-gate.sh
      - name: Upload source-bootstrap release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-source-bootstrap-selfhost
          path: /tmp/sounio-source-bootstrap-release-linux-x86_64
          retention-days: 7

  apple-selfhost:
    name: Apple Self-Host
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Host self-host gate
        run: bash scripts/ci/selfhost_host_gate.sh

  release-dashboard:
    name: Release Dashboard
    runs-on: ubuntu-24.04
    needs: [seed-policy, rust-free-proof, lsp-smoke, full-selfhost, source-bootstrap-selfhost, apple-selfhost]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Generate dashboard
        run: |
          echo "# Release Readiness — $(date -u +%Y-%m-%d)" > /tmp/release-status.md
          echo "" >> /tmp/release-status.md
          echo "| Gate | Status |" >> /tmp/release-status.md
          echo "|------|--------|" >> /tmp/release-status.md
          echo "| Seed Policy | ${{ needs.seed-policy.result }} |" >> /tmp/release-status.md
          echo "| Rust-Free Proof | ${{ needs.rust-free-proof.result }} |" >> /tmp/release-status.md
          echo "| LSP Smoke | ${{ needs.lsp-smoke.result }} |" >> /tmp/release-status.md
          echo "| Full Self-Host | ${{ needs.full-selfhost.result }} |" >> /tmp/release-status.md
          echo "| Source-Bootstrap Self-Host | ${{ needs.source-bootstrap-selfhost.result }} |" >> /tmp/release-status.md
          echo "| Apple Self-Host | ${{ needs.apple-selfhost.result }} |" >> /tmp/release-status.md
          cat /tmp/release-status.md
