name: Pireus Restore Capsule

on:
  pull_request:
    paths:
      - '.github/workflows/pireus-restore-capsule.yml'
      - 'stdlib/coordination/spark_pair_restore_capsule.sio'
      - 'tools/cluster/spark_pair_restore_capsule*'
      - 'scripts/dev/build_sounio_spark_pair_restore_capsule.sh'
      - 'scripts/ci/spark_pair_restore_capsule_selftest.sh'
      - 'tests/fixtures/spark_pair_arbiter/spark_pair_restore_capsule_vectors.sio'
      - 'docs/internal/concepts/spark-pair-reversible-decommission.md'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pireus-restore-capsule.yml'
      - 'stdlib/coordination/spark_pair_restore_capsule.sio'
      - 'tools/cluster/spark_pair_restore_capsule*'
      - 'scripts/dev/build_sounio_spark_pair_restore_capsule.sh'
      - 'scripts/ci/spark_pair_restore_capsule_selftest.sh'
      - 'tests/fixtures/spark_pair_arbiter/spark_pair_restore_capsule_vectors.sio'
      - 'docs/internal/concepts/spark-pair-reversible-decommission.md'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-capsule-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Sounio capsule authority and freeze
        run: bash scripts/ci/spark_pair_restore_capsule_selftest.sh
      - name: Parse orchestration surfaces
        run: |
          bash -n scripts/dev/build_sounio_spark_pair_restore_capsule.sh
          bash -n scripts/ci/spark_pair_restore_capsule_selftest.sh
      - name: Validate semantic registry
        run: bash scripts/dev/sounio_semantic_status.sh
