name: External ecosystem consumers
on:
  pull_request:
    paths:
      - ecosystem/docker/**
      - ecosystem/external-releases.json
      - scripts/ci/fetch_external_ecosystem.py
      - .github/workflows/ecosystem-consumers.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jupyter-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned consumer image
        run: docker build -f ecosystem/docker/Dockerfile -t sounio-consumer:test .
      - name: Validate installed compiler and packages
        run: |
          docker run --rm sounio-consumer:test python -c "import sounio, sounio_kernel; from sounio import SounioExecutor; result = SounioExecutor().run_code('fn main() with IO { print_int(42) }'); assert '42' in result.stdout, result"
          docker run --rm sounio-consumer:test jupyter kernelspec list --json
