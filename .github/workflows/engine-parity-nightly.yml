name: Engine parity nightly

# Differential engine parity (#1978): lean_single vs Madaros compile+run stdout
# compared against tests/engine_parity_baseline.txt (1007 known non-AGREE rows).
# lean_single fixed-point is a separate job — different failure modes, different
# timeouts (measured 2026-09-11 on sounio-workspace main: fixed-point ~7s;
# engine_parity ~13 min when Madaros is not stale vs self-hosted sources).

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'self-hosted/compiler/lean_single.sio'
      - 'tests/engine_parity_baseline.txt'
      - 'scripts/ci/engine_parity_gate.sh'
      - 'scripts/ci/lean_single_fixed_point_gate.sh'
      - '.github/workflows/engine-parity-nightly.yml'

concurrency:
  group: engine-parity-nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean-single-fixed-point:
    name: lean_single fixed point
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Seed self-compile fixed point
        run: |
          ulimit -s unlimited || true
          export SOUNIO_STDLIB_PATH="$(pwd)/stdlib"
          bash scripts/ci/lean_single_fixed_point_gate.sh

  engine-parity:
    name: Engine parity baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Differential parity (committed prebuilts)
        run: |
          ulimit -s unlimited || true
          export SOUNIO_STDLIB_PATH="$(pwd)/stdlib"
          export SOUNIO_PARITY_MADAROS="$(pwd)/bin/madaros-linux-x86_64"
          export SOUNIO_PARITY_LEAN="$(pwd)/bin/souc-lean-single-x86_64"
          export SOUNIO_PARITY_JOBS=4
          export SOUNIO_PARITY_TIMEOUT=120
          bash scripts/ci/engine_parity_gate.sh
