name: CI Fabric Pool Smoke (dormant)

# Reachability proof for the first Sounio CI Fabric self-hosted runner pool.
# Groundwork only -- see slurm-jobs/sounio-ci-fabric/RUNNER_SETUP.md. Dormant
# until an operator deploys the pool (RUNNER_SETUP.md) and sets both repo
# variables below; until then this job is always skipped and never shows
# false red/green, the same pattern kaxi-ptx-acceptance.yml already uses.
#
# workflow_dispatch only, deliberately: no pull_request trigger at all, so
# scripts/dev/check_self_hosted_runner_fork_exposure.sh
# (docs/ops/fork_pr_self_hosted_runner_policy.md) is satisfied trivially
# rather than by a guard a later edit could remove. A future workflow that DOES
# want to run pool jobs on pull_request must add that guard itself.
#
# ── REQUIRED INFRA (provision before enabling) ──────────────────────────────
#   1. Deploy the pool: slurm-jobs/sounio-ci-fabric/RUNNER_SETUP.md.
#   2. Repo variable  SOUNIO_ENABLE_CI_FABRIC_POOL = "1"
#   3. Repo variable  SOUNIO_CI_FABRIC_RUNNER_LABELS = "ci-fabric"
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: ci-fabric-pool-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Pool reachability smoke test
    # Both variables required, and no 'ubuntu-latest' runs-on fallback: with
    # only the enable flag set and the label variable missing/misspelled, a
    # fallback would run this job on a GitHub-hosted runner and report
    # success -- a false-positive "pool reachable" receipt that never touched
    # the pool. A missing/misspelled label now leaves the job skipped instead.
    if: vars.SOUNIO_ENABLE_CI_FABRIC_POOL == '1' && vars.SOUNIO_CI_FABRIC_RUNNER_LABELS != ''
    runs-on: ${{ vars.SOUNIO_CI_FABRIC_RUNNER_LABELS }}
    timeout-minutes: 5
    steps:
      - name: Confirm this job landed on the CI Fabric pool
        run: |
          echo "runner name: $RUNNER_NAME"
          echo "expected label: ${{ vars.SOUNIO_CI_FABRIC_RUNNER_LABELS }}"
          nproc || true
          free -h || true
