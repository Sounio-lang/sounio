name: Rust-Free Seed Runtime Proof

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  cultural-fidelity:
    name: Cultural Fidelity Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run cultural fidelity gate
        id: cultural-fidelity-gate
        continue-on-error: true
        run: python3 scripts/cultural_fidelity_gate.py
      - name: Surface cultural fidelity status
        if: always()
        run: |
          if [ "${{ steps.cultural-fidelity-gate.outcome }}" != "success" ]; then
            echo "::warning::Cultural fidelity scanning is non-blocking until concrete scan targets are defined."
          fi

  resolve-souc-linux:
    name: Resolve souc release (artifact for rust-free proof)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned souc release binary
        env:
          SOUNIO_CI_SOUC_VERSION: "0.100.3"
          OMEGA_SOUC_REQUIRE_PINNED: "1"
          OMEGA_SOUC_ALLOW_LOCAL_FALLBACK: "0"
        run: bash scripts/fix_ci_binary.sh
      - name: Stage souc release artifact
        run: |
          mkdir -p /tmp/sounio-bin
          cp "$SOUC_BIN" /tmp/sounio-bin/souc
          chmod +x /tmp/sounio-bin/souc
      - name: Upload souc artifact
        uses: actions/upload-artifact@v4
        with:
          name: souc-linux-x86_64-release
          path: /tmp/sounio-bin/souc
          retention-days: 7

  rust-free-seed-runtime-proof:
    name: Rust-Free Seed Runtime Proof (release-blocking)
    runs-on: ubuntu-24.04
    needs:
      - resolve-souc-linux
    container:
      image: ubuntu:24.04
    steps:
      - name: Install checkout dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Download souc artifact
        uses: actions/download-artifact@v4
        with:
          name: souc-linux-x86_64-release
          path: /tmp/sounio-bin
      - name: Ensure binary is executable
        run: chmod +x /tmp/sounio-bin/souc
      - name: Run rust-free seed runtime proof
        env:
          SOUC_BIN: /tmp/sounio-bin/souc
          WORK_DIR: /tmp/sounio-rust-free-seed-proof
        run: bash scripts/rust_free_seed_runtime_proof.sh
      - name: Upload rust-free proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-free-seed-runtime-proof-logs
          path: /tmp/sounio-rust-free-seed-proof/
          retention-days: 7
