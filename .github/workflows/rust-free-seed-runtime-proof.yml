name: Rust-Free Seed Runtime Proof

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  cultural-fidelity:
    name: Cultural Fidelity Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run cultural fidelity gate
        run: python3 scripts/cultural_fidelity_gate.py

  rust-free-seed-runtime-proof:
    name: Rust-Free Seed Runtime Proof (release-blocking)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install checkout dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3
      - uses: actions/checkout@v4
      - name: Resolve pinned souc binary
        run: |
          chmod +x scripts/omega/omega_resolve_souc_bin.sh
          SOUC_BIN="$(
            SOUNIO_SOUC_VERSION=0.100.3 \
            OMEGA_SOUC_REQUIRE_PINNED=1 \
            OMEGA_SOUC_ALLOW_LOCAL_FALLBACK=0 \
              scripts/omega/omega_resolve_souc_bin.sh --print-path
          )"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"
      - name: Assert Rust toolchain is unavailable
        run: |
          if command -v rustc >/dev/null 2>&1; then
            echo "error: rustc is available in rust-free proof environment"
            exit 1
          fi
          if command -v cargo >/dev/null 2>&1; then
            echo "error: cargo is available in rust-free proof environment"
            exit 1
          fi
      - name: Run rust-free seed runtime proof
        env:
          WORK_DIR: /tmp/sounio-rust-free-seed-proof
        run: bash scripts/rust_free_seed_runtime_proof.sh
      - name: Upload rust-free proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-free-seed-runtime-proof-logs
          path: /tmp/sounio-rust-free-seed-proof/
          retention-days: 7
