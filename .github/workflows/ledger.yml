name: Ledger

# Validation for tools/ledger (the Sounio work as one spreadsheet).
# This checks the GENERATOR only: verdict logic under unit tests, plus an
# offline smoke build of the workbook. It does NOT run --verify, i.e. it does
# not re-execute the scientific producers; that is a local, minutes-long run
# documented in docs/ledger/README.md.

on:
  pull_request:
    paths:
      - "tools/ledger/**"
      - "docs/ledger/**"
      - ".github/workflows/ledger.yml"
  push:
    branches: [main]
    paths:
      - "tools/ledger/**"
      - "docs/ledger/**"
      - ".github/workflows/ledger.yml"
  workflow_dispatch:

concurrency:
  group: ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: Ledger generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openpyxl
        run: python3 -m pip install openpyxl
      - name: Producer-verdict unit tests
        run: python3 -m unittest -v tools/ledger/test_build_ledger.py
      - name: Offline smoke build (no GitHub, no --verify)
        run: |
          python3 tools/ledger/build_ledger.py --out /tmp/sounio_ledger.xlsx --no-github
          python3 - <<'EOF'
          import openpyxl
          wb = openpyxl.load_workbook("/tmp/sounio_ledger.xlsx")
          want = ["Resumo", "Linhas de pesquisa", "Issues e PRs", "Limitações", "Resultados"]
          assert wb.sheetnames == want, wb.sheetnames
          assert wb["Resultados"].max_row > 1, "Resultados is empty"
          print("ledger workbook OK:", wb.sheetnames)
          EOF
