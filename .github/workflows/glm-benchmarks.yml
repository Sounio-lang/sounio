name: GLM-4.7 Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run benchmarks daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  GLM_API_KEY: ${{ secrets.GLM_API_KEY }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      glm_enabled: ${{ steps.glm-key.outputs.glm_enabled }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate workflow script references
      run: |
        bash scripts/check_workflow_script_refs.sh

    - name: Check GLM API key
      id: glm-key
      env:
        GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      run: |
        if [ -n "$GLM_API_KEY" ]; then
          echo "glm_enabled=true" >> "$GITHUB_OUTPUT"
          echo "GLM API key detected. Running benchmark workflow."
        else
          echo "glm_enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::GLM_API_KEY is not configured; GLM benchmark workflow will skip benchmark steps."
        fi

    - name: Skip benchmark run (missing GLM key)
      if: steps.glm-key.outputs.glm_enabled != 'true'
      run: |
        echo "::notice::Skipping GLM benchmark execution because GLM_API_KEY is unavailable."

    - name: Setup Rust
      if: steps.glm-key.outputs.glm_enabled == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache cargo registry
      if: steps.glm-key.outputs.glm_enabled == 'true'
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      if: steps.glm-key.outputs.glm_enabled == 'true'
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      if: steps.glm-key.outputs.glm_enabled == 'true'
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies
      if: steps.glm-key.outputs.glm_enabled == 'true'
      run: |
        sudo apt-get update
        WEBKIT_DEV_PACKAGE="libwebkit2gtk-4.1-dev"
        if ! apt-cache show "$WEBKIT_DEV_PACKAGE" >/dev/null 2>&1; then
          WEBKIT_DEV_PACKAGE="libwebkit2gtk-4.0-dev"
        fi
        echo "Installing WebKit development package: $WEBKIT_DEV_PACKAGE"
        sudo apt-get install -y \
          libgtk-3-dev \
          "$WEBKIT_DEV_PACKAGE" \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Install Python dependencies
      if: steps.glm-key.outputs.glm_enabled == 'true'
      run: |
        python3 -m pip install --upgrade pip
        pip3 install matplotlib pandas numpy

    - name: Build compiler (Traditional)
      if: steps.glm-key.outputs.glm_enabled == 'true'
      run: |
        cargo build -p souc --release

    - name: Build compiler (GLM)
      if: steps.glm-key.outputs.glm_enabled == 'true'
      run: |
        cargo build -p souc --release --features glm

    - name: Run GLM Benchmarks
      if: steps.glm-key.outputs.glm_enabled == 'true'
      run: |
        bash scripts/run_glm_benchmarks.sh comprehensive

    - name: Generate Dashboard
      if: steps.glm-key.outputs.glm_enabled == 'true'
      run: |
        python3 scripts/glm_dashboard.py --charts

    - name: Validate benchmark outputs
      if: steps.glm-key.outputs.glm_enabled == 'true'
      run: |
        test -d benchmark_results
        find benchmark_results -maxdepth 1 -type f -name '*.json' | grep -q .
        test -s benchmark_report.md
        test -s glm_performance_dashboard.html
        test -s performance_comparison.png
        test -s optimization_impact.png
        test -s epistemic_analysis.png
        test -s cache_performance.png

    - name: Upload benchmark results
      if: steps.glm-key.outputs.glm_enabled == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        if-no-files-found: error
        path: |
          benchmark_results/
          glm_performance_dashboard.html
          performance_comparison.png
          optimization_impact.png
          epistemic_analysis.png
          cache_performance.png

    - name: Upload benchmark report
      if: steps.glm-key.outputs.glm_enabled == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-report
        if-no-files-found: error
        path: benchmark_report.md
