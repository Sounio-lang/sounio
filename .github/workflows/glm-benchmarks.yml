name: GLM-4.7 Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run benchmarks daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  GLM_API_KEY: ${{ secrets.GLM_API_KEY }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.0-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev
    
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install matplotlib pandas numpy
    
    - name: Build compiler (Traditional)
      run: |
        cargo build -p souc --release

    - name: Build compiler (GLM)
      run: |
        cargo build -p souc --release --features glm
    
    - name: Run GLM Benchmarks
      run: |
        chmod +x scripts/run_glm_benchmarks.sh
        ./scripts/run_glm_benchmarks.sh comprehensive
    
    - name: Generate Dashboard
      run: |
        python3 scripts/glm_dashboard.py --charts
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: |
          benchmark_results/
          glm_performance_dashboard.html
          *.png
    
    - name: Upload benchmark report
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-report
        path: benchmark_report.md
    
    - name: Check for regressions
      run: |
        ./scripts/check_regressions.sh

  regression-analysis:
    runs-on: ubuntu-latest
    needs: benchmark
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history for regression analysis
        fetch-depth: 0
    
    - name: Download previous benchmark results
      uses: actions/download-artifact@v3
      with:
        name: benchmark-results
        path: previous_results/
    
    - name: Compare with baseline
      run: |
        echo "Comparing current results with baseline..."
        ./scripts/compare_benchmarks.sh current_results/ previous_results/
    
    - name: Generate regression report
      run: |
        ./scripts/generate_regression_report.sh > regression_report.md
    
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const regressionReport = fs.readFileSync('regression_report.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Performance Regression Analysis\n\n${regressionReport}`
          });

  performance-alerts:
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'schedule' || github.event_name == 'push'
    
    steps:
    - name: Setup monitoring
      run: |
        echo "Setting up performance monitoring alerts..."
        # This would integrate with monitoring systems like Prometheus, Grafana, or custom alerting
    
    - name: Check performance thresholds
      run: |
        ./scripts/check_performance_thresholds.sh
    
    - name: Send alerts (if thresholds exceeded)
      if: failure()
      run: |
        echo "Performance thresholds exceeded. Sending alerts..."
        # This would send notifications to Slack, email, or other notification systems
        # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"Performance regression detected!"}' $SLACK_WEBHOOK_URL

  benchmark-comparison:
    runs-on: ubuntu-latest
    needs: benchmark
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download benchmark results
      uses: actions/download-artifact@v3
      with:
        name: benchmark-results
        path: current_results/
    
    - name: Download historical benchmarks
      uses: actions/download-artifact@v3
      with:
        name: historical-benchmarks
        path: historical_data/
    
    - name: Run trend analysis
      run: |
        python3 scripts/trend_analysis.py \
          --current current_results/ \
          --historical historical_data/ \
          --output trend_analysis.json
    
    - name: Generate trend report
      run: |
        python3 scripts/generate_trend_report.py trend_analysis.json > trend_report.md
    
    - name: Upload trend analysis
      uses: actions/upload-artifact@v3
      with:
        name: trend-analysis
        path: |
          trend_analysis.json
          trend_report.md