name: FPGA Prototype Gates

# Manual-only: these gates need the pinned Futhark toolchain
# (ADR-021: Futhark 0.25.27) and g++ on the runner, which the
# standard CI runners do not provide. Dispatch this workflow from
# a machine that has them (the Sounio workspace and VM 100
# vitis-u250-builder both do). The gates themselves fail loudly
# when the pinned toolchain is absent or drifted.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fpga-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SAN scan Futhark reference (ADR-021)
        run: bash scripts/ci/san_fpga_futhark_reference_gate.sh

      - name: FPGA prototype gate (SAN scan, ADR-022)
        run: bash scripts/ci/fpga_prototype_gate.sh
