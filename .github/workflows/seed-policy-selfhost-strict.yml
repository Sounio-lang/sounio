name: Seed Policy Strict Mode Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  seed-policy-selfhost-strict:
    name: Seed Policy selfhost_strict_mode (release-blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run targeted seed-policy selfhost strict-mode tests
        run: |
          cargo test -p souc --test selfhost_strict_mode -- selfhost_root_seed_enforce
          cargo test -p souc --test selfhost_strict_mode -- selfhost_root_transition_mode
