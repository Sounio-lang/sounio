name: Madaros Prebuilt Refresh

# Keeps the checked-in Madaros default current with self-hosted/compiler/main.sio.
# The ELF is ~95 MB, close to GitHub's 100 MB per-file limit, so it is committed
# compressed: bin/madaros-linux-x86_64.gz (gzip -n -9, ~11.6 MB) plus
# bin/madaros-linux-x86_64.sha256 (sha256 of the uncompressed ELF). The ELF path
# itself is gitignored and generated by scripts/lib/materialize_madaros_prebuilt.sh.
# This runs on a WEEKLY schedule (and on-demand) rather than per push, and
# proposes a refresh only when the binary actually changed; git stores each
# refresh of the .gz as a ~3.3 MB delta.
#
# main is protected by a ruleset (PR + merge queue + required "CI Decision"),
# so a gated refresh lands as a pull request from the fixed branch
# bot/madaros-prebuilt-refresh, with auto-merge enabled so the merge queue takes
# it once CI is green. Every run force-updates that branch (never main) and
# reuses the open refresh PR instead of opening another. The direct
# `git push origin HEAD:main` this used to do was rejected by the ruleset from
# 2026-09-21 on, and the checked-in prebuilt silently stopped tracking source.
#
# The PR is pushed and opened with a GitHub App token (or a fine-grained PAT),
# never GITHUB_TOKEN: pushes and PRs made with GITHUB_TOKEN do not trigger other
# workflows, so CI -- and therefore "CI Decision" -- would never run on the PR
# or in the merge queue, and auto-merge would wait forever. Configure either
#   vars.MADAROS_REFRESH_APP_ID + secrets.MADAROS_REFRESH_APP_PRIVATE_KEY
#     (App permissions: Contents read/write, Pull requests read/write), or
#   secrets.MADAROS_REFRESH_PAT
#     (fine-grained, this repo only: Contents + Pull requests read/write).
# With neither configured a gated refresh fails red instead of drifting quietly.
# The commit does NOT carry [skip ci]: CI Decision is required for the merge.

run-name: Madaros prebuilt refresh (${{ github.event.inputs.ref || 'main' }})
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build Madaros from (default: main). Non-main refs are for verifying codegen fixes via the uploaded artifact before merge.'
        required: false
        default: main

# GITHUB_TOKEN only reads; all writes go through the refresh token (see above).
permissions:
  contents: read

concurrency:
  group: madaros-prebuilt-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild and propose bin/madaros-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          # The publish step authenticates with the refresh token, not this one.
          persist-credentials: false

      - name: Build Madaros (seed-decoupled)
        run: |
          export SOUNIO_STDLIB_PATH="$(pwd)/stdlib"
          # Seeds from the committed lean_single ELF (not the bin/souc wrapper).
          # A build/infra failure here is a real problem -> fail the job (red).
          make build-madaros
          test -s artifacts/self-hosted/madaros

      # Always upload the freshly-built binary (even when the gate later fails and
      # the prebuilt is not refreshed) so the build can be inspected/reproduced
      # off-CI — the lean_single seed cannot compile main.sio in every workspace.
      - name: Upload built Madaros for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madaros-built
          path: artifacts/self-hosted/madaros
          retention-days: 5
          if-no-files-found: ignore

      - name: Gate the built Madaros
        id: gate
        run: |
          export SOUNIO_STDLIB_PATH="$(pwd)/stdlib"
          # A GATE failure means current main's Madaros is not shippable (often
          # because main itself is broken) -> do NOT fail the job and do NOT
          # commit; keep the last-good prebuilt. Only a green gate refreshes.
          # The full gate is the broad contract; the enum + loop gates additionally
          # build+run enum-variant USE and for/while + break/continue (which the full
          # gate never exercised). The multimodule witness covers import-aware
          # bin/madaros check|run|build, which the full suite can miss when
          # source and the checked-in prebuilt drift. The source-to-ELF gate
          # covers the raw --native-v2-compile bridge, so a prebuilt that
          # regresses the direct source -> native-v2 -> ELF path is not shipped.
          # The self-parse gate is here because none of the five gates above ever
          # asked the compiler to read its own source tree. On 2026-08-03 a
          # Madaros that could not parse self-hosted/resolve/scope.sio would have
          # passed every one of them and been committed as the shipped prebuilt.
          # It reuses the ELF just built; it adds no build.
          if bash scripts/ci/madaros_full_gate.sh \
             && bash scripts/ci/madaros_enum_gate.sh \
             && bash scripts/ci/madaros_loop_gate.sh \
             && bash scripts/ci/madaros_multimodule_witness.sh \
             && SOUNIO_MADAROS_SELF_PARSE_BIN=artifacts/self-hosted/madaros bash scripts/ci/madaros_self_parse_gate.sh \
             && bash scripts/ci/madaros_source_to_elf_gate.sh; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A Madaros gate (full / enum / loop / multimodule witness / source-to-ELF) did not pass — keeping the existing prebuilt bin/madaros-linux-x86_64 (no refresh)."
          fi

      - name: Install built Madaros as the checked-in prebuilt
        if: steps.gate.outputs.passed == 'true' && (github.event.inputs.ref || 'main') == 'main'
        run: |
          cp artifacts/self-hosted/madaros bin/madaros-linux-x86_64
          chmod +x bin/madaros-linux-x86_64
          # The committed form is the gzip of the ELF plus the ELF's sha256. The
          # ELF path is gitignored; scripts/lib/materialize_madaros_prebuilt.sh
          # regenerates it from these two files in every other checkout.
          gzip -n -9 -c bin/madaros-linux-x86_64 > bin/madaros-linux-x86_64.gz
          (cd bin && sha256sum madaros-linux-x86_64 > madaros-linux-x86_64.sha256)
          gzip -dc bin/madaros-linux-x86_64.gz | cmp - bin/madaros-linux-x86_64
          bash scripts/lib/materialize_madaros_prebuilt.sh --verify
          # Emit the provenance receipt for the binary actually being shipped.
          # The receipt was previously hand-written, had no producer and no
          # consumer, and drifted until it described a file that no longer
          # existed. madaros_receipt_gate.sh verifies what this writes.
          bash scripts/ci/madaros_write_receipt.sh bin/madaros-linux-x86_64 \
            madaros_full_gate.sh \
            "full,enum,loop,multimodule_witness,self_parse,source_to_elf"

      # Which credential opens the refresh PR. Secrets cannot appear in `if:`, so
      # their presence is resolved here into a plain step output.
      - name: Select the refresh token
        id: auth
        if: steps.gate.outputs.passed == 'true' && (github.event.inputs.ref || 'main') == 'main'
        env:
          APP_ID: ${{ vars.MADAROS_REFRESH_APP_ID }}
          HAS_APP_KEY: ${{ secrets.MADAROS_REFRESH_APP_PRIVATE_KEY != '' }}
          HAS_PAT: ${{ secrets.MADAROS_REFRESH_PAT != '' }}
        run: |
          if [ -n "$APP_ID" ] && [ "$HAS_APP_KEY" = true ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PAT" = true ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the GitHub App token
        id: app-token
        if: steps.auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MADAROS_REFRESH_APP_ID }}
          private-key: ${{ secrets.MADAROS_REFRESH_APP_PRIVATE_KEY }}

      - name: Open or update the refresh PR if the prebuilt changed
        if: steps.gate.outputs.passed == 'true' && (github.event.inputs.ref || 'main') == 'main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.MADAROS_REFRESH_PAT }}
          GH_REPO: ${{ github.repository }}
          BRANCH: bot/madaros-prebuilt-refresh
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The .sha256 changes exactly when the ELF does. The .gz alone is not a
          # reliable signal: a different gzip version can re-encode the same ELF.
          CHANGED=true
          git diff --quiet -- bin/madaros-linux-x86_64.sha256 && CHANGED=false

          if [ -z "${GH_TOKEN}" ]; then
            if [ "$CHANGED" = false ]; then
              echo "bin/madaros-linux-x86_64 is unchanged (same sha256) — nothing to propose."
              exit 0
            fi
            echo "::error::The gated Madaros differs from the checked-in prebuilt, but no refresh token is configured (vars.MADAROS_REFRESH_APP_ID + secrets.MADAROS_REFRESH_APP_PRIVATE_KEY, or secrets.MADAROS_REFRESH_PAT). GITHUB_TOKEN cannot be used: CI Decision would never run on its PR. See the header of this workflow."
            exit 1
          fi

          OPEN_PR="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"

          if [ "$CHANGED" = false ]; then
            echo "bin/madaros-linux-x86_64 is unchanged (same sha256) — nothing to propose."
            # main already ships what main builds, so an open refresh PR would
            # replace it with a binary from older source.
            if [ -n "$OPEN_PR" ]; then
              gh pr close "$OPEN_PR" --comment "Obsolete: a gated build of main ($(git rev-parse --short HEAD)) is identical to the prebuilt already on main. ${RUN_URL}"
            fi
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

          # Same binary already proposed: leave the branch alone so its CI and
          # merge-queue position are not reset for nothing.
          if [ -n "$OPEN_PR" ] && git fetch --quiet --depth=1 origin "$BRANCH" \
             && git show FETCH_HEAD:bin/madaros-linux-x86_64.sha256 | cmp -s - bin/madaros-linux-x86_64.sha256; then
            echo "PR #${OPEN_PR} already proposes this exact binary; not re-pushing."
            gh pr merge --auto --merge "$OPEN_PR"
            exit 0
          fi

          SRC_REF="$(git rev-parse --short HEAD)"
          BYTES="$(wc -c < bin/madaros-linux-x86_64)"
          GZ_BYTES="$(wc -c < bin/madaros-linux-x86_64.gz)"
          GATES="full, enum, loop, multimodule witness, self-parse, and source-to-ELF"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The receipt goes with the binary it describes, in the same commit.
          # Committing one without the other is how they drifted apart before.
          git add bin/madaros-linux-x86_64.gz bin/madaros-linux-x86_64.sha256 artifacts/self-hosted/madaros.gate-receipt
          git commit -m "build(madaros): refresh prebuilt bin/madaros-linux-x86_64

          Auto-rebuilt from ${SRC_REF} (make build-madaros) and passed the
          Madaros ${GATES} gates. Keeps the
          out-of-box Madaros default current with self-hosted/compiler/main.sio.
          Binary size: ${BYTES} bytes (${GZ_BYTES} bytes compressed)."

          # The bot branch is rebuilt from main every run: one commit on top of
          # the main that was built, so it is force-updated. main itself is only
          # ever reached through the PR and the merge queue.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          TITLE="build(madaros): refresh prebuilt bin/madaros-linux-x86_64 (${SRC_REF})"
          BODY="Automated refresh of the checked-in Madaros prebuilt.

          - Built from main at \`${SRC_REF}\` with \`make build-madaros\`.
          - Passed the Madaros ${GATES} gates.
          - \`bin/madaros-linux-x86_64.gz\`, \`.sha256\` and \`artifacts/self-hosted/madaros.gate-receipt\` change together in one commit.
          - ELF ${BYTES} bytes, ${GZ_BYTES} bytes gzipped.
          - Produced by ${RUN_URL}

          Auto-merge is enabled: this enters the merge queue once CI Decision is green. A later refresh run force-updates this branch and this PR rather than opening another."
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --title "$TITLE" --body "$BODY"
            PR="$OPEN_PR"
          else
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")"
            PR="${PR_URL##*/}"
          fi
          gh pr merge --auto --merge "$PR"
          echo "Refresh proposed in PR #${PR} (auto-merge via the merge queue)."
