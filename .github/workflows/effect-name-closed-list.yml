name: Effect-name closed list

# Accusation gate. Expected red while `with NomeQueNaoExiste` is accepted
# with no diagnostic, and while any used `with` name is absent from the
# list derived from effect_name_to_id. continue-on-error keeps the signal
# visible without making every unrelated PR unmergeable. Dedicated
# workflow because ci.yml is under another lane's claim; a gate that is
# not reachable is not a gate (#1994).

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: effect-name-closed-list-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closed-list:
    name: Effect-name closed list
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extractor controls
        run: bash scripts/ci/effect_name_closed_list_gate.sh --self-test
      - name: Scan and accusation
        continue-on-error: true
        env:
          EFFECT_NAME_CLOSED_LIST_SLURM: "0"
          EFFECT_NAME_CLOSED_LIST_ARTIFACT: artifacts/audit/effect_name_closed_list/status.json
          EFFECT_NAME_CLOSED_LIST_OUT: artifacts/audit/effect_name_closed_list
        run: bash scripts/ci/effect_name_closed_list_gate.sh
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-name-closed-list
          path: artifacts/audit/effect_name_closed_list/
          if-no-files-found: warn
