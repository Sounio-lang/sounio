name: Epistemic shape ratchet

# Text gate: no compiler engine. Runs on every PR and on main so a sixth
# Epistemic/Knowledge value shape cannot land unseen. Dedicated workflow
# because ci.yml is under another lane's claim; a gate that is not reachable
# is not a gate (#1978).

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: epistemic-shape-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Epistemic shape ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Frozen shapes
        run: bash scripts/ci/epistemic_shape_ratchet_gate.sh
      - name: Positive and negative controls
        run: bash scripts/ci/epistemic_shape_ratchet_gate.sh --self-test
