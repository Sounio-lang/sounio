name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      website: ${{ steps.classify.outputs.website }}
      compiler: ${{ steps.classify.outputs.compiler }}
      runtime: ${{ steps.classify.outputs.runtime }}
      stdlib: ${{ steps.classify.outputs.stdlib }}
      tests: ${{ steps.classify.outputs.tests }}
      lean: ${{ steps.classify.outputs.lean }}
      math: ${{ steps.classify.outputs.math }}
      ontology: ${{ steps.classify.outputs.ontology }}
      clinical: ${{ steps.classify.outputs.clinical }}
      sio: ${{ steps.classify.outputs.sio }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/classify_ci_impact.sh
      - name: Classifier self-test
        run: bash scripts/ci/impact_ci_selftest.sh

  contracts:
    name: Contracts
    needs: impact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow script references
        run: bash scripts/dev/check_workflow_script_refs.sh
      - name: Docs consistency
        run: bash scripts/dev/check_docs_consistency.sh
      - name: Docs registry
        run: bash scripts/dev/check_docs_registry.sh
      - name: Website docs support
        run: bash scripts/ci/sounio_website_docs_support_gate.sh
      - name: Package support
        run: bash scripts/ci/sounio_package_support_gate.sh
      - name: LoRA dataset assets
        run: bash scripts/ci/lora_assets_gate.sh
      - name: Issue template contracts
        run: bash scripts/ci/check_issue_template_contracts.sh
      - name: Legacy path hygiene
        run: bash scripts/ci/check_legacy_paths.sh
      - name: Heuristic metaphor-firewall gate
        run: |
          bash scripts/ci/heuristic_firewall_gate.sh --demo
          bash scripts/ci/heuristic_firewall_gate.sh
      # --- self-falsifying compilation line -------------------------------
      # The line's own W4_CI_WIRING clause, carried since R5: a chain of
      # custody guarded by a check nobody executes is aspirational. So the
      # rungs that are green on this branch are wired here, and the ones that
      # are not are named in the PR with the measurement that says why.
      #
      # Contract arm only. The compile arms (SFCL_R2_RUN_COMPILE,
      # SFCL_R17_RUN_COMPILE, SFCL_R20_RUN_COMPILE) need a purpose-built
      # self-hosted compiler and are deliberately NOT wired: a ~40 min build
      # per push is not a budget this repo has. Those rungs' behaviour
      # receipts are bound to the executor's sha256, so editing the executor
      # turns them red rather than certifying stale behaviour — which is why
      # R2, R17 and R20 are absent from the list below. They are red on the
      # research branch too, measured, not introduced by this PR.
      #
      # R22 needs `node` (it exercises the docs-registry checker end-to-end in
      # a hermetic hardlink farm, both control arms) and refuses rather than
      # passing if node is absent.
      #
      # The BASE gate is not wired either, and CI is what found that. Its
      # S4_RETROSPECTIVE clause audits three corrections by SHA (daa0635d0,
      # ec579a24c, eb38e9ce5), all branch-local to the functor-F lane. It
      # passed every local run because a git worktree SHARES THE OBJECT STORE
      # with the branch it was cut from, so those commits resolved; in CI's
      # fresh clone they do not, and the clause refuses rather than guessing.
      # Same reason R4 is absent. A gate that is green only in the environment
      # that authored it is not green.
      # Eight of the twenty gates below import numpy (R3, R7, R8, R9, R10, R15,
      # R16, R19) and this workflow installs no python dependencies anywhere.
      # CI is what established that: R3 died with ModuleNotFoundError before
      # printing a line, which is also why the branch's "21/21" was a LOCAL
      # measurement — in CI those eight had never run at all.
      #
      # Installing it is the smaller change. Dropping eight rungs to avoid one
      # pip install would be trading the checks for the convenience of not
      # running them, which is the exact failure R5's W4 clause names.
      - name: Self-falsifying compilation line — numpy
        run: python3 -m pip install --quiet --disable-pip-version-check numpy

      - name: Self-falsifying compilation line
        run: |
          for g in scripts/ci/self_falsifying_compilation_line_r1_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r3_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r7_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r8_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r9_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r10_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r12_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r13_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r14_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r15_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r16_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r19_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r21_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r22_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r23_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r24_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r25_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r27_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r28_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r29_gate.sh; do
            echo "--- $g"
            bash "$g"
          done

      # R6 is wired NIGHTLY, not per push, and the reason is measured rather
      # than guessed: its I3 clause sweeps every pair of research contracts,
      # O(pairs x functions^2). It takes ~957 s; the rest of the line costs
      # ~200 s together.
      #
      # This is the budget being stated instead of the gate being dropped: a
      # check too expensive to run on every push is not thereby exempt from
      # running, it just runs on a cadence the repo can pay for.
      - name: Self-falsifying compilation line (R6 corpus sweep, nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 25
        run: bash scripts/ci/self_falsifying_compilation_line_r6_gate.sh

      - name: Worktree governance gate
        run: bash scripts/dev/worktree_branch_audit.sh --check
      - name: Compiler lane status contract
        run: bash scripts/ci/compiler_lane_status_gate.sh
      # #1631: the committed boot4 was NOT what its own source produces, and
      # nothing noticed because every consumer just ran the checked-in blob.
      - name: Bootstrap boot4 artifact is its own fixed point (#1631)
        run: bash scripts/ci/verify_boot4_seed.sh
      - name: Extern builtin allow-list mirror (#1622)
        run: bash scripts/ci/extern_builtin_mirror_gate.sh
      - name: Live lane coordination self-test
        run: bash scripts/ci/sounio_coord_selftest.sh

      - name: Agent coordination hook self-test
        run: bash scripts/ci/sounio_coord_agent_hook_selftest.sh
      - name: Portable compiler build lock self-test
        run: python3 scripts/ci/souc_build_lock_selftest.py
      - name: CI watch receipt self-test
        run: python3 scripts/ci/ci_watch_receipt_selftest.py
      - name: Madaros changed-test selector self-test
        run: bash scripts/ci/madaros_changed_tests_selftest.sh
      - name: Executable payload comparator self-test
        run: bash scripts/ci/executable_payload_compare_selftest.sh
      # Arms 1-2 need no compiler and cost <1 s, so they run on every PR
      # including docs-only ones. That is what stops the self-parse gate rotting
      # into a no-op: `--science-boundary-closure` exits 0 even on `status
      # incomplete`, so a gate written against its exit code would pass forever
      # and look exactly like a working gate.
      - name: Madaros self-parse verdict self-test
        run: bash scripts/ci/madaros_self_parse_selftest.sh
      # The tracked receipt asserts a sha256 for a binary. On 2026-08-04 it
      # named an absolute host path, claimed a digest that did not match the file
      # on disk, cited a commit 1515 behind HEAD, and was read by zero lines of
      # code — while ~82 scripts resolved that binary as an oracle and
      # scripts/install.sh preferred it over the committed one.
      - name: Madaros prebuilt receipt matches its binary
        run: bash scripts/ci/madaros_receipt_gate.sh
      # 67% of gates carry no emptiness guard. This one is ratcheted: the known
      # set may only shrink, and a NEW gate without a guard is red.
      - name: Gates must not pass on no data
        run: bash scripts/ci/gate_vacuity_gate.sh
      # The shipped lean_single ELF must BE the byte-identical fixed point of
      # current lean_single.sio. This gate existed, passed, and was wired to no
      # workflow — so the one thing that would notice the shipped binary drifting
      # from source was never run. ~2 s.
      - name: Canonical lean_single fixed point
        run: bash scripts/ci/canonical_compiler_gate.sh
      - name: Output-path invariants
        run: bash scripts/dev/check_outpath_invariant.sh
      - name: Output-path leading-dash guard
        run: bash scripts/dev/check_outpath_leading_dash.sh
      - name: Claude operational contract
        run: bash scripts/ci/claude_operational_contract_gate.sh
      - name: Ontology validation
        if: needs.impact.outputs.ontology == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/run_ontology_validation.sh --mode rebuilt ontology
      - name: Ontology CLI smoke gate
        if: needs.impact.outputs.ontology == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/ontology_cli_smoke_gate.sh
      - name: Package-backed PBPK/GUM contract
        if: needs.impact.outputs.clinical == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/package_pbpk_gum_gate.sh
      - name: Sedenion zd168 cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_zd168_crosscheck_gate.sh
      - name: Sedenion exact unbounded-Q CD cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_cd_qbig_gate.sh
      - name: Sedenion e8-seam bridge cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_seam_bridge_gate.sh
      - name: CD tower seam cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/cd_tower_seam_gate.sh
      - name: Gresnigt G2xS3 cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/gresnigt_g2s3_gate.sh
      - name: Gresnigt family-S3 cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/gresnigt_family_s3_gate.sh
      - name: Furey charge / G2 cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/furey_charge_g2_gate.sh
      - name: Sedenion Gresnigt-octonions cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_gresnigt_octonions_gate.sh
      - name: Sedenion octonion-census cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_octonion_census_gate.sh
      - name: Sedenion Clifford-8 cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_clifford8_gate.sh
      - name: Sedenion ladder-extension cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_ladder_extension_gate.sh
      - name: Furey octonion generation cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/furey_octonion_gate.sh
      - name: Sedenion dynamics cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_dynamics_gate.sh
      - name: Sedenion spectra cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_spectra_gate.sh
      - name: Sedenion quartet-fiber incidence cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_quartet_fiber_incidence_gate.sh
      - name: Sedenion zd-quartets cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_zd_quartets_gate.sh
      - name: Sedenion associator-1848 cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_associator_1848_gate.sh
      - name: Sedenion fiber-identity cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_zd_fiber_identity_gate.sh
      - name: Sedenion zd-fibers cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_zd_fibers_gate.sh
      - name: Sedenion e8-boundary cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_e8_boundary_gate.sh
      - name: Rupture A+B+C+D contracts
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/rupture_abcd_contracts_gate.sh
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: artifacts/omega/claude_operational_contract_status.v1.json
          retention-days: 7

  native-selfhost-linux-x86_64:
    name: Native Self-Host (Linux x86_64)
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.runtime == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-linux-x86_64
      SOUNIO_FORCE_SOURCE_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Host self-host gate
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Feature gate (11 tests)
        run: |
          cp /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2 /tmp/final_boot4.elf
          chmod +x /tmp/final_boot4.elf
          bash scripts/ci/souc_v2_gate.sh
      - name: Native runtime proof (manifest)
        env:
          SOUC_NATIVE: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
        run: bash scripts/selfhost/selfhost_native_runtime_proof.sh
      - name: Upload native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload Linux self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64
          retention-days: 1

  source-bootstrap-selfhost-linux-x86_64:
    name: Source-Bootstrap Self-Host (Linux x86_64)
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Source-bootstrap host self-host gate
        run: bash scripts/codex/action-source-bootstrap-host-gate.sh
      - name: Cross-build macOS arm64 compiler artifact
        run: |
          SOUC_STAGE2=/tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          MACOS_OUT=/tmp/souc-self-hosted-arm64-macos
          "$SOUC_STAGE2" self-hosted/compiler/lean_single.sio "$MACOS_OUT" --target aarch64-macos
          chmod +x "$MACOS_OUT"
          file "$MACOS_OUT" | grep -E "Mach-O 64-bit.*arm64.*executable|Mach-O 64-bit.*executable.*arm64"
      - name: Cross-compile ARM64 nested-store witness
        env:
          SOUNIO_ARM64_WITNESS_COMPILER: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          SOUNIO_ARM64_WITNESS_DIR: /tmp/sounio-arm64-nested-store-witness
          SOUNIO_ARM64_WITNESS_MODE: attest
        run: bash scripts/ci/arm64_nested_store_witness_gate.sh
      - name: Cross-compile ARM64 array-element field-store witness
        env:
          SOUNIO_ARM64_WITNESS_COMPILER: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          SOUNIO_ARM64_WITNESS_DIR: /tmp/sounio-arm64-array-element-field-witness
          SOUNIO_ARM64_WITNESS_MODE: attest
          SOUNIO_ARM64_WITNESS_SOURCE: tests/run-pass/arm64_deref_array_element_field_store.sio
        run: bash scripts/ci/arm64_nested_store_witness_gate.sh
      - name: Source-bootstrap modular typecheck proof
        run: |
          SOUC_STAGE2=/tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          CHECK_OUT=/tmp/souc-self-hosted-linux-x86_64-check
          "$SOUC_STAGE2" self-hosted/compiler/lean.sio "$CHECK_OUT"
          chmod +x "$CHECK_OUT"
          "$CHECK_OUT" --help | grep -F -- "--check <source.sio>"
          "$CHECK_OUT" --check tests/run-pass/match_arm_unbraced_assignment.sio
          SOUC_NATIVE="$CHECK_OUT" \
            WORK_DIR=/tmp/sounio-source-bootstrap-native-typecheck-proof \
            bash scripts/selfhost/selfhost_native_typecheck_proof.sh
      - name: Upload source-bootstrap macOS compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-bootstrap-native-compiler-macos-arm64
          path: /tmp/souc-self-hosted-arm64-macos
          retention-days: 1
      - name: Upload source-bootstrap self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-bootstrap-selfhost-gate-linux-x86_64
          path: |
            /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
            /tmp/sounio-source-bootstrap-native-typecheck-proof
            /tmp/sounio-arm64-nested-store-witness
            /tmp/sounio-arm64-array-element-field-witness
          retention-days: 1

  madaros-current-source-deref-f64:
    name: Madaros Current-Source f64 Lowering
    needs: impact
    # `stdlib` is here for a measured reason: 7 files in main.sio's own import
    # closure live under stdlib/compiler/ontology/ and classify as stdlib, not
    # compiler. A PR that makes stdlib/compiler/ontology/store.sio unparseable
    # breaks the compiler's closure and, without this, runs none of these gates.
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # 15 held a full Madaros build plus four sub-gates; the self-parse sweep adds
    # ~20 s. The extra headroom is so a slow run reads as slow, not as a hang.
    timeout-minutes: 18
    env:
      SOUNIO_MADAROS_F64_LOWERING_GATE_DIR: /tmp/sounio-madaros-current-source-f64-lowering
      SOUNIO_MADAROS_F64_LOWERING_GATE_KEEP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Madaros once and run current-source f64 lowering gates
        run: bash scripts/ci/madaros_current_source_f64_lowering_gate.sh
      # The compiler must be able to read its own source tree. On 2026-08-03 one
      # built from main could not parse self-hosted/resolve/scope.sio; 417 gates
      # missed it and it was found by accident. Re-measured afterwards: 118 of
      # 559 files under self-hosted/ failed. This step reuses the ELF the step
      # above already built and kept (KEEP=1) — it adds no build.
      - name: Madaros parses its own source tree
        env:
          SOUNIO_MADAROS_SELF_PARSE_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
          SOUNIO_MADAROS_SELF_PARSE_REPORT_DIR: /tmp/sounio-madaros-current-source-f64-lowering/self-parse
        run: bash scripts/ci/madaros_self_parse_gate.sh
      - name: Run changed Madaros tests with the current-source compiler
        env:
          SOUNIO_MADAROS_CHANGED_TESTS_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOUNIO_TEST_JOBS: 4
        run: bash scripts/ci/madaros_changed_tests_gate.sh
      - name: Upload current-source f64 lowering logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madaros-current-source-f64-lowering
          path: /tmp/sounio-madaros-current-source-f64-lowering
          retention-days: 1

  native-selfhost-macos-arm64:
    name: Native Self-Host (macOS arm64)
    runs-on: macos-15
    needs: [impact, source-bootstrap-selfhost-linux-x86_64]
    if: always() && (needs.impact.outputs.compiler == 'true' || needs.impact.outputs.full == 'true') && needs.source-bootstrap-selfhost-linux-x86_64.result == 'success'
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download source-bootstrap macOS compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: source-bootstrap-native-compiler-macos-arm64
          path: /tmp/source-bootstrap-macos
      - name: Install source-bootstrap macOS compiler artifact
        run: |
          cp /tmp/source-bootstrap-macos/souc-self-hosted-arm64-macos artifacts/self-hosted/souc-self-hosted-arm64-macos
          chmod +x artifacts/self-hosted/souc-self-hosted-arm64-macos
      - name: Source-bootstrap macOS compiler artifact attestation
        run: |
          file artifacts/self-hosted/souc-self-hosted-arm64-macos | grep -E "Mach-O 64-bit.*arm64.*executable|Mach-O 64-bit.*executable.*arm64"
          if command -v codesign >/dev/null 2>&1; then
            codesign --verify artifacts/self-hosted/souc-self-hosted-arm64-macos || true
          fi
          mkdir -p /tmp/sounio-native-acceptance-macos-arm64/artifacts
          cat > /tmp/sounio-native-acceptance-macos-arm64/artifacts/summary.txt <<'EOF'
          mode=attest
          reason=darwin_host_execution_blocked
          source_bootstrap_artifact=artifacts/self-hosted/souc-self-hosted-arm64-macos
          EOF
      - name: Host self-host gate
        env:
          SOUNIO_DARWIN_SELFHOST_EXEC_MODE: attest
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Upload macOS native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-macos-arm64
          path: /tmp/sounio-selfhost-macos-arm64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload macOS self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-macos-arm64
          path: |
            /tmp/sounio-selfhost-macos-arm64
            /tmp/sounio-native-acceptance-macos-arm64
          retention-days: 1

  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-24.04
    needs: [impact, native-selfhost-linux-x86_64]
    if: always() && (needs.impact.outputs.compiler == 'true' || needs.impact.outputs.runtime == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true') && needs.native-selfhost-linux-x86_64.result == 'success'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download native compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp
      - name: Run full test suite
        env:
          SOUNIO_TEST_SOUC_BIN: /tmp/souc-stage2
          SOUNIO_TEST_JOBS: 4
        run: |
          chmod +x /tmp/souc-stage2
          bash scripts/run_sio_test_suite.sh --format junit --jobs 4
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  sounio-lint:
    name: Sounio Lint
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.sio == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all .sio files
        run: bash check_sounio.sh --summary

  lean-proofs:
    name: Lean Proofs
    needs: impact
    if: needs.impact.outputs.lean == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean4/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean4/lean-toolchain') }}
          restore-keys: lean-${{ runner.os }}-
      - name: Install elan (Lean toolchain manager)
        run: |
          if ! command -v elan &>/dev/null; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build all default-target proof modules
        run: |
          cd formal/lean4
          # Build every @[default_target] in lakefile.lean (currently 27).
          # Previously this step only built SounioGradedModal/MeasConf/
          # ProofObligation, which let other top-level modules (e.g.
          # SounioFloatInstance, SounioCausality, SounioPathionBridge)
          # silently rot without CI catching breakage. PR #66's audit
          # surfaced this — a PR adding a broken SounioFloatInstance
          # passed "Lean Proofs ✓" because no other module imported it.
          lake build
      - name: Verify egc_graded_soundness is axiom-free
        run: |
          cd formal/lean4
          cat > /tmp/axiom_check.lean <<'EOF'
          import SounioGradedModal
          #print axioms SounioGradedModal.egc_graded_soundness
          EOF
          lake env lean /tmp/axiom_check.lean 2>&1 | grep -v "propext\|Classical\|Quot" \
            | grep "axioms" && echo "unexpected axioms" && exit 1 || echo "✓ No unexpected axioms"

  website:
    name: Website
    needs: impact
    if: needs.impact.outputs.website == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Quality check
        run: npm --prefix website run check:quality

  ci-decision:
    name: CI Decision
    if: always()
    needs:
      - impact
      - contracts
      - native-selfhost-linux-x86_64
      - source-bootstrap-selfhost-linux-x86_64
      - madaros-current-source-deref-f64
      - native-selfhost-macos-arm64
      - full-test-suite
      - sounio-lint
      - lean-proofs
      - website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate selected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/evaluate_ci_decision.py
