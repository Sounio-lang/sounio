          chmod +x /tmp/souc-stage2
          bash scripts/run_sio_test_suite.sh --format junit --jobs 4
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  madaros-witness-gate:
    name: Madaros Witness Gate
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.runtime == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # Raised from 20 with the sabotage gate: it rebuilds each declared witness.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Madaros from this PR's own source
        run: |
          ulimit -s 1048576 2>/dev/null || true
          bash scripts/ci/build_modular_madaros.sh /tmp/madaros-ci.elf
      - name: Imported Seq lowering against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/madaros_imported_seed_lowering_gate.sh
      - name: Tier 0 witness matrix against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash tests/witness_matrix/run.sh ./bin/souc /tmp/madaros-ci.elf
      - name: Madaros full gate against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/madaros_full_gate.sh
      - name: Madaros source-to-ELF gate against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/madaros_source_to_elf_gate.sh
      - name: Parameterized Epistemic confidence floor against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
          SOUNIO_WITNESS_GLOB: tests/compiler/epistemic_payload_gate/*.sio
        run: bash scripts/ci/madaros_epistemic_payload_gate.sh
      # Full mode, not census: census reports passed=0/not_run=total, which would
      # satisfy the workflow-reference ratchet while the gate verified nothing --
      # the exact defect it was written to catch. This job already has a fresh
      # Madaros, so the real mode costs one rebuild per declared witness.
      - name: Witness sabotage declarations against the fresh build
        env:
          SOUNIO_WITNESS_SABOTAGE_MADAROS: /tmp/madaros-ci.elf
        run: bash scripts/ci/witness_declares_its_sabotage_gate.sh
      - name: propagate monte_carlo fn-ptr promotion (default Madaros)
        env:
          SOUNIO_STDLIB_PATH: ${{ github.workspace }}/stdlib
        run: bash scripts/ci/madaros_propagate_monte_carlo_fnptr_gate.sh
      # Grep correspondence lives in Contracts. This arm compiles the
      # E250 fixture against the Madaros just built from this commit.
      - name: E250 live refuse against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/e219_madaros_live_refuse.sh
      # Static ownership and sabotage run in Contracts; this arm proves that
      # the same source-fresh compiler emits the three source-reachable codes.
      # E248 remains structural-only because parser E249 preempts wide casts.
      - name: E247-E250 diagnostic remap against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/diagnostic_remap_2170_gate.sh --souc bin/souc
      # E229: the lexer's token-table / source-byte ceiling must REFUSE, never
      # silently drop input. Same family and same reason as the E219 arm above --
      # the committed ELF predates the refusal and still clips (measured
      # 2026-08-27: W1 rc=0 on lean_single, no E229), so this needs the Madaros
      # just built from this commit and cannot live in Contracts.
      - name: E229 token/source ceiling refuses against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/token_table_ceiling_gate.sh
      # E241: unknown Knowledge components must refuse on the Madaros just
      # built from this commit. The committed ELF still swallows them —
      # same class as E250 / E158, so this is Witness not Contracts.
      - name: E241 unknown Knowledge component live refuse against the fresh build
        env:
          MADAROS_RAW_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/knowledge_unknown_component_live_refuse.sh
      # #1798: forward inverse_of must be E158 on both engines. The committed
      # bin/madaros-linux-x86_64 still accepts the witness (check: OK) —
      # measured 2026-08-18 against origin/main. The gate requires an explicit
      # source-current ELF; putting it in Contracts would fail every PR.
      # Pure source analysis -- no build, no compiler run, so it sits before
      # anything expensive and fails in under a second. It has its own positive
      # control built in: it sabotages a copy of the table first and refuses to
      # report green unless that copy is rejected.
      # Same family and same cost: source analysis, sub-second, its own positive
      # control built in.
      - name: RelocationTable declared size agrees with its bound check
        run: bash scripts/ci/reloc_table_capacity_coherence_gate.sh
      - name: Builtin-id tables agree across all four dispatch sites
        run: bash scripts/ci/builtin_id_table_coherence_gate.sh
      - name: Ontology inverse_of declaration-order (E158) against the fresh build
        env:
          MADAROS_BIN: /tmp/madaros-ci.elf
        run: bash scripts/ci/madaros_ontology_enforcement_gate.sh

  gate-wave-0:
    name: Gate Wave 0
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.runtime == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Madaros from this PR's own source
        run: |
          ulimit -s 1048576 2>/dev/null || true
          bash scripts/ci/build_modular_madaros.sh /tmp/madaros-wave0.elf
      # First four of the 472 gate scripts that no workflow named (frozen count:
      # scripts/ci/gate_workflow_reference.frozen). Picked from the PASS
      # bucket of a from-source gate sweep, for the incident each one would
      # have caught rather than for convenience:
      #   - madaros_gum_cross_function_gate.sh: FO variance silently drops to
      #     0.000000 across a call boundary -- the same failure SHAPE as
      #     #1792 (epistemic fabrication), on a different surface.
      #   - gate_assert_instrument_selftest.sh: scripts/lib/gate_assert.sh
      #     underlies most gates in this repo, including this job's own
      #     run_gate_list.sh; an unverified shared assertion library fails
      #     silently for everything built on it, not just for itself.
      #   - parser_keyword_classification_gate.sh: an unclassified keyword
      #     cost real hours twice -- `policy` produced six misattributed
      #     errors, `level` produced thirteen parse errors that broke every
      #     importer of stdlib/plot/line.sio and got the dissertation's
      #     clinical validation test wrongly blamed. See the gate's own
      #     header for the measured cost.
      #   - compile_fail_harness_contract_gate.sh: positive control that the
      #     compile-fail harness rejects a crash, a timeout, or the wrong
      #     diagnostic as a pass -- a green run that proves nothing, applied
      #     to the harness every compile-fail test in the suite depends on.
      # A green Wave 0 means these four ran and returned what they claim to
      # measure -- not that Madaros, the parser, or the harness are healthy
      # in general.
      - name: Wave 0
        env:
          MADAROS_RAW_BIN: /tmp/madaros-wave0.elf
        run: |
          printf '%s\n' \
            scripts/ci/madaros_gum_cross_function_gate.sh \
            scripts/ci/gate_assert_instrument_selftest.sh \
            scripts/ci/parser_keyword_classification_gate.sh \
            scripts/ci/compile_fail_harness_contract_gate.sh \
            | bash scripts/ci/run_gate_list.sh wave0
      - name: Upload Wave 0 gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-wave-0
          path: artifacts/gates/wave0.json
          retention-days: 7

  sounio-lint:
    name: Sounio Lint
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.sio == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all .sio files
        run: bash check_sounio.sh --summary

  lean-proofs:
    name: Lean Proofs
    needs: impact
    if: needs.impact.outputs.lean == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean4/.lake
          # Keyed on the toolchain FILE, which is only meaningful now that the
          # file names a version. While it read `leanprover/lean4:stable` the
          # hash never changed even as `stable` advanced, so the cache pinned
          # the toolchain in place and hid the drift until an eviction. Do not
          # put a moving ref back in that file without changing this key too.
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean4/lean-toolchain') }}
          restore-keys: lean-${{ runner.os }}-
      - name: Install elan (Lean toolchain manager)
        run: |
          if ! command -v elan &>/dev/null; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      # Mutant (import V1, same theorem) must fail before the V2 consumer
      # is scored. A consumer that builds while the V1 mutant also builds
      # is mention, not use.
      - name: V2 measure-Nat consumer (V1 mutant must fail first)
        run: bash scripts/ci/epistemic_measure_correspondence_gate.sh --lean-consume
      # Same ritual as measure-Nat: mutant must fail before the consumer
      # is scored. A green Lean Proofs job whose this step is skipped is
      # the 390-gate class. Written as the acceptance criterion before
      # the step is scored.
      - name: V2 kvalue-Nat consumer (V1 mutant must fail first)
        run: bash scripts/ci/epistemic_measure_correspondence_gate.sh --lean-consume-kvalue
      # Same ritual. A green Lean Proofs job whose this step is skipped
      # is the 390-gate class. Written before the step is scored.
      - name: V2 invKraw-Nat consumer (V1 mutant must fail first)
        run: bash scripts/ci/epistemic_measure_correspondence_gate.sh --lean-consume-invkraw
      # Same ritual at T ≠ Nat. A green Lean Proofs job whose this step
      # is skipped is the 390-gate class. Written before the step is scored.
      - name: V2 invKraw-mg consumer (V1 mutant must fail first)
        run: bash scripts/ci/epistemic_measure_correspondence_gate.sh --lean-consume-invkraw-mg
      - name: Build all default-target proof modules
        run: |
          cd formal/lean4
          # Build every @[default_target] in lakefile.lean (currently 27).
          # Previously this step only built SounioGradedModal/MeasConf/
          # ProofObligation, which let other top-level modules (e.g.
          # SounioFloatInstance, SounioCausality, SounioPathionBridge)
          # silently rot without CI catching breakage. PR #66's audit
          # surfaced this — a PR adding a broken SounioFloatInstance
          # passed "Lean Proofs ✓" because no other module imported it.
          lake build
      # Paper A §6 NS metatheory (EpistemicEffectsNS): compiles, sorry-free, axiom
      # footprint ⊆ {propext, Quot.sound, Classical.choice}, load-bearing theorem
      # names present, registered as a default target. Named here so the
      # workflow-reference ratchet sees it run.
      - name: NS metatheory gate (Paper A §6, EpistemicEffectsNS)
        run: bash scripts/ci/ns_metatheory_lean_gate.sh
      - name: Verify egc_graded_soundness is axiom-free
        run: |
          cd formal/lean4
          cat > /tmp/axiom_check.lean <<'EOF'
          import SounioGradedModal
          #print axioms SounioGradedModal.egc_graded_soundness
          EOF
          lake env lean /tmp/axiom_check.lean 2>&1 | grep -v "propext\|Classical\|Quot" \
            | grep "axioms" && echo "unexpected axioms" && exit 1 || echo "✓ No unexpected axioms"

  website:
    name: Website
    needs: impact
    if: needs.impact.outputs.website == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Quality check
        run: npm --prefix website run check:quality

  ci-decision:
    name: CI Decision
    if: always()
    needs:
      - impact
      - contracts
      - native-selfhost-linux-x86_64
      - source-bootstrap-selfhost-linux-x86_64
      - madaros-current-source-deref-f64
      - native-selfhost-macos-arm64
      - full-test-suite
      - madaros-witness-gate
      - gate-wave-0
      - sounio-lint
      - lean-proofs
      - website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate selected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/evaluate_ci_decision.py
