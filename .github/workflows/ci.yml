  native-selfhost-linux-x86_64:
    name: Native Self-Host (Linux x86_64)
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.runtime == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-linux-x86_64
      SOUNIO_FORCE_SOURCE_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Host self-host gate
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Aggregate field identity across module boundaries
        env:
          SOUNIO_AGGREGATE_FIELD_SEED: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
        run: bash scripts/ci/aggregate_field_identity_gate.sh
      - name: Feature gate (11 tests)
        run: |
          cp /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2 /tmp/final_boot4.elf
          chmod +x /tmp/final_boot4.elf
          bash scripts/ci/souc_v2_gate.sh
      - name: Native runtime proof (manifest)
        env:
          SOUC_NATIVE: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
        run: bash scripts/selfhost/selfhost_native_runtime_proof.sh
      - name: Upload native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload Linux self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64
          retention-days: 1

  source-bootstrap-selfhost-linux-x86_64:
    name: Source-Bootstrap Self-Host (Linux x86_64)
    needs: impact
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Source-bootstrap host self-host gate
        run: bash scripts/codex/action-source-bootstrap-host-gate.sh
      - name: Cross-build macOS arm64 compiler artifact
        run: |
          SOUC_STAGE2=/tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          MACOS_OUT=/tmp/souc-self-hosted-arm64-macos
          "$SOUC_STAGE2" self-hosted/compiler/lean_single.sio "$MACOS_OUT" --target aarch64-macos
          chmod +x "$MACOS_OUT"
          file "$MACOS_OUT" | grep -E "Mach-O 64-bit.*arm64.*executable|Mach-O 64-bit.*executable.*arm64"
      - name: Cross-compile ARM64 nested-store witness
        env:
          SOUNIO_ARM64_WITNESS_COMPILER: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          SOUNIO_ARM64_WITNESS_DIR: /tmp/sounio-arm64-nested-store-witness
          SOUNIO_ARM64_WITNESS_MODE: attest
        run: bash scripts/ci/arm64_nested_store_witness_gate.sh
      - name: Cross-compile ARM64 array-element field-store witness
        env:
          SOUNIO_ARM64_WITNESS_COMPILER: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          SOUNIO_ARM64_WITNESS_DIR: /tmp/sounio-arm64-array-element-field-witness
          SOUNIO_ARM64_WITNESS_MODE: attest
          SOUNIO_ARM64_WITNESS_SOURCE: tests/run-pass/arm64_deref_array_element_field_store.sio
        run: bash scripts/ci/arm64_nested_store_witness_gate.sh
      - name: Source-bootstrap modular typecheck proof
        run: |
          SOUC_STAGE2=/tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          CHECK_OUT=/tmp/souc-self-hosted-linux-x86_64-check
          "$SOUC_STAGE2" self-hosted/compiler/lean.sio "$CHECK_OUT"
          chmod +x "$CHECK_OUT"
          "$CHECK_OUT" --help | grep -F -- "--check <source.sio>"
          "$CHECK_OUT" --check tests/run-pass/match_arm_unbraced_assignment.sio
          SOUC_NATIVE="$CHECK_OUT" \
            WORK_DIR=/tmp/sounio-source-bootstrap-native-typecheck-proof \
            bash scripts/selfhost/selfhost_native_typecheck_proof.sh
      - name: Upload source-bootstrap macOS compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-bootstrap-native-compiler-macos-arm64
          path: /tmp/souc-self-hosted-arm64-macos
          retention-days: 1
      - name: Upload source-bootstrap self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-bootstrap-selfhost-gate-linux-x86_64
          path: |
            /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
            /tmp/sounio-source-bootstrap-native-typecheck-proof
            /tmp/sounio-arm64-nested-store-witness
            /tmp/sounio-arm64-array-element-field-witness
          retention-days: 1

  madaros-current-source-deref-f64:
    name: Madaros Current-Source f64 Lowering
    needs: impact
    # `stdlib` is here for a measured reason: 7 files in main.sio's own import
    # closure live under stdlib/compiler/ontology/ and classify as stdlib, not
    # compiler. A PR that makes stdlib/compiler/ontology/store.sio unparseable
    # breaks the compiler's closure and, without this, runs none of these gates.
    if: needs.impact.outputs.compiler == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # 15 held a full Madaros build plus four sub-gates; the self-parse sweep adds
    # ~20 s. The extra headroom is so a slow run reads as slow, not as a hang.
    # Raised again to 35 here because this branch adds three more sub-gates to
    # the same job (precise_stack_maps honesty, FPGA receipt staleness, and the
    # epistemic e-graph reassociation gate).
    timeout-minutes: 35
    env:
      SOUNIO_MADAROS_F64_LOWERING_GATE_DIR: /tmp/sounio-madaros-current-source-f64-lowering
      SOUNIO_MADAROS_F64_LOWERING_GATE_KEEP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Madaros once and run current-source f64 lowering gates
        run: bash scripts/ci/madaros_current_source_f64_lowering_gate.sh
      - name: Madaros IR function table stays heap-backed
        env:
          MADAROS_RAW_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
        run: bash scripts/ci/madaros_ir_function_table_gate.sh
      # The compiler must be able to read its own source tree. On 2026-08-03 one
      # built from main could not parse self-hosted/resolve/scope.sio; 417 gates
      # missed it and it was found by accident. Re-measured afterwards: 118 of
      # 559 files under self-hosted/ failed. This step reuses the ELF the step
      # above already built and kept (KEEP=1) — it adds no build.
      - name: Madaros parses its own source tree
        env:
          SOUNIO_MADAROS_SELF_PARSE_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
          SOUNIO_MADAROS_SELF_PARSE_REPORT_DIR: /tmp/sounio-madaros-current-source-f64-lowering/self-parse
        run: bash scripts/ci/madaros_self_parse_gate.sh
      # Parsing its own tree is the first property; compiling it is the one
      # that ends in a fixed point. These two size the remaining distance, and
      # both reuse the ELF above rather than building anything.
      #
      # The capacity probe is REPORT_ONLY here on purpose. It is red by
      # construction today — main.sio's 97-module closure declares 9404
      # functions against IR_MAX_FUNCS=2048 — and a step that is red for a
      # known architectural reason teaches CI readers to ignore red. Drop the
      # flag the moment Stage 6 lands; until then the number is recorded on
      # every run so movement is visible in the log.
      - name: Madaros IR capacity probe (report-only until Stage 6)
        env:
          MADAROS_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
          SOUNIO_IR_CAPACITY_PROBE_REPORT_ONLY: "1"
        run: bash scripts/ci/madaros_ir_capacity_probe.sh
      # Ratcheted, and red in BOTH directions: falling short of the recorded
      # rung is a regression, exceeding it is progress that must be written
      # down before it can be lost.
      # Two-armed: the pass must keep 602 reachable functions AND still drop
      # 300 of 303 unreachable ones. Either arm alone is passable by a pass
      # that does nothing. Against the compiler that shipped before this gate,
      # the first arm fails with 90 live functions deleted and a binary that
      # answers 8 instead of 99.
      - name: Cross-module DCE keeps live code and still drops dead code
        env:
          MADAROS_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
        run: bash scripts/ci/madaros_dce_reachability_gate.sh
      - name: Madaros compiles Madaros (ratcheted rung)
        env:
          MADAROS_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
          SOUNIO_MADAROS_FP_DIR: /tmp/sounio-madaros-current-source-f64-lowering/fixed-point
        run: bash scripts/ci/madaros_fixed_point_gate.sh
      - name: Run changed Madaros tests with the current-source compiler
        env:
          SOUNIO_MADAROS_CHANGED_TESTS_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOUNIO_TEST_JOBS: 4
        run: bash scripts/ci/madaros_changed_tests_gate.sh
      - name: Epistemic e-graph reassociation gate
        env:
          SOUNIO_EPISTEMIC_EGRAPH_MADAROS: /tmp/sounio-madaros-current-source-f64-lowering/madaros
        run: bash scripts/ci/epistemic_egraph_rewrite_gate.sh
      # W044: `Tipo::metodo(...)` whose target resolves to nothing typechecked
      # silently and evaluated to 0. Five cases, two warn and three quiet --
      # the quiet ones are the point, because the failure mode of this check is
      # firing on legitimate module-qualified calls, not missing one. Reuses the
      # ELF built above; adds no build.
      - name: Unknown associated-fn call warns (W044)
        env:
          SOUNIO_MADAROS_UNKNOWN_ASSOC_FN_GATE_BIN: /tmp/sounio-madaros-current-source-f64-lowering/madaros
          SOUNIO_MADAROS_UNKNOWN_ASSOC_FN_GATE_DIR: /tmp/sounio-madaros-current-source-f64-lowering/unknown-assoc-fn
        run: bash scripts/ci/madaros_unknown_assoc_fn_gate.sh
      # madaros_corpus_regression_gate.sh is deliberately NOT wired in yet.
      # Run for real against a from-source Madaros for the first time on
      # 2026-07-27, it reports 1028 corpus programs failing that are not in
      # tests/madaros_corpus_baseline.txt (314 entries), all traced to one
      # segfault (module_frontend.sio:5183, inside
      # module_frontend_lower_program_items_box_traced_with_externs) rather
      # than 1028 independent defects. Wiring this in before that is
      # triaged and the baseline is deliberately reconciled would fail
      # Contracts for every open PR the same way the stale docs registry did
      # before #1532 -- this time for an undecided reason instead of a
      # mechanical one. Wire in once a decision is made on how to handle the
      # gap (see the plan doc for the full finding).
      - name: Upload current-source f64 lowering logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madaros-current-source-f64-lowering
          path: /tmp/sounio-madaros-current-source-f64-lowering
          retention-days: 1

  native-selfhost-macos-arm64:
    name: Native Self-Host (macOS arm64)
    runs-on: macos-15
    needs: [impact, source-bootstrap-selfhost-linux-x86_64]
    if: always() && (needs.impact.outputs.compiler == 'true' || needs.impact.outputs.full == 'true') && needs.source-bootstrap-selfhost-linux-x86_64.result == 'success'
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download source-bootstrap macOS compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: source-bootstrap-native-compiler-macos-arm64
          path: /tmp/source-bootstrap-macos
      - name: Install source-bootstrap macOS compiler artifact
        run: |
          cp /tmp/source-bootstrap-macos/souc-self-hosted-arm64-macos artifacts/self-hosted/souc-self-hosted-arm64-macos
          chmod +x artifacts/self-hosted/souc-self-hosted-arm64-macos
      - name: Source-bootstrap macOS compiler artifact attestation
        run: |
          file artifacts/self-hosted/souc-self-hosted-arm64-macos | grep -E "Mach-O 64-bit.*arm64.*executable|Mach-O 64-bit.*executable.*arm64"
          if command -v codesign >/dev/null 2>&1; then
            codesign --verify artifacts/self-hosted/souc-self-hosted-arm64-macos || true
          fi
          mkdir -p /tmp/sounio-native-acceptance-macos-arm64/artifacts
          cat > /tmp/sounio-native-acceptance-macos-arm64/artifacts/summary.txt <<'EOF'
          mode=attest
          reason=darwin_host_execution_blocked
          source_bootstrap_artifact=artifacts/self-hosted/souc-self-hosted-arm64-macos
          EOF
      - name: Host self-host gate
        env:
          SOUNIO_DARWIN_SELFHOST_EXEC_MODE: attest
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Upload macOS native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-macos-arm64
          path: /tmp/sounio-selfhost-macos-arm64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload macOS self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-macos-arm64
          path: |
            /tmp/sounio-selfhost-macos-arm64
            /tmp/sounio-native-acceptance-macos-arm64
          retention-days: 1

  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-24.04
    needs: [impact, native-selfhost-linux-x86_64]
    if: always() && (needs.impact.outputs.compiler == 'true' || needs.impact.outputs.runtime == 'true' || needs.impact.outputs.stdlib == 'true' || needs.impact.outputs.tests == 'true' || needs.impact.outputs.full == 'true') && needs.native-selfhost-linux-x86_64.result == 'success'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download native compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp
      - name: Run full test suite
        env:
          SOUNIO_TEST_SOUC_BIN: /tmp/souc-stage2
