name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_150_PREFIX: /usr/lib/llvm-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 15
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 15 -n=noble
      - name: Run fast gate
        run: scripts/fast_gate.sh
      - name: GPU backend test
        run: cargo test -p souc --features gpu --test backend_e2e
