name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_150_PREFIX: /usr/lib/llvm-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check legacy path hygiene
        run: scripts/check_legacy_paths.sh
      - name: Install LLVM 15
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 15 -n=noble
      - name: Run fast gate
        run: scripts/fast_gate.sh
      - name: Feature matrix gate
        run: scripts/check_feature_matrix.sh
      - name: GPU backend test
        run: cargo test -p souc --features gpu --test backend_e2e
      - name: Ontology e2e smoke test
        run: cargo test -p souc --test integration_ontology_e2e

  wasm-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WASM targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32-wasip1
      - name: Check WASM feature (host)
        run: cargo check -p souc --features wasm
      - name: Check wasm32-unknown-unknown
        run: cargo check -p souc --lib --target wasm32-unknown-unknown --features wasm
      - name: Check wasm32-wasip1 (WASI)
        run: cargo check -p souc --lib --target wasm32-wasip1 --features wasm

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff comparison
      - uses: dtolnay/rust-toolchain@stable
      - name: Check documentation coverage
        run: |
          chmod +x scripts/check_doc_coverage.sh
          scripts/check_doc_coverage.sh
        env:
          MIN_COVERAGE: 60
          STRICT: false
      - name: Generate API documentation
        run: |
          cargo run -p souc --bin souniodoc -- generate stdlib --output target/doc
      - name: Copy API docs to Hugo static directory
        run: |
          mkdir -p hugo/static/api
          cp -r target/doc/* hugo/static/api/
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc
          retention-days: 7
      - name: Upload Hugo-ready site artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-with-api-docs
          path: hugo/
          retention-days: 7

  joss-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Version check
        run: ./target/release/souc --version
      - name: Run required JOSS examples
        run: |
          ./target/release/souc run examples/hello.sio
          ./target/release/souc run examples/epistemic_bmi.sio
          ./target/release/souc run examples/pbpk_simple.sio
          ./target/release/souc run examples/gpu_hypercomplex.sio
      - name: Compile-fail smoke (missing effect annotation)
        run: |
          if ./target/release/souc check tests/compile-fail/effect_missing.sio; then
            echo "expected compile failure did not occur"
            exit 1
          fi
