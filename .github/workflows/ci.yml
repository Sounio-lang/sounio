name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Workflow script references
        run: bash scripts/check_workflow_script_refs.sh
      - name: Docs consistency
        run: bash scripts/check_docs_consistency.sh
      - name: Docs registry
        run: bash scripts/check_docs_registry.sh
      - name: Issue template contracts
        run: bash scripts/check_issue_template_contracts.sh
      - name: Legacy path hygiene
        run: bash scripts/check_legacy_paths.sh
      - name: Claude operational contract
        run: bash scripts/claude_operational_contract_gate.sh
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: artifacts/omega/claude_operational_contract_status.v1.json
          retention-days: 7

  native-selfhost:
    name: Native Self-Host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap native compiler
        run: |
          bash scripts/ci/build_native_souc.sh /tmp/souc.elf
          echo "Native compiler: $(stat -c%s /tmp/souc.elf) bytes"
      - name: Verify self-hosting fixed-point
        run: |
          /tmp/souc.elf self-hosted/compiler/lean_single.sio /tmp/s2.elf 2>/dev/null
          chmod +x /tmp/s2.elf
          /tmp/s2.elf self-hosted/compiler/lean_single.sio /tmp/s3.elf 2>/dev/null
          if cmp -s /tmp/s2.elf /tmp/s3.elf; then
            echo "SELFHOST_FIXED_POINT_PASS ($(md5sum /tmp/s2.elf | cut -d' ' -f1))"
          else
            echo "SELFHOST_FIXED_POINT_FAIL"
            exit 1
          fi
      - name: Feature gate (11 tests)
        run: |
          cp /tmp/souc.elf /tmp/final_boot4.elf
          chmod +x /tmp/final_boot4.elf
          bash scripts/souc_v2_gate.sh

  sounio-lint:
    name: Sounio Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all .sio files
        run: bash check_sounio.sh --summary

  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Quality check
        run: npm --prefix website run check:quality
