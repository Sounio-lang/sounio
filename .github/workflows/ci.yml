name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  fast-gate:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_150_PREFIX: /usr/lib/llvm-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 15
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 15 -n=noble
      - name: Run fast gate
        run: scripts/fast_gate.sh
      - name: GPU backend test
        run: cargo test -p souc --features gpu --test backend_e2e

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff comparison
      - uses: dtolnay/rust-toolchain@stable
      - name: Check documentation coverage
        run: |
          chmod +x scripts/check_doc_coverage.sh
          scripts/check_doc_coverage.sh
        env:
          MIN_COVERAGE: 60
          STRICT: false
      - name: Generate API documentation
        run: |
          cd compiler
          cargo run --bin souniodoc -- generate ../stdlib --output ../target/doc
      - name: Copy API docs to Hugo static directory
        run: |
          mkdir -p hugo/static/api
          cp -r target/doc/* hugo/static/api/
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc
          retention-days: 7
      - name: Upload Hugo-ready site artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-with-api-docs
          path: hugo/
          retention-days: 7
