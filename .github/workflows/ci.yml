name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Workflow script references
        run: bash scripts/dev/check_workflow_script_refs.sh
      - name: Docs consistency
        run: bash scripts/dev/check_docs_consistency.sh
      - name: Docs registry
        run: bash scripts/dev/check_docs_registry.sh
      - name: Issue template contracts
        run: bash scripts/ci/check_issue_template_contracts.sh
      - name: Legacy path hygiene
        run: bash scripts/ci/check_legacy_paths.sh
      - name: Claude operational contract
        run: bash scripts/ci/claude_operational_contract_gate.sh
      - name: Ontology validation
        run: bash scripts/ci/run_ontology_validation.sh --mode rebuilt ontology
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: artifacts/omega/claude_operational_contract_status.v1.json
          retention-days: 7

  native-selfhost-linux-x86_64:
    name: Native Self-Host (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Host self-host gate
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Feature gate (11 tests)
        run: |
          cp /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2 /tmp/final_boot4.elf
          chmod +x /tmp/final_boot4.elf
          bash scripts/ci/souc_v2_gate.sh
      - name: Upload native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload Linux self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64
          retention-days: 1

  source-bootstrap-selfhost-linux-x86_64:
    name: Source-Bootstrap Self-Host (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Source-bootstrap host self-host gate
        run: bash scripts/codex/action-source-bootstrap-host-gate.sh
      - name: Upload source-bootstrap self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-bootstrap-selfhost-gate-linux-x86_64
          path: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
          retention-days: 1

  native-selfhost-macos-arm64:
    name: Native Self-Host (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-macos-arm64
      SOUNIO_DARWIN_SELFHOST_EXEC_MODE: attest
    steps:
      - uses: actions/checkout@v4
      - name: Host self-host gate
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Upload macOS native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-macos-arm64
          path: /tmp/sounio-selfhost-macos-arm64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload macOS self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-macos-arm64
          path: /tmp/sounio-selfhost-macos-arm64
          retention-days: 1

  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-24.04
    needs: native-selfhost-linux-x86_64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download native compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp
      - name: Run full test suite
        env:
          SOUNIO_TEST_SOUC_BIN: /tmp/souc-stage2
          SOUNIO_TEST_JOBS: 4
        run: |
          chmod +x /tmp/souc-stage2
          bash scripts/run_sio_test_suite.sh --format junit --jobs 4
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  sounio-lint:
    name: Sounio Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all .sio files
        run: bash check_sounio.sh --summary

  lean-proofs:
    name: Lean Proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean4/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean4/lean-toolchain') }}
          restore-keys: lean-${{ runner.os }}-
      - name: Install elan (Lean toolchain manager)
        run: |
          if ! command -v elan &>/dev/null; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build EGC proof modules
        run: |
          cd formal/lean4
          lake build SounioGradedModal SounioMeasConf SounioProofObligation
      - name: Verify egc_graded_soundness is axiom-free
        run: |
          cd formal/lean4
          cat > /tmp/axiom_check.lean <<'EOF'
          import SounioGradedModal
          #print axioms SounioGradedModal.egc_graded_soundness
          EOF
          lake env lean /tmp/axiom_check.lean 2>&1 | grep -v "propext\|Classical\|Quot" \
            | grep "axioms" && echo "unexpected axioms" && exit 1 || echo "✓ No unexpected axioms"

  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Quality check
        run: npm --prefix website run check:quality
