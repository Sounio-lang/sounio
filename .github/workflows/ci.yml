name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow script references
        run: bash scripts/dev/check_workflow_script_refs.sh
      - name: Docs consistency
        run: bash scripts/dev/check_docs_consistency.sh
      - name: Docs registry
        run: bash scripts/dev/check_docs_registry.sh
      - name: Website docs support
        run: bash scripts/ci/sounio_website_docs_support_gate.sh
      - name: Package support
        run: bash scripts/ci/sounio_package_support_gate.sh
      - name: LoRA dataset assets
        run: bash scripts/ci/lora_assets_gate.sh
      - name: Issue template contracts
        run: bash scripts/ci/check_issue_template_contracts.sh
      - name: Legacy path hygiene
        run: bash scripts/ci/check_legacy_paths.sh
      - name: Heuristic metaphor-firewall gate
        run: |
          bash scripts/ci/heuristic_firewall_gate.sh --demo
          bash scripts/ci/heuristic_firewall_gate.sh
      - name: Worktree governance gate
        run: bash scripts/dev/worktree_branch_audit.sh --check
      - name: Output-path invariants
        run: bash scripts/dev/check_outpath_invariant.sh
      - name: Output-path leading-dash guard
        run: bash scripts/dev/check_outpath_leading_dash.sh
      - name: Claude operational contract
        run: bash scripts/ci/claude_operational_contract_gate.sh
      - name: Ontology validation
        run: bash scripts/ci/run_ontology_validation.sh --mode rebuilt ontology
      - name: Ontology CLI smoke gate
        run: bash scripts/ci/ontology_cli_smoke_gate.sh
      - name: Package-backed PBPK/GUM contract
        run: bash scripts/ci/package_pbpk_gum_gate.sh
      - name: Sedenion zd168 cross-verification
        run: bash scripts/ci/sedenion_zd168_crosscheck_gate.sh
      - name: Sedenion e8-seam bridge cross-verification
        run: bash scripts/ci/sedenion_seam_bridge_gate.sh
      - name: Gresnigt G2xS3 cross-verification
        run: bash scripts/ci/gresnigt_g2s3_gate.sh
      - name: Gresnigt family-S3 cross-verification
        run: bash scripts/ci/gresnigt_family_s3_gate.sh
      - name: Furey charge / G2 cross-verification
        run: bash scripts/ci/furey_charge_g2_gate.sh
      - name: Sedenion Gresnigt-octonions cross-verification
        run: bash scripts/ci/sedenion_gresnigt_octonions_gate.sh
      - name: Sedenion octonion-census cross-verification
        run: bash scripts/ci/sedenion_octonion_census_gate.sh
      - name: Sedenion Clifford-8 cross-verification
        run: bash scripts/ci/sedenion_clifford8_gate.sh
      - name: Sedenion ladder-extension cross-verification
        run: bash scripts/ci/sedenion_ladder_extension_gate.sh
      - name: Furey octonion generation cross-verification
        run: bash scripts/ci/furey_octonion_gate.sh
      - name: Sedenion dynamics cross-verification
        run: bash scripts/ci/sedenion_dynamics_gate.sh
      - name: Sedenion spectra cross-verification
        run: bash scripts/ci/sedenion_spectra_gate.sh
      - name: Sedenion quartet-fiber incidence cross-verification
        run: bash scripts/ci/sedenion_quartet_fiber_incidence_gate.sh
      - name: Sedenion zd-quartets cross-verification
        run: bash scripts/ci/sedenion_zd_quartets_gate.sh
      - name: Sedenion associator-1848 cross-verification
        run: bash scripts/ci/sedenion_associator_1848_gate.sh
      - name: Sedenion fiber-identity cross-verification
        run: bash scripts/ci/sedenion_zd_fiber_identity_gate.sh
      - name: Sedenion zd-fibers cross-verification
        run: bash scripts/ci/sedenion_zd_fibers_gate.sh
      - name: Sedenion e8-boundary cross-verification
        run: bash scripts/ci/sedenion_e8_boundary_gate.sh
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: artifacts/omega/claude_operational_contract_status.v1.json
          retention-days: 7

  native-selfhost-linux-x86_64:
    name: Native Self-Host (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-linux-x86_64
      SOUNIO_FORCE_SOURCE_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Host self-host gate
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Feature gate (11 tests)
        run: |
          cp /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2 /tmp/final_boot4.elf
          chmod +x /tmp/final_boot4.elf
          bash scripts/ci/souc_v2_gate.sh
      - name: Native runtime proof (manifest)
        env:
          SOUC_NATIVE: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
        run: bash scripts/selfhost/selfhost_native_runtime_proof.sh
      - name: Upload native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload Linux self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-linux-x86_64
          path: /tmp/sounio-selfhost-linux-x86_64
          retention-days: 1

  source-bootstrap-selfhost-linux-x86_64:
    name: Source-Bootstrap Self-Host (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Source-bootstrap host self-host gate
        run: bash scripts/codex/action-source-bootstrap-host-gate.sh
      - name: Cross-build macOS arm64 compiler artifact
        run: |
          SOUC_STAGE2=/tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          MACOS_OUT=/tmp/souc-self-hosted-arm64-macos
          "$SOUC_STAGE2" self-hosted/compiler/lean_single.sio "$MACOS_OUT" --target aarch64-macos
          chmod +x "$MACOS_OUT"
          file "$MACOS_OUT" | grep -E "Mach-O 64-bit.*arm64.*executable|Mach-O 64-bit.*executable.*arm64"
      - name: Source-bootstrap modular typecheck proof
        run: |
          SOUC_STAGE2=/tmp/sounio-source-bootstrap-selfhost-linux-x86_64/artifacts/souc-stage2
          CHECK_OUT=/tmp/souc-self-hosted-linux-x86_64-check
          "$SOUC_STAGE2" self-hosted/compiler/lean.sio "$CHECK_OUT"
          chmod +x "$CHECK_OUT"
          "$CHECK_OUT" --help | grep -F -- "--check <source.sio>"
          SOUC_NATIVE="$CHECK_OUT" \
            WORK_DIR=/tmp/sounio-source-bootstrap-native-typecheck-proof \
            bash scripts/selfhost/selfhost_native_typecheck_proof.sh
      - name: Upload source-bootstrap macOS compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-bootstrap-native-compiler-macos-arm64
          path: /tmp/souc-self-hosted-arm64-macos
          retention-days: 1
      - name: Upload source-bootstrap self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-bootstrap-selfhost-gate-linux-x86_64
          path: |
            /tmp/sounio-source-bootstrap-selfhost-linux-x86_64
            /tmp/sounio-source-bootstrap-native-typecheck-proof
          retention-days: 1

  native-selfhost-macos-arm64:
    name: Native Self-Host (macOS arm64)
    runs-on: macos-15
    needs: source-bootstrap-selfhost-linux-x86_64
    timeout-minutes: 15
    env:
      SOUNIO_SELFHOST_HOST_GATE_DIR: /tmp/sounio-selfhost-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download source-bootstrap macOS compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: source-bootstrap-native-compiler-macos-arm64
          path: /tmp/source-bootstrap-macos
      - name: Install source-bootstrap macOS compiler artifact
        run: |
          cp /tmp/source-bootstrap-macos/souc-self-hosted-arm64-macos artifacts/self-hosted/souc-self-hosted-arm64-macos
          chmod +x artifacts/self-hosted/souc-self-hosted-arm64-macos
      - name: Source-bootstrap macOS compiler artifact attestation
        run: |
          file artifacts/self-hosted/souc-self-hosted-arm64-macos | grep -E "Mach-O 64-bit.*arm64.*executable|Mach-O 64-bit.*executable.*arm64"
          if command -v codesign >/dev/null 2>&1; then
            codesign --verify artifacts/self-hosted/souc-self-hosted-arm64-macos || true
          fi
          mkdir -p /tmp/sounio-native-acceptance-macos-arm64/artifacts
          cat > /tmp/sounio-native-acceptance-macos-arm64/artifacts/summary.txt <<'EOF'
          mode=attest
          reason=darwin_host_execution_blocked
          source_bootstrap_artifact=artifacts/self-hosted/souc-self-hosted-arm64-macos
          EOF
      - name: Host self-host gate
        env:
          SOUNIO_DARWIN_SELFHOST_EXEC_MODE: attest
        run: bash scripts/ci/selfhost_host_gate.sh
      - name: Upload macOS native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-macos-arm64
          path: /tmp/sounio-selfhost-macos-arm64/artifacts/souc-stage2
          retention-days: 1
      - name: Upload macOS self-host gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-gate-macos-arm64
          path: |
            /tmp/sounio-selfhost-macos-arm64
            /tmp/sounio-native-acceptance-macos-arm64
          retention-days: 1

  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-24.04
    needs: native-selfhost-linux-x86_64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download native compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: native-compiler-linux-x86_64
          path: /tmp
      - name: Run full test suite
        env:
          SOUNIO_TEST_SOUC_BIN: /tmp/souc-stage2
          SOUNIO_TEST_JOBS: 4
        run: |
          chmod +x /tmp/souc-stage2
          bash scripts/run_sio_test_suite.sh --format junit --jobs 4
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

  sounio-lint:
    name: Sounio Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all .sio files
        run: bash check_sounio.sh --summary

  lean-proofs:
    name: Lean Proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean4/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean4/lean-toolchain') }}
          restore-keys: lean-${{ runner.os }}-
      - name: Install elan (Lean toolchain manager)
        run: |
          if ! command -v elan &>/dev/null; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build all default-target proof modules
        run: |
          cd formal/lean4
          # Build every @[default_target] in lakefile.lean (currently 27).
          # Previously this step only built SounioGradedModal/MeasConf/
          # ProofObligation, which let other top-level modules (e.g.
          # SounioFloatInstance, SounioCausality, SounioPathionBridge)
          # silently rot without CI catching breakage. PR #66's audit
          # surfaced this — a PR adding a broken SounioFloatInstance
          # passed "Lean Proofs ✓" because no other module imported it.
          lake build
      - name: Verify egc_graded_soundness is axiom-free
        run: |
          cd formal/lean4
          cat > /tmp/axiom_check.lean <<'EOF'
          import SounioGradedModal
          #print axioms SounioGradedModal.egc_graded_soundness
          EOF
          lake env lean /tmp/axiom_check.lean 2>&1 | grep -v "propext\|Classical\|Quot" \
            | grep "axioms" && echo "unexpected axioms" && exit 1 || echo "✓ No unexpected axioms"

  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Quality check
        run: npm --prefix website run check:quality
