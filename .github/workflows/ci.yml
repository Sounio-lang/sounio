name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Impact
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      website: ${{ steps.classify.outputs.website }}
      compiler: ${{ steps.classify.outputs.compiler }}
      runtime: ${{ steps.classify.outputs.runtime }}
      stdlib: ${{ steps.classify.outputs.stdlib }}
      tests: ${{ steps.classify.outputs.tests }}
      lean: ${{ steps.classify.outputs.lean }}
      math: ${{ steps.classify.outputs.math }}
      ontology: ${{ steps.classify.outputs.ontology }}
      clinical: ${{ steps.classify.outputs.clinical }}
      sio: ${{ steps.classify.outputs.sio }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/classify_ci_impact.sh
      - name: Classifier self-test
        run: bash scripts/ci/impact_ci_selftest.sh

  contracts:
    name: Contracts
    needs: impact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow script references
        run: bash scripts/dev/check_workflow_script_refs.sh
      # The docs claimed "Cranelift JIT enabled" and named a JIT profile artifact
      # that is tracked nowhere. `souc info` prints `[-] Cranelift JIT` and the
      # binary exports no Cranelift symbol. A doc may not claim a backend the
      # binary reports as not compiled.
      - name: Backend claim parity
        run: bash scripts/ci/backend_claim_parity_gate.sh
      # `souc --help` omitted `ontology`, `install` and `search`. The verbs work;
      # the usage block never mentioned them, and a survey of `--help` concluded
      # they did not exist. Runs with SOUC_BIN cleared: an inherited SOUC_BIN
      # points at another checkout and the comparison becomes meaningless.
      - name: souc --help verb parity
        run: env -u SOUC_BIN -u SOUNIO_SOUC_BIN bash scripts/ci/souc_help_verb_parity_gate.sh
      # A number this repo states about itself must equal the number the tree
      # yields. Seeded from a 2026-08-27 backlog sweep where nearly every rebased
      # PR asserted a figure that was true when written and false by then --
      # invisible to review, to rebase and to CI, because a stale number reads
      # exactly like a fresh one.
      - name: Measured claims match the tree
        run: bash scripts/ci/measured_claim_gate.sh
      - name: Measured-claim gate fails when it should
        run: bash scripts/ci/measured_claim_gate_selftest.sh
      # Naming a compiler must select it or stop. MADAROS_RAW_BIN / SOUNIO_SOUC_BIN
      # were resolved by "first candidate that is executable", so an override that
      # was set but not executable got SKIPPED and resolution fell through to the
      # committed ELF -- which lags self-hosted/ source. Measured 2026-08-28: the
      # same file gave "check: OK" at mode 0600 and error[E245] at 0700. This step
      # drives both directions, so a guard that refused everything would fail too.
      - name: Unusable compiler override fails closed
        run: bash scripts/ci/compiler_override_fail_closed_gate.sh
      # The step above enforces workflow -> script (a named path must exist and
      # be executable). The reverse was unenforced: a gate could be added that no
      # workflow names, breaking nothing and running nowhere. This ratchets that
      # count so it cannot grow. It measures direct invocation, not coverage.
      # Named here because the ratchet below is right to refuse an unnamed gate.
      # The coordination bus is what ten agent slots use to avoid each other; a
      # broken MCP surface for it fails silently and is noticed only by the
      # collision it did not prevent. Timed before wiring: 10.0s, and it needs no
      # compiler and no venv. Its two SAN siblings in this PR are NOT wired -- see
      # the PR description: they require a repo .venv that CI never provisions,
      # and all 11 suffering_aware_*/san_* gates already on main are equally
      # unnamed for the same reason.
      #
      # Placed BEFORE the ratchet on purpose: the ratchet is currently red on those
      # two SAN gates, and a step after it would never run, so the one gate this PR
      # does wire would land with no CI evidence that it passes.
      - name: Coordination-bus MCP surface holds
        run: bash scripts/ci/sounio_coord_mcp_selftest.sh
      - name: Gate workflow reference ratchet
        run: bash scripts/ci/gate_workflow_reference_ratchet.sh
      # §6: parameter-position function types that declare no effects. Frozen at
      # the measured 216 so the count cannot grow while the one-system-or-two
      # decision is open.
      - name: Function-type effect ratchet
        run: bash scripts/ci/fn_type_effect_ratchet_gate.sh
      # CLAUDE.md section 7 is the door: every agent reads it before writing a
      # line of Sounio. On 2026-08-20 five of its seven rows were measured to be
      # style rather than enforcement, and it had gone stale for one reason —
      # nothing executed it. This does. A claim with a runner can go red; a claim
      # without one ages in silence and propagates into every session.
      - name: CLAUDE.md syntax table is executable
        run: bash scripts/ci/claude_md_syntax_executable_gate.sh
      # Parameter-position uses of type kinds the *mut lowering spine does not
      # handle. Those cross a `_ =>` that counts an error and prints nothing.
      # The silence is scaffolding — it is what let twenty type families be
      # written while the compiler stayed self-hosting — so this does not forbid
      # it, it makes it legible and shrink-only. Zero retires the scaffolding
      # by exhaustion.
      - name: Silent type-spine ratchet
        run: bash scripts/ci/silent_type_spine_ratchet_gate.sh
      # Parameter-position uses of type kinds the *mut lowering spine does not
      # handle. The silence is scaffolding — it is what let twenty type families
      # be written while the compiler stayed self-hosting — so this makes it
      # legible and shrink-only rather than forbidding it. Frozen at 19.
      - name: Silent type-spine ratchet
        run: bash scripts/ci/silent_type_spine_ratchet_gate.sh
      # An epsilon-bounded compile-fail test must be refused by BOTH engines. This
      # does not choose epsilon's polarity — it refuses to let the silent
      # disagreement grow while that decision is open. Frozen at 5; deciding the
      # polarity should drive it to 0.
      - name: Epsilon engine parity
        run: bash scripts/ci/epsilon_engine_parity_gate.sh
      - name: Docs consistency
        run: bash scripts/dev/check_docs_consistency.sh
      - name: Docs registry
        run: bash scripts/dev/check_docs_registry.sh
      # Concept contracts must declare Status and not drift past/behind
      # bindings.tsv evidence (both directions). No skip escape.
      - name: Concept status ladder (bindings evidence)
        run: bash scripts/ci/concept_status_gate.sh
      - name: Website docs support
        run: bash scripts/ci/sounio_website_docs_support_gate.sh
      - name: Package support
        run: bash scripts/ci/sounio_package_support_gate.sh
      - name: LoRA dataset assets
        run: bash scripts/ci/lora_assets_gate.sh
      # A test file with no //@ annotation is skipped by the suite and reported
      # as "no-annotation" -- it looks like coverage and runs nothing. 97 files
      # had gone dormant that way (#2287, #2290); this stops the next one.
      - name: Test annotation coverage
        run: bash scripts/ci/test_annotation_coverage_gate.sh
      # Static pin of Knowledge annotation parser coverage (declared vs
      # reachable vs E241). Dynamic probes need a source-built Madaros —
      # that clock is the Witness live-refuse step, not this one.
      - name: Knowledge annotation parser coverage (static)
        env:
          SOUNIO_KCOV_SKIP_DYNAMIC: "1"
        run: bash scripts/dev/knowledge_annotation_parser_coverage.sh
      - name: Issue template contracts
        run: bash scripts/ci/check_issue_template_contracts.sh
      - name: Legacy path hygiene
        run: bash scripts/ci/check_legacy_paths.sh
      - name: precise_stack_maps honesty gate
        run: bash scripts/ci/precise_stack_maps_honesty_gate.sh
      - name: pin_registry honesty gate
        run: bash scripts/ci/pin_registry_honesty_gate.sh
      - name: gc_capability honesty gate
        run: bash scripts/ci/gc_capability_honesty_gate.sh
      # #1792: default Madaros still prints var=0.000000 / bit-pattern confidence
      # on the dissertation surfaces. This gate is fail-closed detect, not a
      # compiler fix — it must stay in Contracts so a silent-pass cannot hide
      # behind impact filters. Measured green on origin/main 465008a76b
      # (F1 rc=1 + FABRICATED_ZERO; F2 huge+mark; lean_single non-zero var).
      - name: Epistemic fabrication detect (zero GUM variance / bit-pattern confidence)
        run: bash scripts/ci/epistemic_fabrication_detect_gate.sh
      # F2 trigger boundary: Knowledge.confidence sitofp (~4e18). Detect-and-pass
      # while the defect is live (KCONF rc!=0 + R25_BITCAST_SITOFP); CONTROLS and
      # USER must stay green; lean_single KCONF is the probability-scale ref.
      # Measured 3 s on origin/main 0256abf344. No skip — same #1778 class as
      # fabrication-detect. One forgotten leftover; the f128 ladder stays unwired.
      - name: f64 bitcast/sitofp boundary (Knowledge.confidence F2)
        run: bash scripts/ci/f64_bitcast_sitofp_boundary_gate.sh
      # This is the wire that #1874's squash title claimed. That squash
      # landed only the budget/umbrella receipts (two TSV files). Do not
      # rewrite 0ff0b39764 — this step is the missing ci.yml change.
      # Confidence 0.7 s and frontend parity 1.9 s, both green. No skip
      # (#1778 class). dossier/hessian/pbpk28/suite stay unwired: red on
      # main (1 s / 5 s / 9 s / 110 s). Neither script builds Madaros
      # from source; both resolve the checked-in souc wrapper. Still pin
      # SOUNIO_GATE_SOUC and SOUC_BIN to that wrapper so a missing pin
      # cannot become a from-source rebuild (ffi_posix_builtin class).
      - name: Dissertation compile-time confidence gates (Contribution 2)
        env:
          SOUNIO_GATE_SOUC: ${{ github.workspace }}/bin/souc
          SOUC_BIN: ${{ github.workspace }}/bin/souc
          SOUNIO_STDLIB_PATH: ${{ github.workspace }}/stdlib
          MADAROS_STACK_KB: "524288"
        run: bash scripts/ci/dissertation_confidence_gate_gate.sh
      - name: Dissertation frontend PBPK14 dual-Sounio parity
        env:
          SOUNIO_GATE_SOUC: ${{ github.workspace }}/bin/souc
          SOUC_BIN: ${{ github.workspace }}/bin/souc
          SOUNIO_STDLIB_PATH: ${{ github.workspace }}/stdlib
          MADAROS_STACK_KB: "524288"
        run: bash scripts/ci/dissertation_frontend_parity_gate.sh
      - name: FPGA receipt staleness gate
        run: bash scripts/ci/fpga_receipt_staleness_gate.sh
      - name: Heuristic metaphor-firewall gate
        run: |
          bash scripts/ci/heuristic_firewall_gate.sh --demo
          bash scripts/ci/heuristic_firewall_gate.sh
      # --- self-falsifying compilation line -------------------------------
      # The line's own W4_CI_WIRING clause, carried since R5: a chain of
      # custody guarded by a check nobody executes is aspirational. So the
      # rungs that are green on this branch are wired here, and the ones that
      # are not are named in the PR with the measurement that says why.
      #
      # Contract arm only. The compile arms (SFCL_R2_RUN_COMPILE,
      # SFCL_R17_RUN_COMPILE, SFCL_R20_RUN_COMPILE) need a purpose-built
      # self-hosted compiler and are deliberately NOT wired: a ~40 min build
      # per push is not a budget this repo has. Those rungs' behaviour
      # receipts are bound to the executor's sha256, so editing the executor
      # turns them red rather than certifying stale behaviour — which is why
      # R2, R17 and R20 are absent from the list below. They are red on the
      # research branch too, measured, not introduced by this PR.
      #
      # R22 needs `node` (it exercises the docs-registry checker end-to-end in
      # a hermetic hardlink farm, both control arms) and refuses rather than
      # passing if node is absent.
      #
      # The BASE gate is not wired either, and CI is what found that. Its
      # S4_RETROSPECTIVE clause audits three corrections by SHA (daa0635d0,
      # ec579a24c, eb38e9ce5), all branch-local to the functor-F lane. It
      # passed every local run because a git worktree SHARES THE OBJECT STORE
      # with the branch it was cut from, so those commits resolved; in CI's
      # fresh clone they do not, and the clause refuses rather than guessing.
      # Same reason R4 is absent. A gate that is green only in the environment
      # that authored it is not green.
      # Eight of the twenty gates below import numpy (R3, R7, R8, R9, R10, R15,
      # R16, R19) and this workflow installs no python dependencies anywhere.
      # CI is what established that: R3 died with ModuleNotFoundError before
      # printing a line, which is also why the branch's "21/21" was a LOCAL
      # measurement — in CI those eight had never run at all.
      #
      # Installing it is the smaller change. Dropping eight rungs to avoid one
      # pip install would be trading the checks for the convenience of not
      # running them, which is the exact failure R5's W4 clause names.
      - name: Self-falsifying compilation line — numpy
        run: python3 -m pip install --quiet --disable-pip-version-check numpy

      - name: Self-falsifying compilation line
        run: |
          for g in scripts/ci/self_falsifying_compilation_line_r1_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r3_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r7_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r8_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r9_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r10_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r12_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r13_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r14_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r15_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r16_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r19_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r21_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r22_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r23_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r24_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r25_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r27_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r28_gate.sh \
                   scripts/ci/self_falsifying_compilation_line_r29_gate.sh; do
            echo "--- $g"
            bash "$g"
          done

      # R6 is wired NIGHTLY, not per push, and the reason is measured rather
      # than guessed: its I3 clause sweeps every pair of research contracts,
      # O(pairs x functions^2). It takes ~957 s; the rest of the line costs
      # ~200 s together.
      #
      # This is the budget being stated instead of the gate being dropped: a
      # check too expensive to run on every push is not thereby exempt from
      # running, it just runs on a cadence the repo can pay for.
      - name: Self-falsifying compilation line (R6 corpus sweep, nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 25
        run: bash scripts/ci/self_falsifying_compilation_line_r6_gate.sh

      - name: Worktree governance gate
        run: bash scripts/dev/worktree_branch_audit.sh --check
      - name: Compiler lane status contract
        run: bash scripts/ci/compiler_lane_status_gate.sh
      - name: Parser contextual-identifier routing
        run: bash scripts/ci/parser_contextual_ident_routing_gate.sh
      # #1631: the committed boot4 was NOT what its own source produces, and
      # nothing noticed because every consumer just ran the checked-in blob.
      - name: Bootstrap boot4 artifact is its own fixed point (#1631)
        run: bash scripts/ci/verify_boot4_seed.sh
      - name: Extern builtin allow-list mirror (#1622)
        run: bash scripts/ci/extern_builtin_mirror_gate.sh
      - name: E250 refusal correspondence (Lean Check ↔ Madaros)
        run: bash scripts/ci/e219_refusal_correspondence_gate.sh
      - name: E250 engine oracle (Madaros refuses; seed split is reported)
        run: bash scripts/ci/e219_engine_oracle_gate.sh
      # #1780: first machine-checked link between EpistemicEffectsV2 t_kraw
      # and Madaros measure/Knowledge typing. Grep correspondence, not a
      # compile. Positive controls are the two mutants under
      # scripts/ci/fixtures/epistemic_measure_correspondence/. Landed on
      # main via #1845; this PR keeps the step and adds the other two
      # forgotten gates (#1792 Contracts, #1798 Witness).
      - name: Epistemic measure correspondence (Lean V2 ↔ Madaros Knowledge)
        run: bash scripts/ci/epistemic_measure_correspondence_gate.sh
      - name: Live lane coordination self-test
        run: bash scripts/ci/sounio_coord_selftest.sh

      - name: Agent coordination hook self-test
        run: bash scripts/ci/sounio_coord_agent_hook_selftest.sh
      - name: Portable compiler build lock self-test
        run: python3 scripts/ci/souc_build_lock_selftest.py
      - name: CI watch receipt self-test
        run: python3 scripts/ci/ci_watch_receipt_selftest.py
      - name: Madaros changed-test selector self-test
        run: bash scripts/ci/madaros_changed_tests_selftest.sh
      # Honour expect-stdout-contains and refuse invented expect-* keys.
      # A gate that no workflow names is invisible tomorrow (ratchet #1972).
      - name: Test-suite annotation self-test
        run: bash scripts/ci/test_suite_annotation_selftest.sh
      - name: Madaros v2 ENIR gate stack
        run: |
          # Shadow stack: ENIR work must not change codegen/ABI/runtime.
          # The identity check is versus merge-base, so any PR that
          # legitimately edits self-hosted/native (E219 ud2, etc.) fails
          # E1 before the rest of Contracts. If this commit does not
          # touch ENIR/EISA, the constraint does not apply.
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || echo origin/main)"
          if git diff --quiet "$BASE" HEAD -- self-hosted/enir tools/eisa; then
            echo "ENIR stack skipped: no ENIR/EISA delta versus $BASE"
            exit 0
          fi
          for g in scripts/dev/madaros_v2_e1_enir_shadow_gate.sh \
                   scripts/dev/madaros_v2_e2_enir_lowering_gate.sh \
                   scripts/dev/madaros_v2_e2b_enir_cfg_gate.sh \
                   scripts/dev/madaros_v2_e2c_enir_fuel_blockargs_gate.sh \
                   scripts/dev/madaros_v2_e2d_enir_rump_dd_gate.sh \
                   scripts/dev/madaros_v2_e2e_enir_qd128_gate.sh \
                   scripts/dev/madaros_v2_e2f_enir_rump_qd_gate.sh \
                   scripts/dev/madaros_v2_e2g_enir_fuel_control_frail_gate.sh \
                   scripts/dev/madaros_v2_e2h_enir_memory_move_poison_gate.sh \
                   scripts/dev/madaros_v2_e3a_enir_mir_qd128_gate.sh \
                   scripts/dev/madaros_v2_e3b_enir_mir_memory_gate.sh \
                   scripts/dev/madaros_v2_e3c_cfg_memory_ssa_gate.sh \
                   scripts/dev/madaros_v2_e3d_multipred_scalar_memory_ssa_gate.sh \
                   scripts/dev/madaros_v2_e3e_equal_value_distinct_event_gate.sh; do
            echo "--- $g"
            bash "$g"
          done
      - name: Executable payload comparator self-test
        run: bash scripts/ci/executable_payload_compare_selftest.sh
      # A harness that can lose writes to a broken pipe is a harness whose
      # green is unverifiable: under pipefail, an early-exiting reader
      # (grep -q, head) fails the pipeline and `if !` reads the verdict
      # inside-out. Two CI incidents on 2026-08-16/17. Canary + fixed-form
      # + shape ban, so a regression is red, not noise.
      - name: SIGPIPE hygiene gate
        run: bash scripts/ci/sigpipe_hygiene_gate.sh
      # Arms 1-2 need no compiler and cost <1 s, so they run on every PR
      # including docs-only ones. That is what stops the self-parse gate rotting
      # into a no-op: `--science-boundary-closure` exits 0 even on `status
      # incomplete`, so a gate written against its exit code would pass forever
      # and look exactly like a working gate.
      - name: Madaros self-parse verdict self-test
        run: bash scripts/ci/madaros_self_parse_selftest.sh
      # The tracked receipt asserts a sha256 for a binary. On 2026-08-04 it
      # named an absolute host path, claimed a digest that did not match the file
      # on disk, cited a commit 1515 behind HEAD, and was read by zero lines of
      # code — while ~82 scripts resolved that binary as an oracle and
      # scripts/install.sh preferred it over the committed one.
      - name: Madaros prebuilt receipt matches its binary
        run: bash scripts/ci/madaros_receipt_gate.sh
      # 67% of gates carry no emptiness guard. This one is ratcheted: the known
      # set may only shrink, and a NEW gate without a guard is red.
      # Compiles the word instead of modelling the parser. A static version was
      # tried first and was WRONG: it reported 30 identifier-capable keywords as
      # broken and probing showed all 30 work. Runs its own negative control --
      # match, struct, while, return and let must all be refused -- before it
      # reports anything.
      - name: IDENTIFIER_OK keywords are actually usable as identifiers
        run: bash scripts/ci/keyword_identifier_capability_gate.sh
      # lean_single has canonical_compiler_gate.sh; Madaros had nothing, because
      # rebuilding it takes four minutes. This does not rebuild -- it asks, per
      # capability, whether the shipped binary does what the source implements.
      - name: Committed Madaros binary is not behind its source
        run: bash scripts/ci/madaros_binary_source_drift_gate.sh
      - name: Gates must not pass on no data
        run: bash scripts/ci/gate_vacuity_gate.sh
      # An epistemic builtin must refuse what it cannot answer. hessian_of(x*x)
      # with no indices used to type-check and return 0.0 while the true H_00 is
      # 2.0 -- and in this algebra zero is not neutral, it is the claim "no
      # second-order dependence". The gate builds its own probes and carries
      # positive controls, so it cannot pass by refusing everything.
      - name: Epistemic builtins refuse what they cannot answer
        run: bash scripts/ci/epistemic_refusal_coverage_gate.sh
      # Census mode only: the full mode rebuilds each declared witness under its
      # own sabotage, which needs a Madaros ELF this job does not have. The
      # census is the number worth watching anyway -- how many of our run-pass
      # tests can demonstrate they measure anything at all. It was 6 of 1830
      # when the gate landed.
      #
      # This gate was merged unnamed and gate_workflow_reference_ratchet.sh
      # caught it on the next PR (472 -> 473). It was right to: a gate about
      # instruments that measure nothing, itself run by nobody, is the exact
      # defect it exists to find.
      # The gate's own control matrix. It lived in a PR description, ran once, and
      # would never have run again. Nine cells, each required to produce a
      # DIFFERENT verdict -- the first version returned the same one in all four
      # because the synthetic compiler exited 0 without writing its output.
      # A claim is not a finding until someone who did not produce it returns a
      # verdict, by a DIFFERENT route than the one that produced it. Blocks on
      # claims with no verdict and on verdicts that state no independent route.
      # REFUTED and UNMEASURED are healthy states and do not block.
      - name: Findings carry a second party's verdict
        run: bash scripts/ci/pair_verification_ratchet.sh

      # A diagnostic code is a global semantic identity and may name one thing.
      # Seventeen collisions were found by census (#2170), six with both sides
      # emitted; this gate counts them from the tree and freezes all three
      # populations. Its extraction carries its own positive control: if it
      # cannot find the two hand-verified collisions it refuses to report,
      # because a zero from a broken pattern looks exactly like a clean tree.
      - name: A diagnostic code names one thing
        run: bash scripts/ci/diagnostic_identity_gate.sh
      # #2170: freeze the semantic ownership of the four repaired codes and
      # prove each assertion is live by laundering it back to the old number.
      - name: E247-E250 diagnostic remap with sabotage controls
        run: bash scripts/ci/diagnostic_remap_2170_gate.sh

      - name: Sabotage gate self-test
        run: bash scripts/ci/witness_sabotage_gate_selftest.sh

      - name: Witnesses declare what would kill them (census)
        env:
          SOUNIO_WITNESS_SABOTAGE_CENSUS_ONLY: "1"
        run: bash scripts/ci/witness_declares_its_sabotage_gate.sh

      # The fleet launcher lives outside the repository and is not tracked, so
      # a bad edit to it is invisible to every review here. This reports whether
      # the live file still matches the committed reference; it does not fail on
      # drift, because the live file is legitimately edited on the pod.
      - name: Fleet lane launcher matches its committed reference
        run: bash scripts/ci/lane_shell_drift_gate.sh
      # Three gates arrive with the kimi-cli1 rescue. Naming them here is the
      # price of landing them: gate_workflow_reference_ratchet.sh refuses a gate
      # no workflow runs, and it is right to -- an unnamed gate costs nothing
      # today and is invisible tomorrow. Each was timed before wiring, so none
      # is an instant green: 3.0s, 70.1s and 210s of real work respectively.
      - name: Uncertain equality keeps its trust channel
        run: bash scripts/ci/madaros_uncertain_eq_trust_gate.sh
      - name: Ontology frontiers hold
        run: bash scripts/ci/ontology_frontiers_gate.sh
      - name: Multi-ontology composition holds
        run: bash scripts/ci/ontology_multi_ontology_gate.sh
      # Absence of measurement must not read as success. Meta-gate requires a
      # positive GATE_MEASURED assertions=N receipt (see CI_ABSENCE_AS_SUCCESS_CONTRACT).
      #
      # This step drives two fixtures, named here on purpose so
      # gate_workflow_reference_ratchet.sh does not count them as gates no
      # workflow runs (it greps this directory for scripts/ paths, comments
      # included). They must NOT get their own steps: they are the meta-gate's
      # controls, and scripts/ci/fixtures/gate_measurement_pilot_vacuous.sh is
      # REQUIRED to be rejected — running it as a CI step would assert the
      # opposite of what it exists to prove.
      #   scripts/ci/fixtures/gate_measurement_pilot_ok.sh       (must be accepted)
      #   scripts/ci/fixtures/gate_measurement_pilot_vacuous.sh  (must be refused)
      - name: Gates must prove they measured
        run: bash scripts/ci/gate_measurement_meta_gate.sh
      # The shipped lean_single ELF must BE the byte-identical fixed point of
      # current lean_single.sio. This gate existed, passed, and was wired to no
      # workflow — so the one thing that would notice the shipped binary drifting
      # from source was never run. ~2 s.
      - name: Canonical lean_single fixed point
        run: bash scripts/ci/canonical_compiler_gate.sh
      # Archaeology ladders. Position is derived from fixtures, not stored.
      # Measured green on origin/main 1dc0df549d before this wire.
      # effect_archaeology_gate.sh is NOT here: it is red on that SHA
      # (Chaotic pass fixture dies at native ELF write rc=12). Wiring a
      # red gate would paint main red. Do not lower its criterion to land it.
      - name: TypeKind archaeology ladder
        run: bash scripts/ci/typekind_archaeology_gate.sh
      - name: TypeKind archaeology family C
        run: bash scripts/ci/typekind_archaeology_c.sh
      - name: TypeKind archaeology family E
        run: bash scripts/ci/typekind_archaeology_e.sh
      - name: TypeKind archaeology family B
        run: bash scripts/ci/typekind_archaeology_b.sh
      - name: Sounio launcher BSD portability
        run: bash scripts/ci/souc_launcher_portability_gate.sh
      - name: Output-path invariants
        run: bash scripts/dev/check_outpath_invariant.sh
      - name: Output-path leading-dash guard
        run: bash scripts/dev/check_outpath_leading_dash.sh
      - name: Claude operational contract
        run: bash scripts/ci/claude_operational_contract_gate.sh
      - name: Ontology validation
        if: needs.impact.outputs.ontology == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/run_ontology_validation.sh --mode rebuilt ontology
      - name: Ontology CLI smoke gate
        if: needs.impact.outputs.ontology == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/ontology_cli_smoke_gate.sh
      - name: Package-backed PBPK/GUM contract
        if: needs.impact.outputs.clinical == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/package_pbpk_gum_gate.sh
      - name: Sedenion zd168 cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
        run: bash scripts/ci/sedenion_zd168_crosscheck_gate.sh
      - name: Sedenion exact unbounded-Q CD cross-verification
        if: needs.impact.outputs.math == 'true' || needs.impact.outputs.full == 'true'
