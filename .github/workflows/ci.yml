name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Workflow script references
        run: bash scripts/check_workflow_script_refs.sh
      - name: Docs consistency
        run: bash scripts/check_docs_consistency.sh
      - name: Docs registry
        run: bash scripts/check_docs_registry.sh
      - name: Issue template contracts
        run: bash scripts/check_issue_template_contracts.sh
      - name: Legacy path hygiene
        run: bash scripts/check_legacy_paths.sh
      - name: Claude operational contract
        run: bash scripts/claude_operational_contract_gate.sh
      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: artifacts/omega/claude_operational_contract_status.v1.json
          retention-days: 7

  selfhost-authority:
    name: Selfhost Authority
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run selfhost authority gate
        env:
          WORK_DIR: /tmp/sounio-selfhost-authority-ci
        run: bash scripts/selfhost/selfhost_authority_gate.sh
      - name: Publish authority summary
        if: always()
        run: |
          if [ -f /tmp/sounio-selfhost-authority-ci/artifacts/summary.v2.md ]; then
            cat /tmp/sounio-selfhost-authority-ci/artifacts/summary.v2.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload selfhost authority artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-authority-artifacts
          path: |
            /tmp/sounio-selfhost-authority-ci/artifacts
            /tmp/sounio-selfhost-authority-ci/logs
          if-no-files-found: warn
          retention-days: 7

  selfhost-abi-parity:
    name: Selfhost ABI/Parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run focused ABI/parity gate
        env:
          WORK_DIR: /tmp/sounio-selfhost-abi-parity-ci
        run: bash scripts/selfhost/selfhost_ci_abi_parity_gate.sh
      - name: Publish ABI/parity summary
        if: always()
        run: |
          if [ -f /tmp/sounio-selfhost-abi-parity-ci/artifacts/summary.v1.md ]; then
            cat /tmp/sounio-selfhost-abi-parity-ci/artifacts/summary.v1.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload selfhost ABI/parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-abi-parity-artifacts
          path: |
            /tmp/sounio-selfhost-abi-parity-ci/artifacts
            /tmp/sounio-selfhost-abi-parity-ci/logs
            /tmp/sounio-selfhost-abi-parity-ci/abi/artifacts
            /tmp/sounio-selfhost-abi-parity-ci/abi/logs
            /tmp/sounio-selfhost-abi-parity-ci/aarch64/artifacts
            /tmp/sounio-selfhost-abi-parity-ci/aarch64/logs
          if-no-files-found: warn
          retention-days: 7

  sounio-lint:
    name: Sounio Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all .sio files
        run: bash check_sounio.sh --summary

  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Quality check
        run: npm --prefix website run check:quality
