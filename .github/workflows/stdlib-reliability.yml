name: Stdlib Reliability

# ADR-018 §2.5: an RC requires the stdlib reliability snapshot to be
# regenerated on the release branch head. The snapshot in
# artifacts/stdlib/stdlib_reliability_status.v1.json had been regenerated by
# hand only, last on 2026-05-12, and nothing in CI ran the gate. Dispatch
# this workflow FROM the ref to evaluate (release/X.Y or main) and commit
# the uploaded status file to that branch.
#
# The ref input must be blank or equal to the revision that contains this
# workflow. Checking out some other ref and then running that tree's scripts
# would let an untrusted checkout write the default-branch Actions cache.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Must match the branch selected above, or be left blank. A different ref is refused."
        required: false
        default: ""
  schedule:
    - cron: '41 5 * * 1'   # weekly on the default branch, so drift is seen between releases

permissions:
  contents: read

jobs:
  stdlib-reliability:
    name: Stdlib reliability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Refuse a ref that is not this workflow revision
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -eu
          if [ -z "${REQUESTED_REF}" ]; then
            exit 0
          fi
          case "${REQUESTED_REF}" in
            "${GITHUB_REF_NAME}"|"${GITHUB_REF}"|"${GITHUB_SHA}")
              exit 0
              ;;
            *)
              echo "ref '${REQUESTED_REF}' is not this workflow revision (${GITHUB_REF_NAME}, ${GITHUB_SHA}). Dispatch the workflow from the ref to evaluate." >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize the committed Madaros prebuilt
        run: bash scripts/lib/materialize_madaros_prebuilt.sh
      # The gate calls "$SOUC_BIN" directly. Leave it unset so
      # scripts/lib/resolve_souc.sh picks bin/souc (Madaros), not the legacy
      # artifacts/omega binary that predates the current syntax.
      - name: Run the stdlib reliability gate
        env:
          SOUC_BIN: ""
        run: |
          set +e
          bash scripts/stdlib_reliability_gate.sh 2>&1 | tee /tmp/stdlib-reliability.log
          rc=${PIPESTATUS[0]}
          echo "STDLIB_RELIABILITY_GATE_RC=$rc ref=${GITHUB_REF_NAME} sha=$(git rev-parse HEAD)"
          exit $rc
      - name: Upload status and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-reliability-${{ github.run_id }}
          path: |
            artifacts/stdlib/stdlib_reliability_status.v1.json
            artifacts/stdlib/stdlib_e2e_result.v1.json
            artifacts/stdlib/stdlib_hyper_execution_status.v1.json
            artifacts/stdlib/native_lane_matrix.v1.json
            artifacts/stdlib/stdlib_inventory.v1.json
            /tmp/stdlib-reliability.log
          retention-days: 30
