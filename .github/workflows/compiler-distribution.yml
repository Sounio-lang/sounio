name: Compiler distribution contract
on:
  pull_request:
    paths:
      - scripts/distribution/**
      - tests/distribution/**
      - .github/workflows/compiler-distribution.yml
  push:
    branches: [main]
    paths:
      - scripts/distribution/**
      - tests/distribution/**
      - .github/workflows/compiler-distribution.yml
permissions:
  contents: read
jobs:
  packaging-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deterministic packaging and refusal boundaries
        run: python3 -m unittest discover -s tests/distribution -v
