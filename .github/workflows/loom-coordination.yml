name: Loom Coordination

on:
  pull_request:
    paths:
      - ".github/workflows/loom-coordination.yml"
      - "bin/sounio-agentd"
      - "bin/sounio-coord"
      - "bin/sounio-fleet"
      - "bin/sounio-loom"
      - "formal/tla/SounioFleet.*"
      - "scripts/ci/*coord*"
      - "scripts/ci/*loom*"
      - "scripts/ci/causal_receipt_typestate_gate.sh"
      - "scripts/ci/fleet_transaction_typestate_gate.sh"
      - "scripts/ci/witness_declares_its_sabotage_gate.sh"
      - "scripts/dev/*sounio_coord*"
      - "scripts/dev/*sounio_fleet*"
      - "scripts/dev/*sounio_loom*"
      - "stdlib/coordination/**"
      - "tests/compile-fail/loom_obligation_*"
      - "tests/compiler/causal_receipt*"
      - "tests/compiler/fleet_transaction*"
      - "tests/compiler/loom_*"
      - "tools/loom/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/loom-coordination.yml"
      - "bin/sounio-agentd"
      - "bin/sounio-coord"
      - "bin/sounio-fleet"
      - "bin/sounio-loom"
      - "formal/tla/SounioFleet.*"
      - "scripts/ci/*coord*"
      - "scripts/ci/*loom*"
      - "scripts/ci/causal_receipt_typestate_gate.sh"
      - "scripts/ci/fleet_transaction_typestate_gate.sh"
      - "scripts/ci/witness_declares_its_sabotage_gate.sh"
      - "scripts/dev/*sounio_coord*"
      - "scripts/dev/*sounio_fleet*"
      - "scripts/dev/*sounio_loom*"
      - "stdlib/coordination/**"
      - "tests/compile-fail/loom_obligation_*"
      - "tests/compiler/causal_receipt*"
      - "tests/compiler/fleet_transaction*"
      - "tests/compiler/loom_*"
      - "tools/loom/**"
  workflow_dispatch:
    inputs:
      pod_replay_phase:
        description: Phase to run on a persistent Sounio workspace runner
        required: true
        default: none
        type: choice
        options:
          - none
          - phase-one
          - phase-two
          - phase-three
          - phase-four
          - report

permissions:
  contents: read

concurrency:
  group: loom-coordination-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coordination-runtime:
    name: Coordination runtime and fleet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install process test dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Crash recovery
        run: bash scripts/ci/sounio_coord_crash_recovery_selftest.sh
      - name: Tmux-independent supervisor and fleet composition
        run: bash scripts/ci/sounio_coord_agentd_selftest.sh
      - name: Causal coordination receipts
        run: bash scripts/ci/sounio_coord_causal_selftest.sh
      - name: Immediate wake transport
        run: bash scripts/ci/sounio_coord_wake_selftest.sh
      - name: Semantic ownership
        run: bash scripts/ci/sounio_coord_semantic_selftest.sh
      - name: Fleet desired-state reconciliation
        run: bash scripts/ci/sounio_coord_fleet_selftest.sh
      - name: Fleet transaction authority
        run: bash scripts/ci/sounio_coord_fleetd_selftest.sh
      - name: Fleet crash laboratory
        run: bash scripts/ci/sounio_coord_fleet_crash_selftest.sh
      - name: Fleet trace refinement
        run: bash scripts/ci/sounio_coord_fleet_trace_selftest.sh
      - name: Bounded fleet model
        run: bash scripts/ci/sounio_coord_fleet_model_selftest.sh

  typestates:
    name: Sounio coordination and falsification contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install typestate inspection dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Causal receipt typestate
        run: bash scripts/ci/causal_receipt_typestate_gate.sh
      - name: Fleet transaction typestate
        run: bash scripts/ci/fleet_transaction_typestate_gate.sh
      - name: Continuity typestate
        run: bash scripts/ci/loom_continuity_typestate_gate.sh
      - name: Durable obligation typestate
        run: bash scripts/ci/loom_obligation_typestate_gate.sh
      - name: Declared sabotage census against the shipped compiler
        env:
          SOUNIO_WITNESS_SABOTAGE_MADAROS: ./bin/madaros
        run: bash scripts/ci/witness_declares_its_sabotage_gate.sh

  loom-native:
    name: Native Loom continuity kernel
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl socat tmux
          opam install --yes dune cryptokit
      - name: Shared immutable runtime
        run: opam exec -- bash scripts/ci/sounio_coord_runtime_selftest.sh
      - name: Native Loom kernel
        run: opam exec -- bash scripts/ci/sounio_loom_selftest.sh
      - name: Native continuity adapter
        run: opam exec -- bash scripts/ci/sounio_loom_continuity_adapter_selftest.sh
      - name: Native obligation adapter
        run: opam exec -- bash scripts/ci/sounio_loom_obligation_adapter_selftest.sh
      - name: Durable obligation journal
        run: opam exec -- bash scripts/ci/sounio_loom_obligation_selftest.sh
      - name: Obligation crash matrix
        run: opam exec -- bash scripts/ci/sounio_loom_obligation_crash_matrix_selftest.sh
      - name: Beagle compatibility bridge
        run: opam exec -- bash scripts/ci/sounio_loom_beagle_bridge_selftest.sh
      - name: Signed continuity receipts
        run: opam exec -- bash scripts/ci/sounio_loom_signed_receipt_selftest.sh
      - name: Distinct receipt principals
        run: opam exec -- bash scripts/ci/sounio_loom_principal_independence_selftest.sh
      - name: Independent continuity measurement
        run: opam exec -- bash scripts/ci/sounio_loom_independent_measurement_selftest.sh
      - name: Correct signature with false facts sabotage
        run: opam exec -- bash scripts/ci/sounio_loom_correct_signature_wrong_facts_probe.sh
      - name: Observation authority
        run: opam exec -- bash scripts/ci/sounio_loom_observation_authority_selftest.sh
      - name: Observation authority quorum
        run: opam exec -- bash scripts/ci/sounio_loom_journal_quorum_selftest.sh
      - name: Kubernetes hook safety
        run: opam exec -- bash scripts/ci/sounio_loom_kubernetes_hook_selftest.sh
      - name: Pod replay canary harness
        run: opam exec -- bash scripts/ci/sounio_loom_pod_replay_canary_selftest.sh

  pod-replay-canary:
    name: Persistent Pod replay phase
    if: github.event_name == 'workflow_dispatch' && inputs.pod_replay_phase != 'none'
    runs-on: [self-hosted, linux, sounio-workspace]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build source-selected Loom
        run: scripts/dev/build_sounio_loom.sh
      - name: Run one persistent replay phase
        env:
          SOUNIO_LOOM_POD_CANARY_ROOT: /state/loom-pod-replay
        run: bash scripts/ci/sounio_loom_pod_replay_canary.sh "${{ inputs.pod_replay_phase }}"
