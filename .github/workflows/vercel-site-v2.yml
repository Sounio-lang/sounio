name: Deploy site-v2 to Vercel

# Esqueleto no main. O GitHub só dispara workflow_dispatch de um workflow que
# exista no branch padrão; disparado com --ref, roda a versão daquele ref.
# A versão real (build Swift + deploy --prebuilt no projeto sounio-next) vive
# em feat/site-v2-evidence-compiled (#2464) e substitui este arquivo no merge.
#
# Uso: gh workflow run vercel-site-v2.yml --ref feat/site-v2-evidence-compiled -f target=preview
#
# Não referencia caminhos de script: os do site ainda não existem no main, e o
# portão de referências de workflow reprovaria.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run the placeholder
        run: |
          echo "::error::Este é o esqueleto do main. Dispare com --ref feat/site-v2-evidence-compiled (ver #2464)."
          exit 1
