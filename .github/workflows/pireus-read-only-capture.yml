name: Pireus Read-Only Capture

on:
  pull_request:
    paths:
      - '.github/workflows/pireus-read-only-capture.yml'
      - 'stdlib/coordination/spark_pair_read_only_capture_profile.sio'
      - 'tools/cluster/spark_pair_read_only_capture*'
      - 'scripts/dev/build_sounio_spark_pair_read_only_capture_profile.sh'
      - 'scripts/dev/spark_pair_read_only_capture_arm64_gate.sh'
      - 'scripts/ci/spark_pair_read_only_capture*'
      - 'tests/fixtures/spark_pair_arbiter/spark_pair_read_only_capture_profile_vectors.sio'
      - 'docs/internal/concepts/spark-pair-reversible-decommission.md'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pireus-read-only-capture.yml'
      - 'stdlib/coordination/spark_pair_read_only_capture_profile.sio'
      - 'tools/cluster/spark_pair_read_only_capture*'
      - 'scripts/dev/build_sounio_spark_pair_read_only_capture_profile.sh'
      - 'scripts/dev/spark_pair_read_only_capture_arm64_gate.sh'
      - 'scripts/ci/spark_pair_read_only_capture*'
      - 'tests/fixtures/spark_pair_arbiter/spark_pair_read_only_capture_profile_vectors.sio'
      - 'docs/internal/concepts/spark-pair-reversible-decommission.md'
      - 'docs/internal/garden/seeds/2026-08-31-spark-pair-arbiter.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-read-only-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Sounio semantic authority and exact DENY315
        run: bash scripts/ci/spark_pair_read_only_capture_profile_selftest.sh
      - name: Verify C++20 parity, live receipt hashes, and negative gates
        run: bash scripts/ci/spark_pair_read_only_capture_material_selftest.sh
      - name: Parse capture surfaces
        run: |
          bash -n scripts/dev/build_sounio_spark_pair_read_only_capture_profile.sh
          bash -n scripts/dev/spark_pair_read_only_capture_arm64_gate.sh
          bash -n scripts/ci/spark_pair_read_only_capture_profile_selftest.sh
          bash -n scripts/ci/spark_pair_read_only_capture_material_selftest.sh
      - name: Validate semantic and documentation registries
        run: |
          bash scripts/dev/sounio_semantic_status.sh
          bash scripts/dev/check_docs_registry.sh
