name: Chemistry probe golden

# Byte-for-byte golden outputs of the three Sounio replica-side probes behind
# benchmarks/chemistry/RESULTS.md (§2.6 adiabatic defect, §7.3 reverse-rate
# defect, §7.7 stagnation test), run under lean_single -- the engine every
# number in that file was produced on. A diff means a number in the paper
# moved. Path-filtered because the adiabatic probe integrates ~1e6 RK4 steps.

on:
  pull_request:
    paths:
      - 'examples/chemistry/**'
      - 'stdlib/chemistry/**'
      - 'benchmarks/chemistry/golden/**'
      - 'scripts/ci/chemistry_probe_golden_gate.sh'
      - 'bin/souc*'
  push:
    branches: [main]
    paths:
      - 'examples/chemistry/**'
      - 'stdlib/chemistry/**'
      - 'benchmarks/chemistry/golden/**'
  workflow_dispatch:

concurrency:
  group: chemistry-probe-golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Chemistry probe golden
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Three probes match their committed output
        run: bash scripts/ci/chemistry_probe_golden_gate.sh
