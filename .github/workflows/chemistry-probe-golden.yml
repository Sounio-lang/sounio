name: Chemistry probe golden

# Byte-for-byte golden outputs of four of the five Sounio replica-side probes
# behind benchmarks/chemistry/RESULTS.md (§2.6 adiabatic defect, §7.3
# reverse-rate defect, §7.7 stagnation test), run under lean_single -- the
# engine every number in that file was produced on. A diff means a number in
# the paper moved.
#
# Comment said "three" from 2026-09-02 to 2026-09-22: gbs_oracle and
# h2_ignition_uq_demo were added to the gate's PROBES array on 2026-09-02/03
# without this comment, the per-probe timeout, or timeout-minutes below being
# updated to match -- which is why this workflow was cancelled or timed out on
# effectively every run since (56 of the last 60). The gate script now runs
# its four probes concurrently (independent processes, no shared state), so
# wall time is roughly the slowest single probe rather than the sum.
#
# The fifth probe, rep_adiabatic_bug, is NOT run here, on any trigger,
# including a schedule or workflow_dispatch. Measured directly: it integrates
# 2.4e6 RK4 steps and takes ~26.2 hours. GitHub Actions caps a single
# hosted-runner job at 360 minutes -- a hard ceiling no timeout-minutes value
# or job placement can get this probe under, isolated or not. A trigger that
# fails its own job timeout on every single invocation is worse than no
# automation, so there isn't one. Verify rep_adiabatic_bug by hand when
# touching it or the chemistry module it exercises (budget a full day):
#   SOUNIO_CHEM_PROBES="rep_adiabatic_bug" bash scripts/ci/chemistry_probe_golden_gate.sh
# Full reasoning and the measurement are in the gate script's own header.

on:
  pull_request:
    paths:
      - 'examples/chemistry/**'
      - 'stdlib/chemistry/**'
      - 'benchmarks/chemistry/golden/**'
      - 'scripts/ci/chemistry_probe_golden_gate.sh'
      - 'bin/souc*'
  push:
    branches: [main]
    paths:
      - 'examples/chemistry/**'
      - 'stdlib/chemistry/**'
      - 'benchmarks/chemistry/golden/**'
  workflow_dispatch:

concurrency:
  group: chemistry-probe-golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Chemistry probe golden
    runs-on: ubuntu-24.04
    # Parallel, so this covers the slowest of the four, h2_ignition_uq_demo's
    # 6600s (110 min) ceiling, plus checkout/startup/report overhead.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Four probes match their committed output
        run: bash scripts/ci/chemistry_probe_golden_gate.sh
