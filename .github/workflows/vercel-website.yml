name: Deploy Website to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    tags:
      - 'website-v*'

permissions:
  contents: read

concurrency:
  group: vercel-website-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run website quality gates
        run: npm run check:quality

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull preview environment
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Pull production environment
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build preview deployment
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Build production deployment
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
        id: deploy_preview
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $url"

      - name: Deploy production
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
        id: deploy_production
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Deployment summary
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "preview" ]; then
            echo "Deployed preview: ${{ steps.deploy_preview.outputs.url }}"
          else
            echo "Deployed production: ${{ steps.deploy_production.outputs.url }}"
          fi
