name: EISA origin

# R7 acceptance gate (founder ruling 2026-08-20): EReg.origin is stamped so
# first-order GUM stops assuming independence by identifier name.
#
# Dedicated workflow rather than a step in ci.yml: that file is under other
# lanes' claims, and taking it wholesale from a branch has already deleted a
# step another PR had added. A gate that no workflow names is not a gate
# (#1994) -- which is exactly why this PR's Contracts job was red.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eisa-origin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eisa-origin:
    name: EISA origin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: R7 origin acceptance
        run: bash scripts/ci/eisa_origin_gate.sh
