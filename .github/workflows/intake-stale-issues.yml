name: Intake Stale Issues

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure stale intake label exists
        uses: actions/github-script@v7
        with:
          script: |
            const label = {
              name: "stale:needs-intake",
              color: "cfd3d7",
              description: "Issue is stale while waiting for required intake fields"
            };
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } else {
                throw error;
              }
            }

      - name: Mark intake-incomplete issues stale
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale:needs-intake
          only-issue-labels: needs:evidence,traceability:missing
          exempt-issue-labels: release-blocker,release-readiness,pinned,security
          stale-issue-message: |
            This issue is being marked stale because it is missing required intake details.
            Please update it with exact reproduction evidence and/or traceability IDs.
            Once updated, remove `stale:needs-intake` or comment to continue triage.
          close-issue-message: |
            Closing due to missing intake details after the stale period.
            Re-open with updated reproduction evidence + traceability mapping.
          operations-per-run: 200
