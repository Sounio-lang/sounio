name: Correlated effect

# R6 (founder ruling 2026-08-20): `m + m` on a Knowledge value shares a slot,
# so first-order GUM may not assume independence -- the caller must declare
# `with Correlated`. Two gates: the acceptance controls, and a ratchet on the
# slot-identity debt that would require the effect once it is demanded.
#
# Dedicated workflow rather than a step in ci.yml: that file is under other
# lanes' claims, and taking it wholesale from a branch has already deleted a
# step another PR had added. A gate that no workflow names is not a gate
# (#1994) -- which is exactly why this PR's Contracts job was red.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: correlated-effect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correlated-effect:
    name: Correlated effect
    runs-on: ubuntu-24.04
    # Current-source Madaros build is required for E221 behavioural controls;
    # the prebuilt bin/souc ELF does not carry this PR's checker.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Slot-identity debt ratchet
        run: bash scripts/ci/correlated_slot_ratchet_gate.sh

      - name: Negative control — a new slot-identity site must fail the ratchet
        run: |
          set -euo pipefail
          # The ratchet freezes Knowledge-binding same-ident debt at 0 and
          # skips tests/. Plant a live site under examples/ (counted path),
          # assert the gate goes red for the right reason, then restore.
          sabotage=examples/_correlated_ratchet_sabotage.sio
          cat > "$sabotage" <<'SIO'
          // temporary: CI negative control for correlated_slot_ratchet_gate
          fn _corr_sabotage() -> i32 with IO, Epistemic {
              let m = measure(1.0, uncertainty: 0.1)
              let a = m + m
              0
          }
          SIO
          set +e
          bash scripts/ci/correlated_slot_ratchet_gate.sh > /tmp/corr_neg.log 2>&1
          rc=$?
          set -e
          rm -f "$sabotage"
          if [[ "$rc" -eq 0 ]]; then
            echo "NEGATIVE_CONTROL_FAIL: ratchet stayed green after planting m+m"
            cat /tmp/corr_neg.log
            exit 1
          fi
          grep -q 'debt rose' /tmp/corr_neg.log || {
            echo "NEGATIVE_CONTROL_FAIL: red, but not for the ratchet reason"
            cat /tmp/corr_neg.log
            exit 1
          }
          echo "NEGATIVE_CONTROL_PASS"
          tail -20 /tmp/corr_neg.log

      - name: Build current-source Madaros (E221 lives in the checker)
        run: bash scripts/ci/build_modular_madaros.sh artifacts/self-hosted/madaros

      - name: R6 acceptance controls
        env:
          MADAROS_RAW_BIN: ${{ github.workspace }}/artifacts/self-hosted/madaros
        run: bash scripts/ci/correlated_effect_gate.sh
