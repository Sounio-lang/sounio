name: Correlated effect

# R6 (founder ruling 2026-08-20): `m + m` on a Knowledge value shares a slot,
# so first-order GUM may not assume independence -- the caller must declare
# `with Correlated`. Two gates: the acceptance controls, and a ratchet on the
# slot-identity debt that would require the effect once it is demanded.
#
# Dedicated workflow rather than a step in ci.yml: that file is under other
# lanes' claims, and taking it wholesale from a branch has already deleted a
# step another PR had added. A gate that no workflow names is not a gate
# (#1994) -- which is exactly why this PR's Contracts job was red.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: correlated-effect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correlated-effect:
    name: Correlated effect
    runs-on: ubuntu-24.04
    # Current-source Madaros build is required for E221 behavioural controls;
    # the prebuilt bin/souc ELF does not carry this PR's checker.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Slot-identity debt ratchet
        run: bash scripts/ci/correlated_slot_ratchet_gate.sh

      - name: Negative control — a new slot-identity site must fail the ratchet
        run: |
          set -euo pipefail
          # The ratchet freezes Knowledge-binding same-ident debt at 0 and
          # skips tests/. Plant a live site under examples/ (counted path),
          # assert the gate goes red for the right reason, then restore.
          sabotage=examples/_correlated_ratchet_sabotage.sio
          cat > "$sabotage" <<'SIO'
          // temporary: CI negative control for correlated_slot_ratchet_gate
          fn _corr_sabotage() -> i32 with IO, Epistemic {
              let m = measure(1.0, uncertainty: 0.1)
              let a = m + m
              0
          }
          SIO
          set +e
          bash scripts/ci/correlated_slot_ratchet_gate.sh > /tmp/corr_neg.log 2>&1
          rc=$?
          set -e
          rm -f "$sabotage"
          if [[ "$rc" -eq 0 ]]; then
            echo "NEGATIVE_CONTROL_FAIL: ratchet stayed green after planting m+m"
            cat /tmp/corr_neg.log
            exit 1
          fi
          grep -q 'debt rose' /tmp/corr_neg.log || {
            echo "NEGATIVE_CONTROL_FAIL: red, but not for the ratchet reason"
            cat /tmp/corr_neg.log
            exit 1
          }
          echo "NEGATIVE_CONTROL_PASS"
          tail -20 /tmp/corr_neg.log

      # Restore-only, best-effort: this workflow runs as a separate GitHub
      # Actions *run* from ci.yml's madaros-build job, so the two cannot share
      # an artifact via actions/upload-artifact (single-run scope only) -- only
      # actions/cache reaches across workflow files. A miss (races ci.yml's own
      # write, or a different impact selection) falls straight through to the
      # from-source build below, unchanged from today's behavior. Deliberately
      # restore-only (not the read+write action) so this workflow never races
      # ci.yml's own cache write for the same key.
      # Key MUST match ci.yml's madaros-build job's key exactly (including
      # github.sha -- GitHub Actions cache keys are immutable on an exact hit,
      # so omitting the commit sha would let a stale entry from an earlier
      # commit with the same hashFiles() value permanently occupy this slot;
      # see ci.yml's own comment on this step for the full failure mode).
      - name: Restore cached Madaros build
        uses: actions/cache/restore@v4
        with:
          path: artifacts/self-hosted/madaros-build-cache
          key: madaros-build-v1-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('self-hosted/**', 'stdlib/**', 'bin/souc-linux-x86_64', 'bin/souc-lean-single-x86_64', 'bin/souc', 'scripts/ci/build_modular_madaros.sh', 'scripts/dev/souc-build-lock.sh') }}

      - name: Ensure verified Madaros build (E221 lives in the checker)
        env:
          SOUNIO_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/ci/ensure_madaros_build.sh artifacts/self-hosted/madaros-build-cache/madaros

      - name: R6 acceptance controls
        env:
          MADAROS_RAW_BIN: ${{ github.workspace }}/artifacts/self-hosted/madaros-build-cache/madaros
        run: bash scripts/ci/correlated_effect_gate.sh
