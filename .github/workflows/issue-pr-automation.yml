name: Issue & PR Automation

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: '35 4 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  issue-triage:
    name: Issue Triage
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Auto-label issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];
            if (title.includes('bug')) labels.push('bug');
            if (title.includes('feature')) labels.push('enhancement');
            if (title.includes('docs')) labels.push('documentation');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

  pr-triage:
    name: PR Triage
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Auto-label PR
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const labels = [];
            const paths = files.data.map(f => f.filename);
            if (paths.some(p => p.startsWith('self-hosted/'))) labels.push('compiler');
            if (paths.some(p => p.startsWith('stdlib/'))) labels.push('stdlib');
            if (paths.some(p => p.startsWith('docs/'))) labels.push('documentation');
            if (paths.some(p => p.startsWith('.github/'))) labels.push('ci');
            if (paths.some(p => p.endsWith('.sio'))) labels.push('sounio');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }

  stale-cleanup:
    name: Stale Issue Cleanup
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been automatically marked as stale due to inactivity.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
