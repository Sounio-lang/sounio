name: Selfhost Regression Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  selfhost-cli-exit-regression:
    name: Selfhost CLI Exit Regression (no-rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned souc binary
        run: |
          chmod +x scripts/omega/omega_resolve_souc_bin.sh
          SOUC_BIN="$(
            SOUNIO_SOUC_VERSION=0.100.3 \
            OMEGA_SOUC_REQUIRE_PINNED=1 \
            OMEGA_SOUC_ALLOW_LOCAL_FALLBACK=0 \
              scripts/omega/omega_resolve_souc_bin.sh --print-path
          )"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"
      - name: Run selfhost driver output regression gate
        env:
          SOUNIO_REPO_HARD_NO_RUST: "1"
        run: |
          bash scripts/selfhost_driver_output_gate.sh
      - name: Run refinement strict gate
        env:
          SOUNIO_REPO_HARD_NO_RUST: "1"
        run: |
          bash scripts/refinement_gate.sh

  sprint1-critical-bug-fixes:
    name: Sprint1 Critical Bug Fixes Gate (strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned souc binary
        run: |
          chmod +x scripts/omega/omega_resolve_souc_bin.sh
          SOUC_BIN="$(
            SOUNIO_SOUC_VERSION=0.100.3 \
            OMEGA_SOUC_REQUIRE_PINNED=1 \
            OMEGA_SOUC_ALLOW_LOCAL_FALLBACK=0 \
              scripts/omega/omega_resolve_souc_bin.sh --print-path
          )"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"
      - name: Resolve pinned JIT souc binary
        run: |
          chmod +x scripts/omega/omega_resolve_souc_bin.sh
          SOUC_JIT_BIN="$(
            SOUNIO_SOUC_VERSION=0.100.3-jit.1 \
            SOUNIO_SOUC_VARIANT=jit \
            OMEGA_SOUC_REQUIRE_PINNED=1 \
            OMEGA_SOUC_ALLOW_LOCAL_FALLBACK=0 \
              scripts/omega/omega_resolve_souc_bin.sh --print-path
          )"
          echo "SOUC_JIT_BIN=$SOUC_JIT_BIN" >> "$GITHUB_ENV"
      - name: Run sprint1 critical bug fixes gate (required pass)
        env:
          SOUNIO_SOUC_BIN: "${{ env.SOUC_BIN }}"
          SOUNIO_SOUC_JIT_BIN: "${{ env.SOUC_JIT_BIN }}"
          SOUNIO_SOUC_JIT_VERSION: "0.100.3-jit.1"
          SOUNIO_SPRINT1_REQUIRE_JIT_RUNNER: "1"
          SOUNIO_SPRINT1_GATE_REQUIRE_PASS: "1"
        run: |
          bash scripts/sprint1_critical_bug_fixes_gate.sh
      - name: Upload sprint1 bug-fix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-critical-bug-fixes
          path: |
            artifacts/sprint1/critical_bug_fixes_gate.v1.json
            artifacts/sprint1/int_to_string_perf_gate.v1.json
          retention-days: 7
