name: Selfhost Regression Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  selfhost-cli-exit-regression:
    name: Selfhost CLI Exit Regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run selfhost CLI non-zero exit regression test
        run: |
          cargo test -p souc --test selfhost_driver_directory_compilation -- selfhost_driver_check_returns_non_zero_for_parse_error
