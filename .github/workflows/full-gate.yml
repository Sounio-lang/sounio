name: Full Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  full-gate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gate')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned souc binary
        run: |
          chmod +x scripts/omega/omega_resolve_souc_bin.sh
          SOUC_BIN="$(
            SOUNIO_SOUC_VERSION=0.100.3 \
            OMEGA_SOUC_REQUIRE_PINNED=1 \
            OMEGA_SOUC_ALLOW_LOCAL_FALLBACK=0 \
              scripts/omega/omega_resolve_souc_bin.sh --print-path
          )"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"
      - name: Check workflow script references
        run: scripts/check_workflow_script_refs.sh
      - name: Run LSP smoke gate
        env:
          OMEGA_SOUC_REQUIRE_PINNED: "1"
          OMEGA_SOUC_ALLOW_LOCAL_FALLBACK: "0"
          SOUNIO_REPO_HARD_NO_RUST: "1"
          SOUNIO_LSP_STRICT_NO_RUST: "1"
        run: bash scripts/lsp_smoke_gate.sh
      - name: Verify LSP smoke status artifact
        run: |
          STATUS_PATH="${LSP_SMOKE_STATUS_PATH:-artifacts/omega/lsp_smoke_status.v1.json}"
          test -s "$STATUS_PATH"
          jq -e '.schema == "sounio.lsp.smoke.status.v1" and .status == "pass" and .pass_marker == true' "$STATUS_PATH"
      - name: Run full gate
        env:
          SOUNIO_REPO_HARD_NO_RUST: "1"
        run: scripts/full_gate.sh
      - name: Upload full gate governance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-gate-governance-artifacts
          path: |
            artifacts/omega/lsp_smoke.log
            artifacts/omega/lsp_smoke_status.v1.json
            artifacts/omega/claude_operational_contract_status.v1.json
          retention-days: 7
