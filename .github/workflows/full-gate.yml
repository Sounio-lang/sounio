name: Full Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  full-gate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gate')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned souc binary
        run: |
          chmod +x scripts/omega/omega_resolve_souc_bin.sh
          SOUC_BIN="$(scripts/omega/omega_resolve_souc_bin.sh --print-path --allow-local-fallback)"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"
      - name: Check workflow script references
        run: scripts/check_workflow_script_refs.sh
      - name: Run full gate
        env:
          SOUNIO_REPO_HARD_NO_RUST: "1"
        run: scripts/full_gate.sh
