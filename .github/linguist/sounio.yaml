# GitHub Linguist language definition for Sounio
# Submit as PR to https://github.com/github-linguist/linguist
#
# References:
#   - Linguist contributing guide: https://github.com/github-linguist/linguist/blob/main/CONTRIBUTING.md
#   - Language addition requirements: unique file extension, >200 repos or notable project
#   - Color chosen to complement Rust (#dea584) and Julia (#9558B2) while standing apart

sounio:
  type: programming
  color: "#4B8BBE"
  extensions:
    - ".sio"
  tm_scope: source.sounio
  ace_mode: rust          # closest available fallback for web editors
  codemirror_mode: rust   # closest fallback for CodeMirror
  codemirror_mime_type: text/x-rustsrc
  language_id: 999001     # placeholder -- GitHub assigns the real ID on merge
  aliases:
    - sio
  group: Sounio
  filenames: []
  interpreters: []
  wrap: false
