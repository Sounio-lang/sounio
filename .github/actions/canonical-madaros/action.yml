name: Verified canonical Madaros
description: Download the same-run source-built ELF and fail closed on provenance mismatch.
inputs:
  artifact-name:
    description: Immutable artifact name from the successful producer attempt
    required: true
  sha256:
    description: Binary digest from the successful producer job
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: /tmp/madaros-canonical
    - name: Verify binary and source provenance before execution
      shell: bash
      env:
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: python3 scripts/ci/canonical_madaros_artifact.py verify /tmp/madaros-canonical --expected-sha256 "$EXPECTED_SHA256"
