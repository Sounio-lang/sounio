name: Release Readiness Regression
description: Report a regression in release-critical gates with line-by-line evidence
title: "[Release Regression]: "
labels: ["release-readiness", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for regressions that block release readiness.
        Include exact commands, failing output, and traceability mapping.

  - type: dropdown
    id: gate_command
    attributes:
      label: Regressed Gate
      description: Which release-critical check regressed?
      options:
        - cargo check -p souc
        - strict source pipeline test
        - strict file pipeline test
        - cargo test -p souc --lib
        - bash scripts/fast_gate.sh
        - scripts/check_workflow_script_refs.sh
        - scripts/check_docs_consistency.sh
        - npm --prefix website run check:quality
        - Other
    validations:
      required: true

  - type: checkboxes
    id: release_scope
    attributes:
      label: Affected Scope
      options:
        - label: Compiler
        - label: Docs
        - label: Website
        - label: CI / Workflow contracts
        - label: Multi-scope regression
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (release blocker)
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      options:
        - S (hours)
        - M (1-2 days)
        - L (3-5 days)
        - XL (1+ week)
    validations:
      required: true

  - type: input
    id: traceability_ids
    attributes:
      label: Traceability Matrix ID(s)
      description: Existing ID(s) this regression touches.
      placeholder: "COMP-001, WEB-001"
    validations:
      required: true

  - type: textarea
    id: failing_command
    attributes:
      label: Failing Command(s)
      description: Exact command(s) run from repository root.
      placeholder: |
        bash scripts/with_isolated_env.sh cargo test -p souc --lib
    validations:
      required: true

  - type: textarea
    id: failing_output
    attributes:
      label: Failing Output (key lines)
      description: Include concise output with line references if available.
      placeholder: |
        error: ...
        at logs/fast_gate-rerun.log:1234
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
      description: What should pass after the fix?
      placeholder: Command exits 0 and traceability matrix status returns to Closed.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Regression Report Checklist
      options:
        - label: I included exact failing command(s) and output.
          required: true
        - label: I included traceability IDs.
          required: true
