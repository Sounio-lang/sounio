name: Bug Report
description: Report a bug in the Sounio compiler or standard library
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.

  - type: checkboxes
    id: release_scope
    attributes:
      label: Affected Release Scope
      description: Select every scope impacted by this bug.
      options:
        - label: Compiler (`cargo check -p souc`, strict selfhost tests, `cargo test -p souc --lib`)
        - label: Docs (`scripts/check_docs_consistency.sh`)
        - label: Website (`npm --prefix website run check:quality`)
        - label: CI / Workflow contracts
        - label: Other / non-release-blocking
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is the impact?
      options:
        - Critical (release blocker)
        - High (major user impact, workaround exists)
        - Medium (moderate impact)
        - Low (minor impact)
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      description: How confident are you in the diagnosis?
      options:
        - High (reproducible and localized)
        - Medium (reproducible, root cause uncertain)
        - Low (intermittent or uncertain)
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      description: Best estimate to fix fully (root cause, not workaround).
      options:
        - S (hours)
        - M (1-2 days)
        - L (3-5 days)
        - XL (1+ week)
    validations:
      required: true

  - type: input
    id: traceability_ids
    attributes:
      label: Traceability Matrix ID(s)
      description: Reference relevant IDs (for example `COMP-001`, `WEB-001`) or `N/A`.
      placeholder: "COMP-001, WEB-001"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Create a file with...
        2. Run `souc check ...`
        3. See error...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Compiler Phase
      description: If known, in which phase does the bug occur?
      options:
        - Lexer/Parser
        - Type Checker (Inference/Refinement)
        - Effect Checking
        - Optimization
        - Code Generation (LLVM/GPU)

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Example
      description: Minimal Sounio code that demonstrates the issue.
      render: sio
      placeholder: |
        // Paste your Sounio code here
        fn main() {
            // ...
        }

  - type: input
    id: version
    attributes:
      label: Sounio Version
      description: Output of `souc --version`
      placeholder: "souc 0.7.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (error messages, logs, screenshots).
