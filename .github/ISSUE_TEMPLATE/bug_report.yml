name: Bug Report
description: Report a reproducible bug in compiler/docs/website/release gates
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For fast triage, include exact commands and outputs.
        If this is release-critical, link relevant traceability IDs (for example `COMP-001`, `WEB-001`).

  - type: checkboxes
    id: release_scope
    attributes:
      label: Affected Release Scope
      description: Select every scope impacted by this bug.
      options:
        - label: Compiler (`cargo check -p souc`, strict selfhost tests, `cargo test -p souc --lib`)
        - label: Docs (`scripts/check_docs_consistency.sh`)
        - label: Website (`npm --prefix website run check:quality`)
        - label: CI / Workflow contracts
        - label: Other / non-release-blocking
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How bad is the impact?
      options:
        - Critical (release blocker)
        - High (major user impact, workaround exists)
        - Medium (moderate impact)
        - Low (minor impact)
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      description: How confident are you in the diagnosis?
      options:
        - High (reproducible and localized)
        - Medium (reproducible, root cause uncertain)
        - Low (intermittent or uncertain)
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      description: Best estimate to fix fully (root cause, not workaround).
      options:
        - S (hours)
        - M (1-2 days)
        - L (3-5 days)
        - XL (1+ week)
    validations:
      required: true

  - type: input
    id: traceability_ids
    attributes:
      label: Traceability Matrix ID(s)
      description: Reference relevant IDs (for example `COMP-001`, `WEB-001`) or `N/A`.
      placeholder: "COMP-001, WEB-001"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug and why it matters.
      placeholder: Describe the bug and impact...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Commands
      description: Exact command(s) to reproduce, from repository root when possible.
      placeholder: |
        bash scripts/with_isolated_env.sh cargo test -p souc --lib
        npm --prefix website run check:quality
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Output
      description: Paste the failing output and include key lines.
      placeholder: |
        error: ...
        stack overflow ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Code Example (optional)
      description: Minimal Sounio snippet or file path if relevant.
      render: sio
      placeholder: |
        fn main() {
            // ...
        }

  - type: input
    id: version
    attributes:
      label: Sounio Version
      description: Output of `souc --version`.
      placeholder: "souc 1.0.0-beta"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System / Environment
      options:
        - Linux
        - macOS
        - Windows
        - GitHub Actions / CI
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Report Checklist
      options:
        - label: I included exact reproduction command(s) and output.
          required: true
        - label: I checked existing issues for duplicates.
          required: true
