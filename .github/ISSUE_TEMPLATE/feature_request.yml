name: Feature Request
description: Suggest a new feature or enhancement for Sounio
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A clear and concise description of the feature you'd like.
      placeholder: I would like Sounio to...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature important? What problem does it solve?
      placeholder: |
        This would help because...
        Currently I have to work around this by...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
      placeholder: |
        The syntax could look like:
        ```sio
        // example code
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches?
      placeholder: |
        I've also thought about...

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of Sounio does this relate to?
      options:
        - Compiler (parser, type checker)
        - Standard Library
        - Effect System
        - Type System (units, refinements, epistemic)
        - Codegen (LLVM, JIT, GPU)
        - Tooling (LSP, REPL, package manager)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, references, or examples from other languages.
