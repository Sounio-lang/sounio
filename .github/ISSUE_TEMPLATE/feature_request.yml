name: Feature Request
description: Propose a feature with explicit release impact and acceptance criteria
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Please include concrete acceptance criteria and impact.
        We prioritize by Severity + Confidence + Effort and traceability to release scopes.

  - type: checkboxes
    id: release_scope
    attributes:
      label: Affected Release Scope
      description: Select all scopes impacted by this request.
      options:
        - label: Compiler
        - label: Docs
        - label: Website
        - label: CI / Workflow contracts
        - label: Other / non-release-blocking
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity (if not implemented)
      options:
        - Critical (release blocker)
        - High (major capability gap)
        - Medium (useful but not blocking)
        - Low (nice-to-have)
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      description: How confident are you in the requested direction?
      options:
        - High (clear need and approach)
        - Medium (need is clear, approach may vary)
        - Low (exploratory)
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      options:
        - S (hours)
        - M (1-2 days)
        - L (3-5 days)
        - XL (1+ week)
    validations:
      required: true

  - type: input
    id: traceability_ids
    attributes:
      label: Traceability Matrix ID(s)
      description: Existing IDs impacted (for example `COMP-001`, `WEB-001`) or `N/A`.
      placeholder: "DOC-001, WEB-001"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What should exist after this feature lands?
      placeholder: I would like Sounio to...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Problem
      description: Why is this important? What pain does it remove?
      placeholder: |
        This matters because...
        Current workaround...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe expected behavior, interface, and flow.
      placeholder: |
        Proposed design:
        ```sio
        // example
        ```
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What exact command(s)/checks prove this is done?
      placeholder: |
        - cargo check -p souc
        - SOUNIO_SELFHOST_DRIVER_STRICT=1 cargo test -p souc ...
        - npm --prefix website run check:quality
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary Area
      description: Which subsystem is primary?
      options:
        - Compiler (parser/checker/lowering)
        - Standard Library
        - Codegen (native/LLVM/JIT/GPU)
        - Tooling (LSP/REPL/pkg)
        - Website / Docs
        - CI / Release process
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches considered and why not chosen.

  - type: checkboxes
    id: checklist
    attributes:
      label: Request Checklist
      options:
        - label: I searched for existing feature requests.
          required: true
        - label: I included concrete acceptance criteria.
          required: true
