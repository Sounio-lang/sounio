[package]
name = "souc"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = [
    "compiler",
    "programming-language",
    "epistemic",
    "scientific-computing",
]
categories = ["compilers", "development-tools", "science"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/souc-{ target }.tar.gz"
bin-dir = "souc{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "souc"
path = "src/main.rs"

[lib]
name = "sounio"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
# Error handling
miette.workspace = true
thiserror.workspace = true

# CLI
clap.workspace = true

# Data structures
indexmap.workspace = true
petgraph.workspace = true
id-arena.workspace = true

# String interning
string-interner.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Markdown parsing
pulldown-cmark.workspace = true

# Lexer generation
logos.workspace = true

# Source code management
codespan-reporting.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber.workspace = true

# File system utilities
walkdir.workspace = true

# Build system
sha2.workspace = true
hex.workspace = true
bincode.workspace = true
glob.workspace = true
num_cpus.workspace = true

# Signal handling
ctrlc.workspace = true

# Parallel processing
rayon.workspace = true

# Cross-compilation
which.workspace = true
dirs.workspace = true
chrono.workspace = true

# Ontology support
lru.workspace = true
rusqlite = { workspace = true, optional = true }

# Ontology parsing (RDF/OWL)
rio_turtle = { workspace = true, optional = true }
rio_xml = { workspace = true, optional = true }
rio_api = { workspace = true, optional = true }

# LLM integration
regex = { workspace = true, optional = true }
lazy_static = { workspace = true, optional = true }

# Cranelift JIT
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
cranelift-object = { workspace = true, optional = true }
target-lexicon = { workspace = true, optional = true }

# REPL
rustyline.workspace = true

# SMT Solver
z3 = { workspace = true, optional = true }

# LLVM Backend
inkwell = { workspace = true, optional = true }

# GPU Backend
rspirv = { workspace = true, optional = true }
spirv = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
rustc-hash.workspace = true

# WASM support
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

# LSP Server
tower-lsp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
ropey = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# Distributed builds
axum = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
flate2 = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }

# Package manager
tar = { workspace = true, optional = true }
async-compression = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
libm = "0.2.16"

# GPU compute (WGPU for effect handlers)
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
insta.workspace = true
tempfile.workspace = true
regex.workspace = true
bytemuck.workspace = true

[features]
default = []
# Enable LLVM backend with LLVM 15 (default, requires LLVM 15 installation)
# Note: Code uses LLVM 15 opaque pointer APIs
llvm = ["llvm15"]
# LLVM version-specific features - each enables the base "llvm-base" marker
# The code checks cfg(feature = "llvm-base") which any LLVM version enables
llvm14 = ["llvm-base", "dep:inkwell", "inkwell/llvm14-0"]
llvm15 = ["llvm-base", "dep:inkwell", "inkwell/llvm15-0"]
llvm16 = ["llvm-base", "dep:inkwell", "inkwell/llvm16-0"]
llvm17 = ["llvm-base", "dep:inkwell", "inkwell/llvm17-0"]
# Internal marker - not meant for direct use
llvm-base = []
# Enable Cranelift JIT and AOT
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:cranelift-object",
    "dep:target-lexicon",
]
# Enable MIR optimization passes (automatically enabled with jit)
mir = ["jit"]
# Enable GPU codegen (PTX and SPIR-V)
gpu = ["dep:rspirv", "dep:spirv"]
# Enable CUDA runtime execution (requires CUDA toolkit)
cuda = ["dep:cudarc"]
# Enable Z3 SMT solver for refinement type verification
smt = ["dep:z3"]
# Enable LSP server
lsp = [
    "dep:tower-lsp",
    "dep:tokio",
    "dep:async-trait",
    "dep:dashmap",
    "dep:ropey",
    "dep:url",
]
# Enable distributed builds
distributed = [
    "dep:tokio",
    "dep:axum",
    "dep:reqwest",
    "dep:flate2",
    "dep:tower",
    "dep:tower-http",
    "dep:hyper",
    "dep:rand",
    "dep:serde_yaml",
]
# Enable ontology support with SQLite backend
ontology = ["dep:rusqlite"]
# Enable ontology build tools (OWL/RDF parsing)
ontology-build = ["dep:rio_turtle", "dep:rio_xml", "dep:rio_api"]
# Enable LLM integration for ontology generation and epistemic agents

# Enable GLM-4.7 integration for ML-guided optimization
glm = ["dep:regex", "dep:lazy_static", "dep:reqwest", "dep:tokio"]
llm = ["dep:regex", "dep:lazy_static"]
# Enable remote cache for distributed builds
remote-cache = ["distributed"]
# Enable cryptographic signatures for ontology versioning
crypto = []
# Enable network access for BioPortal API
network = ["dep:reqwest"]
# Enable package manager with registry support
pkg = [
    "dep:tokio",
    "dep:reqwest",
    "dep:flate2",
    "dep:tar",
    "dep:async-compression",
    "dep:futures",
    "dep:base64",
]
# Enable WASM target for browser playground
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "dep:getrandom",
]
# Enable real effect handlers (async, GPU, network)
effect-handlers = ["dep:tokio", "dep:wgpu", "dep:pollster", "dep:reqwest", "dep:tokio-tungstenite"]
# Individual handler features (for fine-grained control)
tokio = ["dep:tokio"]
wgpu = ["dep:wgpu", "dep:pollster"]
reqwest = ["dep:reqwest"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "tokio"]
# Enable all features
full = [
    "llvm",
    "jit",
    "gpu",
    "smt",
    "lsp",
    "distributed",
    "ontology",
    "llm",
    "remote-cache",
    "crypto",
    "pkg",
    "effect-handlers",
]

# Enable AVX-512 SIMD optimizations (requires nightly Rust)
avx512 = []

[[bin]]
name = "sounio-lsp"
path = "src/bin/lsp.rs"
required-features = ["lsp"]

[[bin]]
name = "sounio-ontology-build"
path = "src/bin/sounio-ontology-build.rs"

[[bin]]
name = "souniodoc"
path = "src/bin/souniodoc.rs"

[[bench]]
name = "natural_gradient_bench"
harness = false

[[bench]]
name = "compiler_bench"
path = "../../benches/compiler/compiler_bench.rs"
harness = false

[[bench]]
name = "octonion_bench"
path = "../../benches/compiler/octonion_bench.rs"
harness = false

[[bench]]
name = "octonion_benchmark"
path = "../../benches/compiler/octonion_benchmark.rs"
harness = false

[[bench]]
name = "quat_bench"
path = "../../benches/compiler/quat_bench.rs"
harness = false

[[bench]]
name = "ontology_bench"
path = "../../benches/compiler/ontology_bench.rs"
harness = false

[[bench]]
name = "propagation_benchmark"
path = "../../benches/compiler/propagation_benchmark.rs"
harness = false

[[bench]]
name = "gpu_bench"
path = "../../benches/compiler/gpu_bench.rs"
harness = false
required-features = ["gpu"]

[build-dependencies]
cc = "1.0"  # For compiling assembly files
