# Clippy configuration for Sounio compiler
# https://doc.rust-lang.org/clippy/configuration.html

# Cognitive complexity threshold (default: 25)
cognitive-complexity-threshold = 30

# Maximum lines in a function (default: 100)
too-many-lines-threshold = 150

# Maximum arguments for functions (default: 7)
too-many-arguments-threshold = 8

# Type complexity threshold (default: 250)
type-complexity-threshold = 300

# Allowed wildcard imports (for prelude modules)
allowed-wildcard-imports = [
    "crate::prelude",
    "crate::ast::*",
    "crate::types::*",
]

# Maximum nesting for blocks (default: 4)
excessive-nesting-threshold = 5

# MSRV - Minimum Supported Rust Version
msrv = "1.70.0"

# Allow these identifiers
allowed-idents-below-min-chars = ["x", "y", "z", "i", "j", "k", "n", "m", "a", "b", "c", "id", "ty", "op"]

# Documentation requirements
missing-docs-in-crate-items = false

# Disallowed methods (prefer safer alternatives)
disallowed-methods = [
    # Use expect() with descriptive message instead
    # "std::option::Option::unwrap",
    # "std::result::Result::unwrap",
]

# Disallowed types
disallowed-types = []
