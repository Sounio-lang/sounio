# MCP Server Configuration for Local Agent
# This file contains the complete configuration for the local MCP server

name: Local Agent
version: 1.1.0
schema: v1
description: Local MCP server with multiple AI models for Sounio development

# Server configuration
server:
  host: localhost
  port: 3000
  path: /mcp
  protocol: http
  cors:
    enabled: true
    origins: ["http://localhost:*", "https://*.anthropic.com"]

# Models configuration
models:
  # DeepSeek Models
  - name: DeepSeek Coder
    provider: deepseek
    model: deepseek-coder
    apiKey: ${DEEPSEEK_API_KEY}
    contextWindow: 128000
    maxTokens: 4096
    temperature: 0.7
    capabilities:
      - code_completion
      - code_generation
      - code_explanation
      - debugging

  # xAI Grok Models
  - name: Grok Code Fast 1
    provider: xAI
    model: grok-code-fast-1
    apiKey: ${XAI_API_KEY}
    contextWindow: 32768
    maxTokens: 8192
    temperature: 0.8
    capabilities:
      - fast_code_generation
      - code_optimization
      - technical_explanation

  - name: Grok 4 Fast Reasoning
    provider: xAI
    model: grok-4-fast-reasoning
    apiKey: ${XAI_API_KEY}
    contextWindow: 65536
    maxTokens: 16384
    temperature: 0.7
    capabilities:
      - complex_reasoning
      - problem_solving
      - strategic_planning

  - name: Grok 4.1 Fast Reasoning
    provider: xAI
    model: grok-4-1-fast-reasoning
    apiKey: ${XAI_API_KEY}
    contextWindow: 131072
    maxTokens: 32768
    temperature: 0.7
    capabilities:
      - advanced_reasoning
      - research_assistance
      - technical_writing

  # Z.AI GLM Models
  - name: GLM-5.1
    provider: z-ai
    model: glm-5-1
    apiKey: ${Z_AI_API_KEY}
    contextWindow: 256000
    maxTokens: 8192
    temperature: 0.8
    endpoint: https://api.z.ai/v1/chat/completions
    capabilities:
      - chinese_language
      - multilingual
      - creative_writing
      - analysis

  # MiniMax Models
  - name: MiniMax M2.7
    provider: minimax
    model: m2.7
    apiKey: ${MINIMAX_API_KEY}
    contextWindow: 204800
    maxTokens: 65536
    temperature: 0.7
    endpoint: https://api.minimax.io/anthropic
    capabilities:
      - long_context
      - document_analysis
      - summarization
      - translation

  # Google Gemini (via OpenRouter)
  - name: Gemini 2.5 Pro
    provider: openrouter
    model: google/gemini-2.5-pro
    apiKey: ${OPENROUTER_API_KEY}
    contextWindow: 1048576
    maxTokens: 65536
    temperature: 0.7
    capabilities:
      - long_context
      - code_analysis
      - math_reasoning
      - multimodal

  # Alibaba Qwen (via OpenRouter)
  - name: Qwen 3 235B
    provider: openrouter
    model: qwen/qwen3-235b-a22b
    apiKey: ${OPENROUTER_API_KEY}
    contextWindow: 131072
    maxTokens: 16384
    temperature: 0.7
    capabilities:
      - code_generation
      - math_reasoning
      - multilingual
      - analysis

  # Mistral (via OpenRouter)
  - name: Mistral Large
    provider: openrouter
    model: mistralai/mistral-large
    apiKey: ${OPENROUTER_API_KEY}
    contextWindow: 131072
    maxTokens: 16384
    temperature: 0.7
    capabilities:
      - formal_methods
      - reasoning
      - code_generation
      - european_perspective

  # Meta Llama (via OpenRouter)
  - name: Llama 4 Maverick
    provider: openrouter
    model: meta-llama/llama-4-maverick
    apiKey: ${OPENROUTER_API_KEY}
    contextWindow: 131072
    maxTokens: 16384
    temperature: 0.7
    capabilities:
      - code_generation
      - reasoning
      - diverse_training

  # Cohere (via OpenRouter)
  - name: Command A
    provider: openrouter
    model: cohere/command-a
    apiKey: ${OPENROUTER_API_KEY}
    contextWindow: 131072
    maxTokens: 8192
    temperature: 0.7
    capabilities:
      - structured_analysis
      - rag
      - literature_review
      - technical_writing

# Tools available through MCP
tools:
  - name: file_operations
    description: Read, write, and manipulate files
    enabled: true
    
  - name: code_analysis
    description: Analyze code structure and dependencies
    enabled: true
    
  - name: terminal_access
    description: Execute shell commands
    enabled: true
    
  - name: web_search
    description: Search the web for information
    enabled: true
    provider: tavily
    
  - name: sounio_compiler
    description: Sounio compiler integration
    enabled: true
    commands:
      - compile
      - check
      - run
      - test

# Routing rules
routing:
  default: deepseek-coder
  rules:
    - pattern: ".*code.*"
      model: deepseek-coder
    - pattern: ".*debug.*|.*fix.*"
      model: grok-code-fast-1
    - pattern: ".*reason.*|.*plan.*|.*design.*"
      model: grok-4-fast-reasoning
    - pattern: ".*research.*|.*analyze.*|.*paper.*"
      model: grok-4-1-fast-reasoning
    - pattern: ".*chinese.*|.*multilingual.*"
      model: glm-5-1
    - pattern: ".*document.*|.*summar.*|.*translate.*"
      model: minimax-m2.7
    - pattern: ".*math.*|.*proof.*|.*theorem.*"
      model: google/gemini-2.5-pro
    - pattern: ".*formal.*|.*verify.*|.*method.*"
      model: mistralai/mistral-large
    - pattern: ".*literature.*|.*review.*|.*survey.*"
      model: cohere/command-a
    - pattern: ".*algebra.*|.*octonion.*|.*numeric.*"
      model: qwen/qwen3-235b-a22b

# Environment variables needed
environment:
  required:
    - DEEPSEEK_API_KEY
    - XAI_API_KEY
    - OPENROUTER_API_KEY
  optional:
    - Z_AI_API_KEY
    - MINIMAX_API_KEY
    - GROQ_API_KEY
    - TAVILY_API_KEY

# Logging configuration
logging:
  level: info
  file: ./logs/mcp-server.log
  format: json
  rotation:
    maxSize: 100MB
    maxFiles: 10

# Health checks
health:
  endpoint: /health
  interval: 30s
  timeout: 5s