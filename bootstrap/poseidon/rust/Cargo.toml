[package]
name = "poseidon-wrapper"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "poseidon_wrapper"
path = "src/lib.rs"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "poseidon_bench"
harness = false
