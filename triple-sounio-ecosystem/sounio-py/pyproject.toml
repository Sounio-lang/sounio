[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sounio"
version = "0.1.0"
description = "Python bindings for the Sounio programming language"
readme = "README.md"
authors = [
    {name = "Sounio Team", email = "team@sounio.dev"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "ipython>=8.0",
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
    "black",
    "mypy",
    "ruff",
    "jupyter",
    "matplotlib",  # For examples
]
jupyter = [
    "jupyter-client",
    "jupyter-core",
    "ipykernel",
]

[project.urls]
Homepage = "https://sounio.dev"
Documentation = "https://docs.sounio.dev"
Repository = "https://github.com/sounio-lang/sounio-py"
"Bug Tracker" = "https://github.com/sounio-lang/sounio-py/issues"

[tool.maturin]
# Build Rust extension with PyO3
module-name = "sounio._sounio_native"
# Use stable features
features = ["extension-module"]
# Python package lives in python/ subdirectory (PEP 517 layout)
python-source = "python"

# Linting and formatting
[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Testing configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Ensure python/ package is importable without a maturin build
pythonpath = ["python"]

# Package metadata for PyPI
[metadata]
author = "Sounio Team"
author_email = "team@sounio.dev"
maintainer = "Sounio Team"
maintainer_email = "team@sounio.dev"
keywords = ["scientific", "epistemic", "uncertainty", "programming", "research"]
platform = "any"
