[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sounio-kernel"
version = "0.1.0"
description = "Jupyter kernel for the Sounio programming language with epistemic support"
readme = "README.md"
authors = [
    {name = "Sounio Team", email = "team@sounio.dev"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
]
requires-python = ">=3.8"
dependencies = [
    "ipykernel>=6.0",
    "jupyter-client>=7.0",
    "jupyter-core>=4.9",
    "ipython>=7.0",
    "pexpect>=4.6",  # For subprocess interaction
    "sounio>=0.1.0",  # For SounioExecutor and Knowledge support
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "ipython",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "jupyter",
]

[project.entry-points."jupyter.kernelspecs"]
sounio = "sounio_kernel:kernelspec"

[project.urls]
Homepage = "https://sounio.dev"
Documentation = "https://docs.sounio.dev"
Repository = "https://github.com/sounio-lang/sounio"
"Bug Tracker" = "https://github.com/sounio-lang/sounio/issues"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
