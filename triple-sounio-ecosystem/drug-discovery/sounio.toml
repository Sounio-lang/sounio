[package]
name = "drug-discovery-platform"
version = "0.1.0"
authors = ["Sounio Drug Discovery Team <drug-discovery@sounio.dev>"]
edition = "2024"
license = "Apache-2.0"
description = "Drug discovery pipeline with epistemic uncertainty quantification"
repository = "https://github.com/sounio-lang/drug-discovery"

# Epistemic metadata
[package.metadata]
confidence = 0.90
provenance = "Validated pharmaceutical models"
validation_status = "peer-reviewed"
domain = "pharmaceutical_research"
application = "drug_discovery"
citation = "DOI:10.1000/pharma-methods"

# Dependencies
[dependencies]
# Shared epistemic types from our ecosystem
epistemic-types = { path = "../shared", version = "^1.0" }

# Scientific computing libraries
scientific-stats = "^2.0"
linear-algebra = "^1.5"
optimization = "^0.8"

# Optional: GPU acceleration
[target.'cfg(gpu)'.dependencies]
gpu-compute = "^0.5"

[dev-dependencies]
sounio-test = "^0.1"
benchmark-harness = "^0.3"

# Build configuration
[build]
target = "native"  # Also supports: gpu, wasm
optimization = "performance"
epistemic_validation = true
provenance_tracking = true

# Features
[features]
default = ["virtual-screening", "pkpd-modeling", "clinical-simulation"]
virtual-screening = []           # Molecular docking/similarity
pkpd-modeling = []               # Pharmacokinetic/pharmacodynamic
clinical-simulation = []         # Clinical trial simulation
decision-analysis = []           # Risk-benefit analysis
dashboard = []                   # Web dashboard
data-import = []                 # Data import utilities
high-performance = []            # Optimized implementations

# Pipeline modules
[[module]]
name = "virtual-screening"
path = "src/pipeline/virtual_screening.sio"
required-features = ["virtual-screening"]

[[module]]
name = "pkpd-modeling"
path = "src/pipeline/pkpd_modeling.sio"
required-features = ["pkpd-modeling"]

[[module]]
name = "clinical-simulation"
path = "src/pipeline/clinical_simulation.sio"
required-features = ["clinical-simulation"]

[[module]]
name = "decision-analysis"
path = "src/pipeline/decision_analysis.sio"
required-features = ["decision-analysis"]

# Library
[lib]
name = "drug_discovery"
path = "src/lib.sio"

# Executable for CLI
[[bin]]
name = "drug-discovery"
path = "src/cli.sio"

# Examples
[[example]]
name = "complete-pipeline"
path = "examples/complete_pipeline.sio"
description = "Complete drug discovery pipeline example"
required-features = ["virtual-screening", "pkpd-modeling", "clinical-simulation"]

[[example]]
name = "virtual-screening-demo"
path = "examples/virtual_screening_demo.sio"
description = "Virtual screening demonstration"
required-features = ["virtual-screening"]

[[example]]
name = "clinical-trial-simulation"
path = "examples/clinical_trial_simulation.sio"
description = "Clinical trial simulation example"
required-features = ["clinical-simulation"]

# Tests
[[test]]
name = "pipeline-integration"
path = "tests/pipeline_integration.sio"

[[test]]
name = "uncertainty-propagation"
path = "tests/uncertainty_propagation.sio"

# Benchmark suites
[[bench]]
name = "performance"
path = "benchmarks/performance.sio"

# Documentation
[package.metadata.docs]
theme = "scientific"
include-examples = true
epistemic-highlighting = true
provenance-tracking = true

# Workspace (for future expansion)
[workspace]
# members = ["crates/*"]

# Python integration (for sounio-py)
[package.metadata.python]
module-name = "drug_discovery"
py-classes = ["Pipeline", "VirtualScreening", "PKPDModel", "ClinicalTrialSimulator"]
py-functions = ["run_pipeline", "analyze_results", "generate_report"]

# Jupyter integration (for sounio-jupyter)
[package.metadata.jupyter]
kernel-support = true
widgets = ["PipelineWidget", "UncertaintyVisualizer", "ProvenanceViewer"]
magics = ["%drug_pipeline", "%clinical_data", "%uncertainty_plot"]

# Web dashboard configuration
[package.metadata.dashboard]
port = 8080
host = "localhost"
theme = "scientific"
features = ["real-time-updates", "interactive-visualization", "export-functionality"]

# Reproducibility configuration
[package.metadata.reproducibility]
data-versioning = true
provenance-capture = true
execution-recording = true
report-generation = true
