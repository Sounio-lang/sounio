name: Seed Policy Strict Mode Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  seed-policy-selfhost-strict:
    name: Seed Policy selfhost strict no-rust (release-blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned souc binary
        run: |
          chmod +x scripts/omega/omega_resolve_souc_bin.sh
          SOUC_BIN="$(
            SOUNIO_SOUC_VERSION=0.100.3 \
            OMEGA_SOUC_REQUIRE_PINNED=1 \
            OMEGA_SOUC_ALLOW_LOCAL_FALLBACK=0 \
              scripts/omega/omega_resolve_souc_bin.sh --print-path
          )"
          echo "SOUC_BIN=$SOUC_BIN" >> "$GITHUB_ENV"
      - name: Run seed-policy strict no-rust validation
        run: |
          bash scripts/omega/omega_policy_status.sh \
            --policy bootstrap/policies/policy.v2.json \
            --souc "$SOUC_BIN"
