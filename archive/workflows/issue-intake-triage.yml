name: Issue Intake Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Ensure triage labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "release-readiness", color: "5319e7", description: "Release-readiness tracked issue" },
              { name: "release-blocker", color: "b60205", description: "Blocks release-critical gates" },
              { name: "scope:compiler", color: "1d76db", description: "Compiler scope impact" },
              { name: "scope:docs", color: "0e8a16", description: "Documentation scope impact" },
              { name: "scope:website", color: "0052cc", description: "Website scope impact" },
              { name: "scope:ci", color: "d876e3", description: "CI/workflow scope impact" },
              { name: "scope:other", color: "cfd3d7", description: "Other scope impact" },
              { name: "severity:critical", color: "b60205", description: "Critical severity" },
              { name: "severity:high", color: "d93f0b", description: "High severity" },
              { name: "severity:medium", color: "fbca04", description: "Medium severity" },
              { name: "severity:low", color: "0e8a16", description: "Low severity" },
              { name: "confidence:high", color: "0e8a16", description: "High diagnostic confidence" },
              { name: "confidence:medium", color: "fbca04", description: "Medium diagnostic confidence" },
              { name: "confidence:low", color: "d93f0b", description: "Low diagnostic confidence" },
              { name: "effort:s", color: "0e8a16", description: "Small effort" },
              { name: "effort:m", color: "fbca04", description: "Medium effort" },
              { name: "effort:l", color: "d93f0b", description: "Large effort" },
              { name: "effort:xl", color: "b60205", description: "Extra-large effort" },
              { name: "traceability:linked", color: "0e8a16", description: "Traceability IDs linked" },
              { name: "traceability:missing", color: "d93f0b", description: "Traceability IDs missing" },
              { name: "needs:evidence", color: "d93f0b", description: "Needs reproducible evidence" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  throw error;
                }
              }
            }

      - name: Apply intake labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const bodyRaw = issue.body || "";
            const titleRaw = issue.title || "";

            const sectionValue = (heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const re = new RegExp(`###\\s+${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`, "i");
              const match = bodyRaw.match(re);
              return match ? match[1].trim() : "";
            };

            const additions = new Set(["triage"]);

            const scopeSection = sectionValue("Affected Release Scope") || sectionValue("Affected Scope");
            if (/- \[x\].*compiler/i.test(scopeSection)) additions.add("scope:compiler");
            if (/- \[x\].*docs/i.test(scopeSection)) additions.add("scope:docs");
            if (/- \[x\].*website/i.test(scopeSection)) additions.add("scope:website");
            if (/- \[x\].*(ci|workflow)/i.test(scopeSection)) additions.add("scope:ci");
            if (/- \[x\].*(other|non-release|multi-scope)/i.test(scopeSection)) additions.add("scope:other");

            const gateCommand = sectionValue("Regressed Gate");
            if (/website/i.test(gateCommand)) additions.add("scope:website");
            if (/docs/i.test(gateCommand)) additions.add("scope:docs");
            if (/workflow|ci/i.test(gateCommand)) additions.add("scope:ci");
            if (/strict source pipeline|strict file pipeline|fast_gate|omega_sprint1_gate|parallel_selfhost_cutover|repo_hard_no_rust/i.test(gateCommand)) {
              additions.add("scope:compiler");
            }

            if (![...additions].some((v) => v.startsWith("scope:"))) {
              additions.add("scope:other");
            }

            const severity = sectionValue("Severity");
            if (/critical/i.test(severity)) additions.add("severity:critical");
            else if (/high/i.test(severity)) additions.add("severity:high");
            else if (/medium/i.test(severity)) additions.add("severity:medium");
            else if (/low/i.test(severity)) additions.add("severity:low");

            const confidence = sectionValue("Confidence");
            if (/high/i.test(confidence)) additions.add("confidence:high");
            else if (/medium/i.test(confidence)) additions.add("confidence:medium");
            else if (/low/i.test(confidence)) additions.add("confidence:low");

            const effort = sectionValue("Estimated Effort");
            if (/\bS\b|\bhours\b/i.test(effort)) additions.add("effort:s");
            else if (/\bM\b|1-2 days/i.test(effort)) additions.add("effort:m");
            else if (/\bL\b|3-5 days/i.test(effort)) additions.add("effort:l");
            else if (/\bXL\b|1\+ week/i.test(effort)) additions.add("effort:xl");

            const traceability = sectionValue("Traceability Matrix ID(s)");
            if (/[A-Z]{3,}-\d{3}/.test(traceability)) additions.add("traceability:linked");
            else additions.add("traceability:missing");

            const currentLabelNames = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name
            );

            const isBug = currentLabelNames.includes("bug") || /\[bug\]/i.test(titleRaw);
            const hasRepro = sectionValue("Reproduction Commands") || sectionValue("Failing Command(s)");
            const hasOutput = sectionValue("Actual Output") || sectionValue("Failing Output (key lines)");
            if (isBug && (!hasRepro || !hasOutput)) {
              additions.add("needs:evidence");
            }

            if ([...additions].some((label) => /^scope:(compiler|docs|website|ci)$/.test(label))) {
              additions.add("release-readiness");
            }
            if (additions.has("severity:critical")) {
              additions.add("release-blocker");
            }

            const managed = (name) =>
              name === "release-blocker" ||
              name === "release-readiness" ||
              name === "needs:evidence" ||
              name.startsWith("scope:") ||
              name.startsWith("severity:") ||
              name.startsWith("confidence:") ||
              name.startsWith("effort:") ||
              name.startsWith("traceability:");

            const preserved = currentLabelNames.filter((name) => !managed(name));
            const nextLabels = [...new Set([...preserved, ...additions])];

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: nextLabels
            });

      - name: Comment on missing intake evidence
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name
            );
            const marker = "<!-- issue-intake-triage -->";
            const needsTraceability = labels.includes("traceability:missing");
            const needsEvidence = labels.includes("needs:evidence");

            if (!needsTraceability && !needsEvidence) {
              return;
            }

            let body = `${marker}\nThanks for opening this issue. Before maintainers can execute, please update the issue body with:\n`;
            if (needsTraceability) {
              body += `- Traceability Matrix ID(s) (for example \`COMP-001\`, \`WEB-001\`, or \`N/A\` with explanation)\n`;
            }
            if (needsEvidence) {
              body += `- Exact reproduction command(s) and key failing output lines\n`;
            }
            body += `\nThis lets us prioritize by Severity + Confidence + Effort with concrete evidence.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });

            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            }

      - name: Mention scope owners for release blockers
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const marker = "<!-- release-blocker-routing -->";

            const issueFresh = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });
            const labels = issueFresh.data.labels.map((label) =>
              typeof label === "string" ? label : label.name
            );

            if (!labels.includes("release-blocker")) {
              return;
            }

            const ownerMentions = [];
            if (labels.includes("scope:compiler")) ownerMentions.push("@sounio-lang/compiler-maintainers");
            if (labels.includes("scope:docs")) ownerMentions.push("@sounio-lang/docs-maintainers");
            if (labels.includes("scope:website")) ownerMentions.push("@sounio-lang/website-maintainers");
            if (labels.includes("scope:ci")) ownerMentions.push("@sounio-lang/ci-maintainers");
            if (ownerMentions.length === 0 || labels.includes("scope:other")) {
              ownerMentions.push("@sounio-lang/maintainers");
            }

            const scopeLabels = labels.filter((name) => name.startsWith("scope:"));
            const severity = labels.find((name) => name.startsWith("severity:")) || "severity:unspecified";
            const confidence = labels.find((name) => name.startsWith("confidence:")) || "confidence:unspecified";
            const effort = labels.find((name) => name.startsWith("effort:")) || "effort:unspecified";

            const body =
              `${marker}\n` +
              `Release blocker routing ping: ${[...new Set(ownerMentions)].join(" ")}\n\n` +
              `- Scopes: ${scopeLabels.join(", ") || "scope:unspecified"}\n` +
              `- Priority tuple: ${severity} / ${confidence} / ${effort}\n` +
              `- Request: please acknowledge ownership and next action.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });

            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            }
