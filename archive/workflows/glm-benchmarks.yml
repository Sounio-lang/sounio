name: LLM Performance Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

env:
  GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    outputs:
      llm_enabled: ${{ steps.model-key.outputs.llm_enabled }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow script references
        run: bash scripts/check_workflow_script_refs.sh

      - name: Check model API keys
        id: model-key
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$GLM_API_KEY" ] || [ -n "$OPENAI_API_KEY" ] || [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "llm_enabled=true" >> "$GITHUB_OUTPUT"
            echo "At least one model API key detected. Running benchmark workflow."
          else
            echo "llm_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GLM_API_KEY, OPENAI_API_KEY, and DEEPSEEK_API_KEY are not configured; benchmark workflow will skip execution steps."
          fi

      - name: Skip benchmark run (missing model key)
        if: steps.model-key.outputs.llm_enabled != 'true'
        run: |
          echo "::notice::Skipping benchmark execution because no model API key is available."

      - name: Resolve pinned souc binary
        if: steps.model-key.outputs.llm_enabled == 'true'
        env:
          SOUNIO_CI_SOUC_VERSION: "0.100.3"
          OMEGA_SOUC_REQUIRE_PINNED: "1"
          OMEGA_SOUC_ALLOW_LOCAL_FALLBACK: "0"
        run: bash scripts/fix_ci_binary.sh

      - name: Install Python dependencies
        if: steps.model-key.outputs.llm_enabled == 'true'
        run: |
          python3 -m pip install --upgrade pip
          pip3 install matplotlib pandas numpy

      - name: Run LLM Benchmarks (self-hosted)
        if: steps.model-key.outputs.llm_enabled == 'true'
        run: |
          bash scripts/run_glm_benchmarks.sh comprehensive

      - name: Generate Dashboard
        if: steps.model-key.outputs.llm_enabled == 'true'
        run: |
          python3 scripts/glm_dashboard.py --charts

      - name: Validate benchmark outputs
        if: steps.model-key.outputs.llm_enabled == 'true'
        run: |
          test -d benchmark_results
          find benchmark_results -maxdepth 1 -type f -name '*.json' | grep -q .
          test -s benchmark_report.md
          test -s glm_performance_dashboard.html
          test -s performance_comparison.png
          test -s optimization_impact.png
          test -s epistemic_analysis.png
          test -s cache_performance.png

      - name: Enforce GLM benchmark thresholds
        if: steps.model-key.outputs.llm_enabled == 'true'
        env:
          GLM_BENCH_MIN_PASS: "4"
          GLM_BENCH_MAX_FAIL: "0"
          GLM_BENCH_MAX_MEAN_MS: "1500"
          GLM_BENCH_MAX_P95_MS: "2500"
          GLM_BENCH_MAX_SINGLE_MS: "5000"
          GLM_BENCH_MAX_REGRESSION_PCT: "25"
          GLM_BENCH_BASELINE_PATH: "artifacts/omega/glm_benchmark_baseline.v1.json"
          GLM_BENCH_REQUIRE_BASELINE: "0"
        run: |
          args=(
            --results-dir benchmark_results
            --out benchmark_results/glm_threshold_gate.v1.json
            --baseline "$GLM_BENCH_BASELINE_PATH"
            --min-pass "$GLM_BENCH_MIN_PASS"
            --max-fail "$GLM_BENCH_MAX_FAIL"
            --max-mean-ms "$GLM_BENCH_MAX_MEAN_MS"
            --max-p95-ms "$GLM_BENCH_MAX_P95_MS"
            --max-single-ms "$GLM_BENCH_MAX_SINGLE_MS"
            --max-regression-pct "$GLM_BENCH_MAX_REGRESSION_PCT"
          )
          if [ "$GLM_BENCH_REQUIRE_BASELINE" = "1" ]; then
            args+=(--require-baseline)
          fi
          python3 scripts/omega/omega_glm_benchmark_threshold_gate.py "${args[@]}"

      - name: Upload benchmark results
        if: steps.model-key.outputs.llm_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          if-no-files-found: error
          path: |
            benchmark_results/
            glm_performance_dashboard.html
            performance_comparison.png
            optimization_impact.png
            epistemic_analysis.png
            cache_performance.png

      - name: Upload benchmark report
        if: steps.model-key.outputs.llm_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          if-no-files-found: error
          path: benchmark_report.md
