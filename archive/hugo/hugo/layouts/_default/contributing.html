{{ define "main" }}
<div class="docs-container">
    {{ partial "breadcrumb.html" . }}

    <div class="contributing-layout">
        <aside class="contributing-sidebar">
            <h3>Quick Links</h3>
            <nav>
                <a href="#how-to-contribute">How to Contribute</a>
                <a href="#development-setup">Development Setup</a>
                <a href="#code-style">Code Style</a>
                <a href="#testing">Testing</a>
                <a href="#pull-request-process">Pull Requests</a>
                <a href="#issue-reporting">Issue Reporting</a>
            </nav>
        </aside>

        <article class="contributing-content">
            <header>
                <h1>{{ .Title }}</h1>
                {{ if .Params.description }}
                <p class="description">{{ .Params.description }}</p>
                {{ end }}
            </header>

            {{ .Content }}
        </article>
    </div>
</div>
{{ end }}
