{{ define "main" }}
<div class="manifesto-hero">
    <div class="container">
        <h1>{{ .Title }}</h1>
        <p class="hero-subtitle">{{ .Params.subtitle | default (i18n "manifesto_subtitle") }}</p>
    </div>
</div>

<div class="manifesto-container">
    {{ partial "breadcrumb.html" . }}

    <div class="manifesto-layout">
        <aside class="manifesto-toc">
            <h3>{{ i18n "toc_title" }}</h3>
            {{ .TableOfContents }}
        </aside>

        <article class="manifesto-content">
            {{ .Content }}
        </article>
    </div>
</div>
{{ end }}
