# Why Sounio Section
section_why_title = "¿Por qué Sounio?"
section_why_description = "La computación científica moderna exige más que aritmética correcta: exige integridad epistémica. La mayoría de los lenguajes tratan la incertidumbre como un pensamiento posterior. Sounio la hace fundamental."

# Feature Cards
feature_uncertainty_title = "La Incertidumbre es de Primera Clase"
feature_uncertainty_desc = "Cada valor puede llevar su incertidumbre. El tipo Knowledge<T> envuelve valores con incertidumbre, confianza y metadatos de procedencia."
feature_propagation_title = "Propagación Automática"
feature_propagation_desc = "Propagación de incertidumbre compatible con GUM a través de todas las operaciones matemáticas. Tú escribes la física, el compilador maneja las estadísticas."
feature_provenance_title = "Seguimiento de Procedencia"
feature_provenance_desc = "Datos sin origen son datos sin confianza. Cada medición se remonta a su fuente: esencial para la reproducibilidad y el cumplimiento regulatorio."
feature_confidence_title = "Puertas de Confianza"
feature_confidence_desc = "Cuando la confianza cae por debajo de un umbral, la ejecución puede pausar, advertir o tomar caminos alternativos. El sistema sabe lo que no sabe."
feature_domain_title = "Poder Específico de Dominio"
feature_domain_desc = "DSLs integrados para modelado PK/PD (MedLang), neuroimagen (fMRI), inferencia causal y computación acelerada por GPU."
feature_standards_title = "Compatible con Estándares"
feature_standards_desc = "Diseñado para GUM, ISO 17025, 21 CFR Part 11 y principios FAIR. El cumplimiento no es opcional: es arquitectónico."

