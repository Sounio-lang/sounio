<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #495057; stroke-width: 2; }
      .box-source { fill: #e7f5ff; stroke: #228be6; stroke-width: 2; }
      .box-analysis { fill: #fff4e6; stroke: #fd7e14; stroke-width: 2; }
      .box-ir { fill: #f3f0ff; stroke: #7950f2; stroke-width: 2; }
      .box-backend { fill: #ffe3e3; stroke: #fa5252; stroke-width: 2; }
      .box-output { fill: #d3f9d8; stroke: #2f9e44; stroke-width: 2; }
      .box-memory { fill: #fff9db; stroke: #fab005; stroke-width: 2; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-branch { stroke: #7950f2; stroke-width: 2; fill: none; marker-end: url(#arrowhead-branch); }
      .label { font-size: 14px; fill: #212529; font-weight: 500; }
      .label-small { font-size: 11px; fill: #495057; }
      .label-code { font-size: 10px; font-family: 'Courier New', monospace; fill: #212529; }
      .title { font-size: 20px; fill: #212529; font-weight: 600; }
      .subtitle { font-size: 12px; fill: #868e96; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
    <marker id="arrowhead-branch" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7950f2" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" class="title">GPU Compilation Flow</text>
  <text x="550" y="50" text-anchor="middle" class="subtitle">From kernel fn in Sounio source to PTX/Metal GPU code</text>

  <!-- Source Code -->
  <rect x="50" y="80" width="320" height="140" rx="5" class="box-source"/>
  <text x="210" y="105" text-anchor="middle" class="label" font-weight="600">Source Code</text>
  <text x="210" y="125" text-anchor="middle" class="label-small">(.sio file with kernel annotation)</text>

  <!-- Code Example -->
  <text x="70" y="150" class="label-code">kernel fn vector_add(</text>
  <text x="70" y="165" class="label-code">    a: &[f32],</text>
  <text x="70" y="180" class="label-code">    b: &[f32],</text>
  <text x="70" y="195" class="label-code">    c: &![f32]</text>
  <text x="70" y="210" class="label-code">) with GPU { ... }</text>

  <path d="M 370 150 L 430 150" class="arrow"/>

  <!-- Effect Analysis -->
  <rect x="430" y="80" width="220" height="140" rx="5" class="box-analysis"/>
  <text x="540" y="105" text-anchor="middle" class="label" font-weight="600">Effect Analysis</text>
  <text x="540" y="130" text-anchor="middle" class="label-small">Check for GPU effect</text>
  <text x="540" y="150" text-anchor="middle" class="label-small">• Must have 'with GPU'</text>
  <text x="540" y="167" text-anchor="middle" class="label-small">• Verify kernel signature</text>
  <text x="540" y="184" text-anchor="middle" class="label-small">• Check memory access</text>
  <text x="540" y="201" text-anchor="middle" class="label-small">• No IO, Alloc, or Async</text>

  <path d="M 650 150 L 710 150" class="arrow"/>

  <!-- HLIR Kernel Extraction -->
  <rect x="710" y="80" width="220" height="140" rx="5" class="box-ir"/>
  <text x="820" y="105" text-anchor="middle" class="label" font-weight="600">HLIR Extraction</text>
  <text x="820" y="130" text-anchor="middle" class="label-small">Extract kernel body</text>
  <text x="820" y="150" text-anchor="middle" class="label-small">• Convert to SSA form</text>
  <text x="820" y="167" text-anchor="middle" class="label-small">• Resolve thread indices</text>
  <text x="820" y="184" text-anchor="middle" class="label-small">• Inline GPU builtins</text>
  <text x="820" y="201" text-anchor="middle" class="label-small">• Optimize memory ops</text>

  <path d="M 820 220 L 820 280" class="arrow"/>

  <!-- Backend Selection -->
  <rect x="680" y="280" width="280" height="80" rx="5" class="box"/>
  <text x="820" y="310" text-anchor="middle" class="label" font-weight="600">Backend Selection</text>
  <text x="820" y="335" text-anchor="middle" class="label-small">Detect hardware capability</text>
  <text x="820" y="352" text-anchor="middle" class="label-small">NVIDIA GPU → PTX | Apple Silicon → Metal</text>

  <!-- Branch to PTX -->
  <path d="M 760 360 L 280 450" class="arrow-branch"/>
  <text x="500" y="410" text-anchor="middle" class="label-small" fill="#7950f2">NVIDIA</text>

  <!-- Branch to Metal -->
  <path d="M 880 360 L 820 450" class="arrow-branch"/>
  <text x="850" y="410" text-anchor="middle" class="label-small" fill="#7950f2">Apple</text>

  <!-- PTX Backend -->
  <rect x="50" y="450" width="460" height="130" rx="5" class="box-backend"/>
  <text x="280" y="480" text-anchor="middle" class="label" font-weight="600">PTX Backend (NVIDIA)</text>
  <text x="280" y="505" text-anchor="middle" class="label-small">Generate Parallel Thread Execution code</text>

  <text x="70" y="530" class="label-code">.visible .entry vector_add(</text>
  <text x="70" y="545" class="label-code">    .param .u64 a_ptr,</text>
  <text x="70" y="560" class="label-code">    .param .u64 b_ptr,</text>
  <text x="70" y="575" class="label-code">    .param .u64 c_ptr) { ... }</text>

  <!-- Metal Backend -->
  <rect x="590" y="450" width="460" height="130" rx="5" class="box-backend"/>
  <text x="820" y="480" text-anchor="middle" class="label" font-weight="600">Metal Backend (Apple)</text>
  <text x="820" y="505" text-anchor="middle" class="label-small">Generate Metal Shading Language</text>

  <text x="610" y="530" class="label-code">kernel void vector_add(</text>
  <text x="610" y="545" class="label-code">    device float* a [[buffer(0)]],</text>
  <text x="610" y="560" class="label-code">    device float* b [[buffer(1)]],</text>
  <text x="610" y="575" class="label-code">    device float* c [[buffer(2)]]) { }</text>

  <!-- Arrow down from PTX -->
  <path d="M 280 580 L 280 640" class="arrow"/>

  <!-- Arrow down from Metal -->
  <path d="M 820 580 L 820 640" class="arrow"/>

  <!-- PTX Output -->
  <rect x="180" y="640" width="200" height="60" rx="5" class="box-output"/>
  <text x="280" y="665" text-anchor="middle" class="label">PTX Module</text>
  <text x="280" y="685" text-anchor="middle" class="label-small">kernel.ptx (text format)</text>

  <!-- Metal Output -->
  <rect x="720" y="640" width="200" height="60" rx="5" class="box-output"/>
  <text x="820" y="665" text-anchor="middle" class="label">Metal Shader</text>
  <text x="820" y="685" text-anchor="middle" class="label-small">kernel.metal (compiled)</text>

  <!-- Memory Management Section -->
  <rect x="50" y="740" width="1000" height="130" rx="5" class="box-memory"/>
  <text x="550" y="770" text-anchor="middle" class="label" font-weight="600">Host-Device Memory Management</text>

  <!-- Memory Flow -->
  <rect x="80" y="790" width="140" height="50" rx="3" class="box" fill="#e7f5ff"/>
  <text x="150" y="810" text-anchor="middle" class="label-small">Host Memory</text>
  <text x="150" y="827" text-anchor="middle" class="label-small">(CPU RAM)</text>

  <path d="M 220 815 L 300 815" class="arrow"/>
  <text x="260" y="808" text-anchor="middle" class="label-small">cudaMemcpy</text>
  <text x="260" y="830" text-anchor="middle" class="label-small">or Metal buffer</text>

  <rect x="300" y="790" width="140" height="50" rx="3" class="box" fill="#ffe3e3"/>
  <text x="370" y="810" text-anchor="middle" class="label-small">Device Memory</text>
  <text x="370" y="827" text-anchor="middle" class="label-small">(GPU VRAM)</text>

  <path d="M 440 815 L 520 815" class="arrow"/>
  <text x="480" y="808" text-anchor="middle" class="label-small">Kernel</text>
  <text x="480" y="830" text-anchor="middle" class="label-small">Launch</text>

  <rect x="520" y="790" width="140" height="50" rx="3" class="box" fill="#d3f9d8"/>
  <text x="590" y="810" text-anchor="middle" class="label-small">Kernel Exec</text>
  <text x="590" y="827" text-anchor="middle" class="label-small">(GPU threads)</text>

  <path d="M 660 815 L 740 815" class="arrow"/>
  <text x="700" y="808" text-anchor="middle" class="label-small">cudaMemcpy</text>
  <text x="700" y="830" text-anchor="middle" class="label-small">D2H</text>

  <rect x="740" y="790" width="140" height="50" rx="3" class="box" fill="#e7f5ff"/>
  <text x="810" y="810" text-anchor="middle" class="label-small">Host Memory</text>
  <text x="810" y="827" text-anchor="middle" class="label-small">(Results)</text>

  <!-- Kernel Launch Config -->
  <rect x="900" y="785" width="130" height="60" rx="3" class="box" fill="#fff9db"/>
  <text x="965" y="805" text-anchor="middle" class="label-small" font-weight="600">Launch Config</text>
  <text x="965" y="822" text-anchor="middle" class="label-code">grid: (N/256, 1, 1)</text>
  <text x="965" y="837" text-anchor="middle" class="label-code">block: (256, 1, 1)</text>

  <!-- Footer -->
  <text x="550" y="890" text-anchor="middle" class="label-small" fill="#495057" font-style="italic">
    Zero-cost GPU dispatch: Kernel signature checked at compile time, memory safety guaranteed by effect system
  </text>
</svg>
