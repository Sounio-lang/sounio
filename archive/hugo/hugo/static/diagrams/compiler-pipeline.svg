<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #495057; stroke-width: 2; }
      .box-frontend { fill: #e7f5ff; stroke: #228be6; stroke-width: 2; }
      .box-middle { fill: #fff4e6; stroke: #fd7e14; stroke-width: 2; }
      .box-backend { fill: #e9ecef; stroke: #495057; stroke-width: 2; }
      .box-optimization { fill: #f3f0ff; stroke: #7950f2; stroke-width: 2; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { font-size: 14px; fill: #212529; font-weight: 500; }
      .label-small { font-size: 11px; fill: #495057; }
      .title { font-size: 20px; fill: #212529; font-weight: 600; }
      .subtitle { font-size: 12px; fill: #868e96; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">Sounio Compiler Pipeline</text>
  <text x="600" y="50" text-anchor="middle" class="subtitle">Source → Lexer → Parser → Type Checker → IR Passes → Code Generation</text>

  <!-- Frontend: Source Input -->
  <rect x="50" y="80" width="160" height="60" rx="5" class="box-frontend"/>
  <text x="130" y="105" text-anchor="middle" class="label">Source Code</text>
  <text x="130" y="125" text-anchor="middle" class="label-small">(.sio files)</text>

  <path d="M 210 110 L 250 110" class="arrow"/>

  <!-- Frontend: Lexer -->
  <rect x="250" y="80" width="120" height="60" rx="5" class="box-frontend"/>
  <text x="310" y="105" text-anchor="middle" class="label">Lexer</text>
  <text x="310" y="125" text-anchor="middle" class="label-small">(Logos)</text>

  <path d="M 370 110 L 410 110" class="arrow"/>

  <!-- Frontend: Parser -->
  <rect x="410" y="80" width="120" height="60" rx="5" class="box-frontend"/>
  <text x="470" y="105" text-anchor="middle" class="label">Parser</text>
  <text x="470" y="125" text-anchor="middle" class="label-small">(Recursive descent)</text>

  <path d="M 530 110 L 570 110" class="arrow"/>

  <!-- Frontend: AST -->
  <rect x="570" y="80" width="120" height="60" rx="5" class="box-frontend"/>
  <text x="630" y="105" text-anchor="middle" class="label">AST</text>
  <text x="630" y="125" text-anchor="middle" class="label-small">(Abstract Syntax Tree)</text>

  <path d="M 690 110 L 730 110" class="arrow"/>

  <!-- Frontend: Type Checker -->
  <rect x="730" y="50" width="180" height="120" rx="5" class="box-frontend"/>
  <text x="820" y="80" text-anchor="middle" class="label" font-weight="600">Type Checker</text>
  <text x="820" y="100" text-anchor="middle" class="label-small">Bidirectional Inference</text>
  <text x="820" y="117" text-anchor="middle" class="label-small">• Linear Types</text>
  <text x="820" y="133" text-anchor="middle" class="label-small">• Refinement Types</text>
  <text x="820" y="149" text-anchor="middle" class="label-small">• Units of Measure</text>

  <path d="M 910 110 L 950 110" class="arrow"/>

  <!-- Effect System (side box) -->
  <rect x="950" y="50" width="200" height="120" rx="5" class="box-frontend"/>
  <text x="1050" y="80" text-anchor="middle" class="label" font-weight="600">Effect System</text>
  <text x="1050" y="100" text-anchor="middle" class="label-small">Algebraic Effects</text>
  <text x="1050" y="117" text-anchor="middle" class="label-small">IO • Mut • Alloc • Panic</text>
  <text x="1050" y="133" text-anchor="middle" class="label-small">GPU • Async • Prob • Div</text>

  <!-- Arrow down from Type Checker -->
  <path d="M 820 170 L 820 210" class="arrow"/>

  <!-- HIR -->
  <rect x="720" y="210" width="200" height="60" rx="5" class="box-middle"/>
  <text x="820" y="235" text-anchor="middle" class="label">HIR</text>
  <text x="820" y="255" text-anchor="middle" class="label-small">(High-Level Intermediate Representation)</text>

  <path d="M 820 270 L 820 310" class="arrow"/>

  <!-- SIR -->
  <rect x="720" y="310" width="200" height="60" rx="5" class="box-middle"/>
  <text x="820" y="335" text-anchor="middle" class="label">SIR</text>
  <text x="820" y="355" text-anchor="middle" class="label-small">(Scientific Intermediate Representation)</text>

  <!-- Optimization Passes (side box) -->
  <rect x="950" y="290" width="200" height="100" rx="5" class="box-optimization"/>
  <text x="1050" y="315" text-anchor="middle" class="label" font-weight="600">Optimization Passes</text>
  <text x="1050" y="335" text-anchor="middle" class="label-small">• ODE Fusion</text>
  <text x="1050" y="352" text-anchor="middle" class="label-small">• Tensor Operations</text>
  <text x="1050" y="369" text-anchor="middle" class="label-small">• Autodiff</text>

  <!-- Arrow from SIR to Optimization -->
  <path d="M 920 340 L 950 340" class="arrow"/>

  <!-- Arrow from Optimization back to SIR -->
  <path d="M 950 350 L 920 350" class="arrow" stroke-dasharray="4,4"/>

  <path d="M 820 370 L 820 410" class="arrow"/>

  <!-- HLIR -->
  <rect x="720" y="410" width="200" height="60" rx="5" class="box-middle"/>
  <text x="820" y="435" text-anchor="middle" class="label">HLIR</text>
  <text x="820" y="455" text-anchor="middle" class="label-small">(Low-Level IR in SSA form)</text>

  <path d="M 820 470 L 820 510" class="arrow"/>

  <!-- Code Generation Hub -->
  <rect x="720" y="510" width="200" height="60" rx="5" class="box"/>
  <text x="820" y="535" text-anchor="middle" class="label" font-weight="600">Code Generation</text>
  <text x="820" y="555" text-anchor="middle" class="label-small">Backend Selection</text>

  <!-- Backend Options -->
  <!-- LLVM -->
  <path d="M 750 570 L 150 680" class="arrow"/>
  <rect x="50" y="680" width="200" height="60" rx="5" class="box-backend"/>
  <text x="150" y="705" text-anchor="middle" class="label">LLVM Backend</text>
  <text x="150" y="725" text-anchor="middle" class="label-small">Optimized Machine Code</text>

  <!-- Cranelift JIT -->
  <path d="M 780 570 L 350 680" class="arrow"/>
  <rect x="270" y="680" width="160" height="60" rx="5" class="box-backend"/>
  <text x="350" y="705" text-anchor="middle" class="label">Cranelift JIT</text>
  <text x="350" y="725" text-anchor="middle" class="label-small">Fast Compilation</text>

  <!-- Native Backend -->
  <path d="M 820 570 L 820 680" class="arrow"/>
  <rect x="720" y="680" width="200" height="60" rx="5" class="box-backend"/>
  <text x="820" y="705" text-anchor="middle" class="label">Native Backend</text>
  <text x="820" y="725" text-anchor="middle" class="label-small">ELF/Mach-O Output</text>

  <!-- PTX Backend -->
  <path d="M 860 570 L 980 680" class="arrow"/>
  <rect x="940" y="680" width="120" height="60" rx="5" class="box-backend"/>
  <text x="1000" y="705" text-anchor="middle" class="label">PTX</text>
  <text x="1000" y="725" text-anchor="middle" class="label-small">NVIDIA GPU</text>

  <!-- Metal Backend -->
  <path d="M 890 570 L 1100 680" class="arrow"/>
  <rect x="1080" y="680" width="120" height="60" rx="5" class="box-backend"/>
  <text x="1140" y="705" text-anchor="middle" class="label">Metal</text>
  <text x="1140" y="725" text-anchor="middle" class="label-small">Apple GPU</text>

  <!-- Output Arrows -->
  <path d="M 150 740 L 150 820" class="arrow"/>
  <rect x="70" y="820" width="160" height="50" rx="5" class="box" fill="#d3f9d8"/>
  <text x="150" y="840" text-anchor="middle" class="label">Machine Code</text>
  <text x="150" y="857" text-anchor="middle" class="label-small">(x86-64/ARM64)</text>

  <path d="M 350 740 L 350 820" class="arrow"/>
  <rect x="280" y="820" width="140" height="50" rx="5" class="box" fill="#d3f9d8"/>
  <text x="350" y="840" text-anchor="middle" class="label">JIT Code</text>
  <text x="350" y="857" text-anchor="middle" class="label-small">(Memory)</text>

  <path d="M 820 740 L 820 820" class="arrow"/>
  <rect x="720" y="820" width="200" height="50" rx="5" class="box" fill="#d3f9d8"/>
  <text x="820" y="840" text-anchor="middle" class="label">Binary Executable</text>
  <text x="820" y="857" text-anchor="middle" class="label-small">(ELF/Mach-O)</text>

  <path d="M 1000 740 L 1000 820" class="arrow"/>
  <rect x="940" y="820" width="120" height="50" rx="5" class="box" fill="#d3f9d8"/>
  <text x="1000" y="840" text-anchor="middle" class="label">PTX Module</text>
  <text x="1000" y="857" text-anchor="middle" class="label-small">(.ptx)</text>

  <path d="M 1140 740 L 1140 820" class="arrow"/>
  <rect x="1080" y="820" width="120" height="50" rx="5" class="box" fill="#d3f9d8"/>
  <text x="1140" y="840" text-anchor="middle" class="label">Metal Shader</text>
  <text x="1140" y="857" text-anchor="middle" class="label-small">(.metal)</text>

  <!-- Legend -->
  <text x="50" y="890" class="label-small" font-weight="600">Pipeline Stages:</text>
  <rect x="150" y="878" width="15" height="15" class="box-frontend"/>
  <text x="170" y="890" class="label-small">Frontend</text>
  <rect x="250" y="878" width="15" height="15" class="box-middle"/>
  <text x="270" y="890" class="label-small">IR Passes</text>
  <rect x="340" y="878" width="15" height="15" class="box-backend"/>
  <text x="360" y="890" class="label-small">Backends</text>
  <rect x="440" y="878" width="15" height="15" class="box-optimization"/>
  <text x="460" y="890" class="label-small">Optimizations</text>
</svg>
