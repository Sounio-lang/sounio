<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #495057; stroke-width: 2; }
      .box-measurement { fill: #e7f5ff; stroke: #228be6; stroke-width: 2; }
      .box-knowledge { fill: #f3f0ff; stroke: #7950f2; stroke-width: 2; }
      .box-operation { fill: #fff4e6; stroke: #fd7e14; stroke-width: 2; }
      .box-result { fill: #d3f9d8; stroke: #2f9e44; stroke-width: 2; }
      .box-provenance { fill: #fff9db; stroke: #fab005; stroke-width: 2; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-prov { stroke: #fab005; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-prov); stroke-dasharray: 4,3; }
      .label { font-size: 14px; fill: #212529; font-weight: 500; }
      .label-small { font-size: 11px; fill: #495057; }
      .label-code { font-size: 10px; font-family: 'Courier New', monospace; fill: #212529; }
      .label-math { font-size: 12px; font-family: 'Times New Roman', serif; fill: #212529; font-style: italic; }
      .title { font-size: 20px; fill: #212529; font-weight: 600; }
      .subtitle { font-size: 12px; fill: #868e96; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
    <marker id="arrowhead-prov" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fab005" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">Uncertainty Propagation with Knowledge&lt;T&gt;</text>
  <text x="600" y="50" text-anchor="middle" class="subtitle">GUM-compliant uncertainty tracking with provenance graphs</text>

  <!-- Measurement A -->
  <rect x="100" y="90" width="220" height="120" rx="5" class="box-measurement"/>
  <text x="210" y="115" text-anchor="middle" class="label" font-weight="600">Measurement A</text>
  <text x="210" y="140" text-anchor="middle" class="label-code">let mass: Knowledge&lt;mg&gt; =</text>
  <text x="210" y="157" text-anchor="middle" class="label-code">  measure(500.0,</text>
  <text x="210" y="174" text-anchor="middle" class="label-code">    uncertainty: 2.5,</text>
  <text x="210" y="191" text-anchor="middle" class="label-code">    confidence: 0.95)</text>

  <!-- Measurement B -->
  <rect x="100" y="240" width="220" height="120" rx="5" class="box-measurement"/>
  <text x="210" y="265" text-anchor="middle" class="label" font-weight="600">Measurement B</text>
  <text x="210" y="290" text-anchor="middle" class="label-code">let volume: Knowledge&lt;mL&gt; =</text>
  <text x="210" y="307" text-anchor="middle" class="label-code">  measure(100.0,</text>
  <text x="210" y="324" text-anchor="middle" class="label-code">    uncertainty: 1.0,</text>
  <text x="210" y="341" text-anchor="middle" class="label-code">    confidence: 0.95)</text>

  <!-- Knowledge Type Structure -->
  <rect x="400" y="90" width="280" height="270" rx="5" class="box-knowledge"/>
  <text x="540" y="120" text-anchor="middle" class="label" font-weight="600">Knowledge&lt;T&gt; Type Structure</text>

  <text x="420" y="150" class="label-small" font-weight="600">Components:</text>
  <text x="420" y="170" class="label-code">• value: T</text>
  <text x="420" y="187" class="label-code">• std_uncertainty: f64</text>
  <text x="420" y="204" class="label-code">• confidence: f64</text>
  <text x="420" y="221" class="label-code">• provenance: ProvenanceGraph</text>
  <text x="420" y="238" class="label-code">• uncertainty_type: UncertaintyType</text>

  <text x="420" y="263" class="label-small" font-weight="600">Uncertainty Types:</text>
  <text x="420" y="283" class="label-small">• Epistemic: Lack of knowledge</text>
  <text x="420" y="300" class="label-small">• Aleatoric: Inherent randomness</text>
  <text x="420" y="317" class="label-small">• Combined: Both sources</text>

  <text x="540" y="345" text-anchor="middle" class="label-small" fill="#7950f2" font-style="italic">GUM-compliant: ISO/IEC Guide 98-3:2008</text>

  <!-- Operation -->
  <rect x="760" y="150" width="200" height="100" rx="5" class="box-operation"/>
  <text x="860" y="180" text-anchor="middle" class="label" font-weight="600">Operation</text>
  <text x="860" y="205" text-anchor="middle" class="label-code">let conc =</text>
  <text x="860" y="222" text-anchor="middle" class="label-code">  mass / volume</text>
  <text x="860" y="240" text-anchor="middle" class="label-small">Type: Knowledge&lt;mg/mL&gt;</text>

  <!-- Arrows to Operation -->
  <path d="M 320 135 L 760 180" class="arrow"/>
  <path d="M 320 285 L 760 220" class="arrow"/>

  <!-- Error Propagation Formula -->
  <rect x="720" y="290" width="280" height="140" rx="5" class="box"/>
  <text x="860" y="320" text-anchor="middle" class="label" font-weight="600">Error Propagation</text>
  <text x="860" y="345" text-anchor="middle" class="label-small">Taylor Expansion (First Order):</text>

  <!-- Mathematical formula -->
  <text x="860" y="370" text-anchor="middle" class="label-math">σ²(f) = Σᵢ (∂f/∂xᵢ)² · σ²(xᵢ)</text>

  <text x="860" y="395" text-anchor="middle" class="label-small">For division f = a/b:</text>
  <text x="860" y="415" text-anchor="middle" class="label-math">σ²(f) = (1/b)² · σ²(a) + (a/b²)² · σ²(b)</text>

  <!-- Arrow down from Operation -->
  <path d="M 860 250 L 860 470" class="arrow"/>

  <!-- Result -->
  <rect x="740" y="470" width="240" height="120" rx="5" class="box-result"/>
  <text x="860" y="500" text-anchor="middle" class="label" font-weight="600">Result</text>
  <text x="860" y="525" text-anchor="middle" class="label-code">conc = Knowledge {</text>
  <text x="860" y="542" text-anchor="middle" class="label-code">  value: 5.0 mg/mL,</text>
  <text x="860" y="559" text-anchor="middle" class="label-code">  std_uncertainty: 0.056,</text>
  <text x="860" y="576" text-anchor="middle" class="label-code">  confidence: 0.95</text>

  <!-- Provenance Graph -->
  <rect x="80" y="470" width="600" height="280" rx="5" class="box-provenance"/>
  <text x="380" y="500" text-anchor="middle" class="label" font-weight="600">Provenance Graph (Operation Lineage)</text>

  <!-- Graph visualization -->
  <!-- Node: mass measurement -->
  <circle cx="150" cy="560" r="35" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/>
  <text x="150" y="560" text-anchor="middle" class="label-small" font-weight="600">mass</text>
  <text x="150" y="575" text-anchor="middle" class="label-small">500±2.5 mg</text>

  <!-- Node: volume measurement -->
  <circle cx="300" cy="560" r="35" fill="#e7f5ff" stroke="#228be6" stroke-width="2"/>
  <text x="300" y="560" text-anchor="middle" class="label-small" font-weight="600">volume</text>
  <text x="300" y="575" text-anchor="middle" class="label-small">100±1.0 mL</text>

  <!-- Node: division operation -->
  <rect x="195" y="650" width="80" height="50" rx="5" fill="#fff4e6" stroke="#fd7e14" stroke-width="2"/>
  <text x="235" y="673" text-anchor="middle" class="label-small" font-weight="600">divide</text>
  <text x="235" y="688" text-anchor="middle" class="label-code">/</text>

  <!-- Node: result -->
  <circle cx="380" cy="675" r="40" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="380" y="670" text-anchor="middle" class="label-small" font-weight="600">conc</text>
  <text x="380" y="685" text-anchor="middle" class="label-small">5.0±0.056</text>
  <text x="380" y="698" text-anchor="middle" class="label-small">mg/mL</text>

  <!-- Arrows in provenance graph -->
  <path d="M 150 595 L 215 650" class="arrow-prov"/>
  <path d="M 300 595 L 255 650" class="arrow-prov"/>
  <path d="M 275 675 L 340 675" class="arrow-prov"/>

  <!-- Provenance metadata -->
  <text x="100" y="615" class="label-small">Source: scale_001</text>
  <text x="100" y="630" class="label-small">Time: 2024-01-28T10:30</text>

  <text x="320" y="615" class="label-small">Source: pipette_042</text>
  <text x="320" y="630" class="label-small">Time: 2024-01-28T10:31</text>

  <text x="430" y="660" class="label-small">Op: division</text>
  <text x="430" y="675" class="label-small">Time: 2024-01-28T10:32</text>
  <text x="430" y="690" class="label-small">Confidence: 0.95</text>

  <!-- Footer: Key benefits -->
  <rect x="80" y="780" width="1040" height="100" rx="5" class="box" fill="#f1f3f5"/>
  <text x="600" y="810" text-anchor="middle" class="label" font-weight="600">Key Benefits of Knowledge&lt;T&gt;</text>

  <text x="100" y="835" class="label-small">✓ <tspan font-weight="600">Automatic propagation:</tspan> No manual uncertainty calculations</text>
  <text x="100" y="855" class="label-small">✓ <tspan font-weight="600">Type safety:</tspan> Units checked at compile time (mg/mL, not mg+mL)</text>

  <text x="600" y="835" class="label-small">✓ <tspan font-weight="600">Provenance tracking:</tspan> Full audit trail for regulatory compliance</text>
  <text x="600" y="855" class="label-small">✓ <tspan font-weight="600">GUM compliant:</tspan> Meets international metrology standards</text>

  <!-- Footer note -->
  <text x="600" y="895" text-anchor="middle" class="label-small" fill="#495057" font-style="italic">
    Used in pharmaceutical dosing, climate modeling, financial risk, and experimental physics
  </text>
</svg>
