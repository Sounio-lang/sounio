<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <style>
      .box-real { fill: #fff4e6; stroke: #fd7e14; stroke-width: 3; }
      .box-complex { fill: #e7f5ff; stroke: #228be6; stroke-width: 3; }
      .box-quat { fill: #f3f0ff; stroke: #7950f2; stroke-width: 3; }
      .box-oct { fill: #ffe3e3; stroke: #fa5252; stroke-width: 3; }
      .arrow { stroke: #495057; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-cayley { stroke: #7950f2; stroke-width: 2; fill: none; marker-end: url(#arrowhead-cayley); stroke-dasharray: 6,3; }
      .label { font-size: 16px; fill: #212529; font-weight: 600; }
      .label-math { font-size: 20px; fill: #212529; font-weight: 700; font-family: 'Times New Roman', serif; }
      .label-small { font-size: 12px; fill: #495057; }
      .label-property { font-size: 13px; fill: #c92a2a; font-weight: 500; }
      .label-kept { font-size: 13px; fill: #2f9e44; font-weight: 500; }
      .title { font-size: 22px; fill: #212529; font-weight: 600; }
      .subtitle { font-size: 13px; fill: #868e96; font-style: italic; }
      .moufang-box { fill: #fff9db; stroke: #fab005; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
    <marker id="arrowhead-cayley" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7950f2" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">Hypercomplex Algebra Hierarchy</text>
  <text x="600" y="55" text-anchor="middle" class="subtitle">Cayley-Dickson Construction: Each step doubles dimension, loses algebraic structure</text>

  <!-- Real Numbers -->
  <rect x="100" y="100" width="220" height="140" rx="8" class="box-real"/>
  <text x="210" y="130" text-anchor="middle" class="label-math">ℝ</text>
  <text x="210" y="155" text-anchor="middle" class="label">Real Numbers</text>
  <text x="210" y="180" text-anchor="middle" class="label-small">Dimension: 1</text>
  <text x="210" y="200" text-anchor="middle" class="label-kept">✓ Commutative</text>
  <text x="210" y="217" text-anchor="middle" class="label-kept">✓ Associative</text>
  <text x="210" y="234" text-anchor="middle" class="label-kept">✓ Division</text>

  <!-- Arrow to Complex -->
  <path d="M 320 170 L 420 170" class="arrow-cayley"/>
  <text x="370" y="160" text-anchor="middle" class="label-small" fill="#7950f2">Cayley-Dickson</text>

  <!-- Complex Numbers -->
  <rect x="420" y="100" width="220" height="140" rx="8" class="box-complex"/>
  <text x="530" y="130" text-anchor="middle" class="label-math">ℂ</text>
  <text x="530" y="155" text-anchor="middle" class="label">Complex Numbers</text>
  <text x="530" y="180" text-anchor="middle" class="label-small">Dimension: 2 (a + bi)</text>
  <text x="530" y="200" text-anchor="middle" class="label-kept">✓ Commutative</text>
  <text x="530" y="217" text-anchor="middle" class="label-kept">✓ Associative</text>
  <text x="530" y="234" text-anchor="middle" class="label-kept">✓ Division</text>

  <!-- Arrow to Quaternions -->
  <path d="M 640 170 L 740 170" class="arrow-cayley"/>
  <text x="690" y="160" text-anchor="middle" class="label-small" fill="#7950f2">Cayley-Dickson</text>

  <!-- Quaternions -->
  <rect x="740" y="100" width="220" height="140" rx="8" class="box-quat"/>
  <text x="850" y="130" text-anchor="middle" class="label-math">ℍ</text>
  <text x="850" y="155" text-anchor="middle" class="label">Quaternions</text>
  <text x="850" y="180" text-anchor="middle" class="label-small">Dimension: 4 (a+bi+cj+dk)</text>
  <text x="850" y="200" text-anchor="middle" class="label-property">✗ Commutative</text>
  <text x="850" y="217" text-anchor="middle" class="label-kept">✓ Associative</text>
  <text x="850" y="234" text-anchor="middle" class="label-kept">✓ Division</text>

  <!-- Arrow to Octonions -->
  <path d="M 850 240 L 850 320" class="arrow-cayley"/>
  <text x="890" y="285" text-anchor="middle" class="label-small" fill="#7950f2">Cayley-Dickson</text>

  <!-- Octonions -->
  <rect x="660" y="320" width="380" height="180" rx="8" class="box-oct"/>
  <text x="850" y="355" text-anchor="middle" class="label-math">𝕆</text>
  <text x="850" y="380" text-anchor="middle" class="label">Octonions</text>
  <text x="850" y="405" text-anchor="middle" class="label-small">Dimension: 8 (e₀, e₁, e₂, e₃, e₄, e₅, e₆, e₇)</text>
  <text x="850" y="430" text-anchor="middle" class="label-property">✗ Commutative</text>
  <text x="850" y="447" text-anchor="middle" class="label-property">✗ Associative</text>
  <text x="850" y="464" text-anchor="middle" class="label-kept">✓ Division (non-associative)</text>
  <text x="850" y="485" text-anchor="middle" class="label-small" fill="#495057" font-style="italic">Alternative: (xx)y = x(xy), x(yy) = (xy)y</text>

  <!-- Moufang Identities Box -->
  <rect x="80" y="320" width="540" height="180" rx="8" class="moufang-box"/>
  <text x="350" y="350" text-anchor="middle" class="label" font-size="15">Moufang Identities (Partial Associativity)</text>
  <text x="350" y="375" text-anchor="middle" class="label-small">7 identities compensate for lost associativity:</text>

  <!-- Moufang Identity Examples -->
  <text x="100" y="400" class="label-small" font-family="'Courier New', monospace">1. z(x(zy)) = ((zx)z)y</text>
  <text x="100" y="420" class="label-small" font-family="'Courier New', monospace">2. x(z(yz)) = ((xz)y)z</text>
  <text x="100" y="440" class="label-small" font-family="'Courier New', monospace">3. (zx)(yz) = (z(xy))z</text>
  <text x="100" y="460" class="label-small" font-family="'Courier New', monospace">4. (zx)(yz) = z((xy)z)</text>

  <text x="360" y="400" class="label-small" font-family="'Courier New', monospace">5. z(x(zy)) = (z(xz))y</text>
  <text x="360" y="420" class="label-small" font-family="'Courier New', monospace">6. x(z(yz)) = (xz)(yz)</text>
  <text x="360" y="440" class="label-small" font-family="'Courier New', monospace">7. (xy)(zx) = x((yz)x)</text>

  <text x="350" y="480" text-anchor="middle" class="label-small" font-style="italic" fill="#e67700">These 7 identities are validated in 38 GPU tests</text>

  <!-- Bottom: Properties Table -->
  <rect x="100" y="540" width="940" height="220" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <text x="570" y="570" text-anchor="middle" class="label" font-size="17">Algebraic Properties by Dimension</text>

  <!-- Table Headers -->
  <text x="120" y="600" class="label-small" font-weight="600">Property</text>
  <text x="320" y="600" text-anchor="middle" class="label-small" font-weight="600">ℝ (dim 1)</text>
  <text x="480" y="600" text-anchor="middle" class="label-small" font-weight="600">ℂ (dim 2)</text>
  <text x="640" y="600" text-anchor="middle" class="label-small" font-weight="600">ℍ (dim 4)</text>
  <text x="800" y="600" text-anchor="middle" class="label-small" font-weight="600">𝕆 (dim 8)</text>
  <text x="960" y="600" text-anchor="middle" class="label-small" font-weight="600">𝕊 (dim 16)</text>

  <!-- Table Rows -->
  <line x1="110" y1="610" x2="1030" y2="610" stroke="#dee2e6" stroke-width="1"/>

  <!-- Row 1: Commutative -->
  <text x="120" y="635" class="label-small">Commutative (xy = yx)</text>
  <text x="320" y="635" text-anchor="middle" class="label-kept">✓</text>
  <text x="480" y="635" text-anchor="middle" class="label-kept">✓</text>
  <text x="640" y="635" text-anchor="middle" class="label-property">✗</text>
  <text x="800" y="635" text-anchor="middle" class="label-property">✗</text>
  <text x="960" y="635" text-anchor="middle" class="label-property">✗</text>

  <!-- Row 2: Associative -->
  <text x="120" y="660" class="label-small">Associative ((xy)z = x(yz))</text>
  <text x="320" y="660" text-anchor="middle" class="label-kept">✓</text>
  <text x="480" y="660" text-anchor="middle" class="label-kept">✓</text>
  <text x="640" y="660" text-anchor="middle" class="label-kept">✓</text>
  <text x="800" y="660" text-anchor="middle" class="label-property">✗</text>
  <text x="960" y="660" text-anchor="middle" class="label-property">✗</text>

  <!-- Row 3: Alternative -->
  <text x="120" y="685" class="label-small">Alternative ((xx)y = x(xy))</text>
  <text x="320" y="685" text-anchor="middle" class="label-kept">✓</text>
  <text x="480" y="685" text-anchor="middle" class="label-kept">✓</text>
  <text x="640" y="685" text-anchor="middle" class="label-kept">✓</text>
  <text x="800" y="685" text-anchor="middle" class="label-kept">✓</text>
  <text x="960" y="685" text-anchor="middle" class="label-property">✗</text>

  <!-- Row 4: Division Algebra -->
  <text x="120" y="710" class="label-small">Division Algebra (∀x≠0, ∃y: xy=1)</text>
  <text x="320" y="710" text-anchor="middle" class="label-kept">✓</text>
  <text x="480" y="710" text-anchor="middle" class="label-kept">✓</text>
  <text x="640" y="710" text-anchor="middle" class="label-kept">✓</text>
  <text x="800" y="710" text-anchor="middle" class="label-kept">✓</text>
  <text x="960" y="710" text-anchor="middle" class="label-property">✗</text>

  <!-- Row 5: Moufang -->
  <text x="120" y="735" class="label-small">Moufang (7 identities)</text>
  <text x="320" y="735" text-anchor="middle" class="label-kept">✓</text>
  <text x="480" y="735" text-anchor="middle" class="label-kept">✓</text>
  <text x="640" y="735" text-anchor="middle" class="label-kept">✓</text>
  <text x="800" y="735" text-anchor="middle" class="label-kept">✓</text>
  <text x="960" y="735" text-anchor="middle" class="label-property">✗</text>

  <!-- Footer Note -->
  <text x="570" y="775" text-anchor="middle" class="label-small" fill="#495057" font-style="italic">
    Hurwitz's Theorem (1898): Only 4 normed division algebras exist — ℝ, ℂ, ℍ, 𝕆
  </text>
  <text x="570" y="793" text-anchor="middle" class="label-small" fill="#495057">
    Sounio provides native types for all 4 with compile-time dimensional analysis
  </text>
</svg>
