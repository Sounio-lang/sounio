<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800">
<rect width="2400" height="800" fill="#0B1E3A"/>

    <defs>
      <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    

    <text x="1200.0" y="336.0" text-anchor="middle"
          font-family="GFS Neohellenic, serif"
          font-size="208" font-weight="700"
          fill="#D6B35A" filter="url(#softGlow)">
      Sounio Language
    </text>
    
<line x1="648.0" y1="400.0" x2="1752.0" y2="400.0" stroke="#D6B35A" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

    <text x="1200.0" y="480.0" text-anchor="middle"
          font-family="DejaVu Sans Mono, monospace"
          font-size="96" font-weight="700"
          fill="#FFFFFF">
      souniolang.org
    </text>
    

    <text x="1200.0" y="584.0" text-anchor="middle"
          font-family="EB Garamond, serif"
          font-size="72" font-style="italic"
          fill="#FFFFFF" opacity="0.95">
      Epistemic computing at the horizon of certainty
    </text>
    
</svg>