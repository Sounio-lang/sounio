site_name: Sounio Documentation
site_description: A systems programming language for epistemic computing
site_url: https://sounio.ai/docs
repo_url: https://github.com/sounio-lang/sounio
repo_name: sounio-lang/sounio
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started.md
    - Tutorial: tutorial.md
    - Cookbook: cookbook.md
  - Reference:
    - Language Specification: spec.md
    - LLM Programming Guide: llm-guide.md
    - Gotchas: gotchas.md
    - Effect System: effects.md
    - Standard Library: stdlib.md
    - Knowledge Reference: knowledge.md
  - Contributing:
    - Developer Workflow: dev-workflow.md
    - Style Guide: style-guide.md
    - Known Limitations: known-limitations.md

plugins:
  - search
  - macros

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

hooks:
  - hooks/status_badge.py
