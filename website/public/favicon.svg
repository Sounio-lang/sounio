<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Sounio brand icon mark: Ionic column with grape clusters -->
  <defs>
    <style>
      .mark { fill: #D6B35A; }
      @media (prefers-color-scheme: light) {
        .mark { fill: #0B1E3A; }
      }
    </style>
  </defs>
  <g class="mark">
    <!-- Capital (top beam) -->
    <rect x="28" y="16" width="72" height="10" rx="2"/>
    <!-- Volutes (scrolls) -->
    <circle cx="34" cy="34" r="8"/>
    <circle cx="66" cy="34" r="8"/>
    <!-- Column shaft -->
    <rect x="56" y="30" width="18" height="72" rx="1"/>
    <!-- Column base -->
    <rect x="50" y="100" width="30" height="8" rx="2"/>
    <rect x="46" y="106" width="38" height="6" rx="2"/>
    <!-- Grape cluster -->
    <circle cx="38" cy="46" r="9"/>
    <circle cx="48" cy="48" r="6"/>
    <circle cx="34" cy="60" r="10"/>
    <circle cx="48" cy="60" r="5.5"/>
    <circle cx="36" cy="74" r="8"/>
    <circle cx="48" cy="72" r="5"/>
    <circle cx="38" cy="86" r="6"/>
    <circle cx="40" cy="96" r="4"/>
  </g>
</svg>
