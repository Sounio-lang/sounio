<h1>Rapamycin (Sirolimus) 2mg Oral — 14-Compartment PBPK</h1>
<h2>Emoto 2013 | ICRP 89 | Rodgers-Rowland Kp | GUM JCGM 100:2008</h2>

<script>
const T=[0.000000,0.500000,1.000000,1.500000,2.000000,2.500000,3.000000,3.500000,4.000000,4.500000,5.000000,5.500000,6.000000,6.500000,7.000000,7.500000,8.000000,8.500000,9.000000,9.500000,10.000000,10.500000,11.000000,11.500000,12.000000,12.500000,13.000000,13.500000,14.000000,14.500000,15.000000,15.500000,16.000000,16.500000,17.000000,17.500000,18.000000,18.500000,19.000000,19.500000,20.000000,20.500000,21.000000,21.500000,22.000000,22.500000,23.000000,23.500000,24.000000];
const PL=[0.000000,0.003738,0.004325,0.004286,0.004076,0.003805,0.003519,0.003242,0.002983,0.002747,0.002535,0.002347,0.002179,0.002032,0.001901,0.001786,0.001685,0.001596,0.001516,0.001446,0.001384,0.001327,0.001277,0.001232,0.001191,0.001153,0.001119,0.001087,0.001058,0.001031,0.001006,0.000982,0.000960,0.000939,0.000919,0.000900,0.000882,0.000864,0.000848,0.000831,0.000816,0.000801,0.000786,0.000772,0.000758,0.000744,0.000731,0.000718,0.000705];

const KI=[0.000000,0.009564,0.011111,0.011020,0.010483,0.009787,0.009054,0.008341,0.007675,0.007068,0.006522,0.006036,0.005606,0.005225,0.004890,0.004595,0.004334,0.004104,0.003900,0.003719,0.003558,0.003413,0.003284,0.003167,0.003061,0.002965,0.002877,0.002796,0.002721,0.002651,0.002587,0.002526,0.002468,0.002414,0.002363,0.002314,0.002267,0.002222,0.002179,0.002137,0.002097,0.002058,0.002020,0.001984,0.001948,0.001913,0.001879,0.001846,0.001814];
const FA=[0.000000,0.001012,0.002835,0.004646,0.006299,0.007755,0.009010,0.010073,0.010960,0.011691,0.012283,0.012754,0.013121,0.013398,0.013598,0.013733,0.013813,0.013845,0.013838,0.013798,0.013730,0.013638,0.013527,0.013401,0.013261,0.013111,0.012952,0.012787,0.012617,0.012442,0.012265,0.012086,0.011905,0.011724,0.011543,0.011363,0.011183,0.011005,0.010828,0.010652,0.010479,0.010307,0.010137,0.009970,0.009805,0.009642,0.009481,0.009323,0.009167];
const SD=[0.200000,0.000707,0.001000,0.001225,0.001414,0.001581,0.001732,0.001871,0.002000,0.002121,0.002236,0.002345,0.002449,0.002550,0.002646,0.002739,0.002828,0.002915,0.003000,0.003082,0.003162,0.003240,0.003317,0.003391,0.003464,0.003536,0.003606,0.003674,0.003742,0.003808,0.003873,0.003937,0.004000,0.004062,0.004123,0.004183,0.004243,0.004301,0.004359,0.004416,0.004472,0.004528,0.004583,0.004637,0.004690,0.004743,0.004796,0.004848,0.004899];
const N=;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tip=document.getElementById('tooltip');
const W=cv.width,H=cv.height,mx=70,my=40,mw=W-100,mh=H-80;
let show=[true,true,true,true],ox=0,oy=0,zx=1,zy=1,drag=false,lx=0,ly=0;
const colors=['#e05252','#4daf4a','#7b68ee','#ff9f43'],names=['Plasma','Liver','Kidney','Fat'];
const series=[PL,LI,KI,FA];
function yMax(){let m=0;for(let s=0;s<4;s++)if(show[s])for(let i=0;i<N;i++){let v=series[s][i];if(s===0)v+=1.96*SD[i];if(v>m)m=v;}return m*1.15||0.001}
function tx(t){return mx+(t/24)*mw*zx+ox}
function ty(v){let ym=yMax();return my+mh-(v/ym)*mh*zy+oy}
function render(){
ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,W,H);
ctx.save();ctx.beginPath();ctx.rect(mx,my,mw,mh);ctx.clip();
ctx.strokeStyle='#1a1a2e';ctx.lineWidth=1;for(let g=0;g<=6;g++){let x=tx(g*4);ctx.beginPath();ctx.moveTo(x,my);ctx.lineTo(x,my+mh);ctx.stroke()}
let ym=yMax();for(let g=0;g<=5;g++){let y=ty(g*ym/5);ctx.beginPath();ctx.moveTo(mx,y);ctx.lineTo(mx+mw,y);ctx.stroke()}
if(show[0]){ctx.beginPath();for(let i=0;i<N;i++){let x=tx(T[i]),y=ty(PL[i]+1.96*SD[i]);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
for(let i=N-1;i>=0;i--){let x=tx(T[i]),lo=PL[i]-1.96*SD[i];ctx.lineTo(x,ty(lo<0?0:lo))}ctx.closePath();ctx.fillStyle='rgba(224,82,82,0.12)';ctx.fill()}
const lw=[2.5,2,2,2],dash=[[],[],[],[5,3]];
for(let s=3;s>=0;s--){if(!show[s])continue;ctx.beginPath();ctx.setLineDash(dash[s]);ctx.strokeStyle=colors[s];ctx.lineWidth=lw[s];
for(let i=0;i<N;i++){let x=tx(T[i]),y=ty(series[s][i]);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([])}
ctx.restore();
ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx,my+mh);ctx.lineTo(mx+mw,my+mh);ctx.stroke();
ctx.fillStyle='#888';ctx.font='11px sans-serif';ctx.textAlign='center';
for(let g=0;g<=6;g++){let x=tx(g*4);ctx.fillText(g*4+'h',x,my+mh+16)}
ctx.textAlign='right';for(let g=0;g<=5;g++){let v=(g*ym/5).toFixed(4);ctx.fillText(v,mx-6,ty(g*ym/5)+4)}
ctx.fillStyle='#aaa';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('Time (hours)',mx+mw/2,H-8);
ctx.save();ctx.translate(14,my+mh/2);ctx.rotate(-Math.PI/2);ctx.fillText('Concentration (mg/L)',0,0);ctx.restore();
}
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py_=e.clientY-r.top;
if(px<mx||px>mx+mw||py_<my||py_>my+mh){tip.style.display='none';return}
let t_hover=(px-mx-ox)/(mw*zx)*24;if(t_hover<0)t_hover=0;if(t_hover>24)t_hover=24;
let bi=0,bd=999;for(let i=0;i<N;i++){let d=Math.abs(T[i]-t_hover);if(d<bd){bd=d;bi=i}}
let h='<b>t='+T[bi].toFixed(1)+'h</b><br>';
for(let s=0;s<4;s++){if(!show[s])continue;h+='<span style="color:'+colors[s]+'">'+names[s]+': '+series[s][bi].toFixed(6)+' mg/L</span><br>'}
if(show[0])h+='<span style="color:#e0525280">u(plasma): ±'+SD[bi].toFixed(6)+'</span>';
tip.innerHTML=h;tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-10)+'px'});
cv.addEventListener('mouseleave',()=>{tip.style.display='none'});
cv.addEventListener('wheel',e=>{e.preventDefault();let f=e.deltaY>0?0.9:1.1;zx*=f;zy*=f;zx=Math.max(0.5,Math.min(10,zx));zy=Math.max(0.5,Math.min(10,zy));render()},{passive:false});
cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
cv.addEventListener('mouseup',()=>{drag=false});cv.addEventListener('mouseleave',()=>{drag=false});
cv.addEventListener('mousemove',e=>{if(!drag)return;ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;render()});
function toggle(s){show[s]=!show[s];document.querySelectorAll('.leg-item')[s].classList.toggle('off');render()}
render();
</script></body></html>
