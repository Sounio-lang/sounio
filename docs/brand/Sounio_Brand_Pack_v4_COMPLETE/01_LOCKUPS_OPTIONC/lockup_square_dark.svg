<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
<rect width="1400" height="1400" fill="#0B1E3A"/>

    <defs>
      <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    

    <text x="700.0" y="588.0" text-anchor="middle"
          font-family="GFS Neohellenic, serif"
          font-size="364" font-weight="700"
          fill="#D6B35A" filter="url(#softGlow)">
      Sounio Language
    </text>
    
<line x1="378.0" y1="700.0" x2="1022.0" y2="700.0" stroke="#D6B35A" stroke-width="28" stroke-linecap="round" opacity="0.95"/>

    <text x="700.0" y="840.0" text-anchor="middle"
          font-family="DejaVu Sans Mono, monospace"
          font-size="168" font-weight="700"
          fill="#FFFFFF">
      souniolang.org
    </text>
    

    <text x="700.0" y="1022.0" text-anchor="middle"
          font-family="EB Garamond, serif"
          font-size="126" font-style="italic"
          fill="#FFFFFF" opacity="0.95">
      Epistemic computing at the horizon of certainty
    </text>
    
</svg>