<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-sans-serif,system-ui,Arial" font-size="15">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">How understatement silences the safety WARN</text>
  <text x="360" y="53" text-anchor="middle" font-size="14" fill="#6b7280">vancomycin AUC₀₋₂₄ (examples/vancomycin_auc_epistemic.sio); boundary = 400 mg·h/L</text>

  <!-- axis -->
  <line x1="80" y1="300" x2="660" y2="300" stroke="#374151" stroke-width="2"/>
  <!-- scale: 320..560 over x 80..660 => px = 80 + (val-320)*(580/240) = 80 + (val-320)*2.4167 -->
  <!-- ticks -->
  <g fill="#6b7280" font-size="12" text-anchor="middle">
    <line x1="80" y1="296" x2="80" y2="304" stroke="#374151"/><text x="80" y="320">320</text>
    <line x1="273" y1="296" x2="273" y2="304" stroke="#374151"/><text x="273" y="320">400</text>
    <line x1="466" y1="296" x2="466" y2="304" stroke="#374151"/><text x="466" y="320">480</text>
    <line x1="660" y1="296" x2="660" y2="304" stroke="#374151"/><text x="660" y="320">560</text>
  </g>
  <!-- subtherapeutic boundary -->
  <line x1="273" y1="80" x2="273" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="273" y="74" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">400 = subtherapeutic</text>
  <rect x="80" y="80" width="193" height="220" fill="#fef2f2" opacity="0.5"/>

  <!-- point estimate 450 -->
  <!-- px(450)=80+(130)*2.4167=394 -->
  <circle cx="394" cy="300" r="4" fill="#111827"/>
  <text x="394" y="338" text-anchor="middle" font-size="12" fill="#111827">point est. 450 → "therapeutic"</text>

  <!-- TRUE CI [362,538]: px(362)=181, px(538)=607 -->
  <g>
    <line x1="181" y1="150" x2="607" y2="150" stroke="#2563eb" stroke-width="3"/>
    <line x1="181" y1="140" x2="181" y2="160" stroke="#2563eb" stroke-width="3"/>
    <line x1="607" y1="140" x2="607" y2="160" stroke="#2563eb" stroke-width="3"/>
    <circle cx="394" cy="150" r="4" fill="#2563eb"/>
    <text x="394" y="132" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">sound CI [362, 538]  →  WARN fires ✓</text>
    <text x="150" y="154" text-anchor="end" font-size="12" fill="#1d4ed8">362</text>
  </g>

  <!-- UNDERSTATED CI (√2 SD contraction on a correlated sum): half-width 88 -> 62 => [408,512]
       px(408)=293, px(512)=544 -->
  <g>
    <line x1="293" y1="210" x2="544" y2="210" stroke="#b91c1c" stroke-width="3"/>
    <line x1="293" y1="200" x2="293" y2="220" stroke="#b91c1c" stroke-width="3"/>
    <line x1="544" y1="200" x2="544" y2="220" stroke="#b91c1c" stroke-width="3"/>
    <circle cx="394" cy="210" r="4" fill="#b91c1c"/>
    <text x="394" y="192" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700">understated CI [408, 512]  →  WARN silenced ✗</text>
    <text x="300" y="238" text-anchor="start" font-size="12" fill="#b91c1c">lower bound pulled above 400</text>
  </g>

  <text x="360" y="366" text-anchor="middle" font-size="12" fill="#9ca3af">Mechanism on the §8.4 controlled correlated-sum instance (ρ→1, √2 SD contraction); full 2-compartment flip rate is pending the wire.</text>
</svg>
