<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="ui-sans-serif,system-ui,Arial" font-size="15">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Noise-set dataflow: the disjointness check</text>
  <text x="360" y="55" text-anchor="middle" font-size="14" fill="#6b7280">source-set N propagates by ∪ over the value graph; ADD flagged iff Nₐ ∩ N_b ≠ ∅ (ns_dataflow.sio)</text>

  <!-- measurements -->
  <rect x="70" y="95" width="150" height="52" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="145" y="120" text-anchor="middle" font-weight="700" fill="#3730a3">x = measure()</text>
  <text x="145" y="139" text-anchor="middle" font-size="13" fill="#4338ca">N = {s₁}</text>

  <rect x="70" y="250" width="150" height="52" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="145" y="275" text-anchor="middle" font-weight="700" fill="#3730a3">y = measure()</text>
  <text x="145" y="294" text-anchor="middle" font-size="13" fill="#4338ca">N = {s₂}</text>

  <!-- s1 = x + x  FLAGGED -->
  <line x1="220" y1="112" x2="430" y2="130" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <path d="M170,147 C150,180 150,180 200,130" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <rect x="430" y="100" width="220" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="540" y="124" text-anchor="middle" font-weight="700" fill="#b91c1c">s₁ = ADD(x, x)</text>
  <text x="540" y="146" text-anchor="middle" font-size="13" fill="#7f1d1d">{s₁} ∩ {s₁} = {s₁} ≠ ∅  →  E230 ✗</text>

  <!-- s2 = x + y CLEAN -->
  <line x1="220" y1="130" x2="430" y2="262" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <line x1="220" y1="272" x2="430" y2="278" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <rect x="430" y="248" width="220" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="540" y="272" text-anchor="middle" font-weight="700" fill="#15803d">s₂ = ADD(x, y)</text>
  <text x="540" y="294" text-anchor="middle" font-size="13" fill="#166534">{s₁} ∩ {s₂} = ∅  →  admitted ✓</text>

  <text x="360" y="360" text-anchor="middle" font-size="14" fill="#6b7280">The independence-assuming add is well-typed only when the operand source-sets are provably disjoint.</text>
  <text x="360" y="382" text-anchor="middle" font-size="13" fill="#9ca3af">Unknown (⊤) is never disjoint — the conservative default.</text>

  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/></marker></defs>
</svg>
