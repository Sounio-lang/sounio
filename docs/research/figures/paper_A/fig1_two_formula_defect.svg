<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-sans-serif,system-ui,Arial" font-size="15">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">The same operation, two variances</text>
  <text x="360" y="58" text-anchor="middle" font-size="14" fill="#6b7280">x = (mean m, variance v);  evaluate x · x two ways (stdlib/epistemic/knowledge.sio)</text>

  <!-- input -->
  <rect x="310" y="80" width="100" height="40" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="360" y="105" text-anchor="middle" font-weight="700" fill="#3730a3">x · x</text>

  <!-- arrows -->
  <line x1="330" y1="120" x2="180" y2="168" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="120" x2="540" y2="168" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- left: ep_mul -->
  <rect x="40" y="172" width="280" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="180" y="198" text-anchor="middle" font-weight="700" fill="#b91c1c">ep_mul(&amp;x, &amp;x)   :112</text>
  <text x="180" y="224" text-anchor="middle" font-size="14" fill="#7f1d1d">Y²·Var(X) + X²·Var(Y)</text>
  <text x="180" y="250" text-anchor="middle" font-size="14" fill="#7f1d1d">= m²v + m²v</text>
  <text x="180" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">= 2 m² v   (understated ✗)</text>

  <!-- right: ep_square -->
  <rect x="400" y="172" width="280" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="540" y="198" text-anchor="middle" font-weight="700" fill="#15803d">ep_square(&amp;x)   :154</text>
  <text x="540" y="224" text-anchor="middle" font-size="14" fill="#166534">4·X²·Var(X)</text>
  <text x="540" y="250" text-anchor="middle" font-size="14" fill="#166534">= 4 m² v</text>
  <text x="540" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">= 4 m² v   (correct ✓)</text>

  <!-- gap -->
  <text x="360" y="330" text-anchor="middle" font-size="15" fill="#111827">gap = 4m²v − 2m²v = <tspan font-weight="700">2m²v</tspan> = the dropped covariance term 2·X·Y·Cov(X,X)</text>
  <text x="360" y="356" text-anchor="middle" font-size="14" fill="#6b7280">Nothing routes <tspan font-style="italic">x · x</tspan> to the sound operator. The programmer gets half the uncertainty, silently.</text>

  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/></marker></defs>
</svg>
