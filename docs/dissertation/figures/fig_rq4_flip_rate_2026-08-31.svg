<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Liberation Sans',Arial,'DejaVu Sans',ui-sans-serif,system-ui" font-size="13">
  <!-- Fonte: docs/research/sounio/rq4_vanco_two_compartment_flip.sio — coorte determinística de 5 000 pacientes,
       Madaros bf1fe608 (2026-08-31). Linha RQ4_FLIP: true_warn=909 silenced_sum=0 spurious_naive=1894
       var_ratio_sum=1.204 var_ratio_naive=300.662 B_silenced=311 B_var_ratio=0.500.
       Paleta categórica validada (modo claro): afim #2a78d6 · soma ingênua #eb6834 · cadeia ep_* #1baf7a.
       Escala y: 0..3000 WARNs -> y 440..130 (0,10333 px/WARN). -->
  <rect width="1000" height="600" fill="#fcfcfb"/>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Quantos alertas a hipótese de independência silencia — ou inventa</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#52514e">Vancomicina, AUC₀₋₂₄ em dois compartimentos · coorte determinística de 5 000 pacientes · WARN = ponto ≥ 400 e limite inferior IC95 &lt; 400</text>

  <!-- painel A título (2 linhas) -->
  <text x="295" y="92" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">A · Soma de intervalos, mesmo CL (ρ = 1)</text>
  <text x="295" y="110" text-anchor="middle" font-size="12" fill="#52514e">AUC₀₋₂₄ = AUC(0–12) + AUC(12–24)</text>
  <!-- painel B título (2 linhas) -->
  <text x="750" y="92" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">B · Decomposição em fases (Cov &lt; 0 em 5 000/5 000)</text>
  <text x="750" y="110" text-anchor="middle" font-size="12" fill="#52514e">AUC₀₋₂₄ = A/α + B/β  (= 2D/CL)</text>

  <!-- grade + eixo y -->
  <g stroke="#e5e4df" stroke-width="1">
    <line x1="110" y1="440" x2="985" y2="440"/>
    <line x1="110" y1="336.7" x2="985" y2="336.7"/>
    <line x1="110" y1="233.3" x2="985" y2="233.3"/>
    <line x1="110" y1="130" x2="985" y2="130"/>
  </g>
  <g fill="#52514e" font-size="11" text-anchor="end">
    <text x="102" y="444">0</text>
    <text x="102" y="340">1 000</text>
    <text x="102" y="237">2 000</text>
    <text x="102" y="134">3 000</text>
  </g>
  <text x="24" y="285" transform="rotate(-90 24 285)" text-anchor="middle" font-size="11.5" fill="#52514e">pacientes com WARN (de 5 000)</text>

  <!-- separador -->
  <line x1="505" y1="80" x2="505" y2="500" stroke="#e5e4df" stroke-width="1"/>

  <!-- referência: 909 WARNs verdadeiros -> y = 440 - 909*0.10333 = 346.1 -->
  <line x1="110" y1="346.1" x2="985" y2="346.1" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>
  <text x="982" y="341" text-anchor="end" font-size="10.5" fill="#2a78d6">909 verdadeiros</text>

  <!-- ===== painel A: barras (largura 56, topo arredondado 4px) ===== -->
  <!-- afim 909 -> y 346.1 -->
  <path d="M172,440 V350.1 a4,4 0 0 1 4,-4 h48 a4,4 0 0 1 4,4 V440 Z" fill="#2a78d6"/>
  <text x="200" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">909</text>
  <!-- soma ingênua 598 -> y 378.2 -->
  <path d="M272,440 V382.2 a4,4 0 0 1 4,-4 h48 a4,4 0 0 1 4,4 V440 Z" fill="#eb6834"/>
  <text x="300" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">598</text>
  <!-- chave: 311 silenciados -->
  <line x1="342" y1="346.1" x2="342" y2="378.2" stroke="#0b0b0b" stroke-width="1.2"/>
  <line x1="337" y1="346.1" x2="347" y2="346.1" stroke="#0b0b0b" stroke-width="1.2"/>
  <line x1="337" y1="378.2" x2="347" y2="378.2" stroke="#0b0b0b" stroke-width="1.2"/>
  <text x="352" y="358" font-size="12" font-weight="600" fill="#0b0b0b">311 silenciados</text>
  <text x="352" y="373" font-size="11" fill="#52514e">34,2 % dos verdadeiros</text>

  <text x="200" y="460" text-anchor="middle" font-size="11" fill="#52514e">afim (exata)</text>
  <text x="300" y="460" text-anchor="middle" font-size="11" fill="#52514e">soma ingênua</text>
  <text x="295" y="484" text-anchor="middle" font-size="11" fill="#52514e">Var ingênua / verdadeira = 0,500</text>
  <text x="295" y="499" text-anchor="middle" font-size="10.5" fill="#52514e">(Lema 1: o termo 2·Cov &gt; 0 omitido)</text>

  <!-- ===== painel B ===== -->
  <!-- afim 909 -->
  <path d="M572,440 V350.1 a4,4 0 0 1 4,-4 h48 a4,4 0 0 1 4,4 V440 Z" fill="#2a78d6"/>
  <text x="600" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">909</text>
  <!-- soma ingênua 971 -> y 339.7 -->
  <path d="M672,440 V343.7 a4,4 0 0 1 4,-4 h48 a4,4 0 0 1 4,4 V440 Z" fill="#eb6834"/>
  <text x="700" y="329" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">971</text>
  <text x="700" y="315" text-anchor="middle" font-size="10.5" fill="#52514e">+62 espúrios</text>
  <!-- cadeia 2803 -> y 150.4 -->
  <path d="M772,440 V154.4 a4,4 0 0 1 4,-4 h48 a4,4 0 0 1 4,4 V440 Z" fill="#1baf7a"/>
  <text x="800" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">2 803</text>
  <!-- chave: 1 894 espúrios -->
  <line x1="842" y1="150.4" x2="842" y2="346.1" stroke="#0b0b0b" stroke-width="1.2"/>
  <line x1="837" y1="150.4" x2="847" y2="150.4" stroke="#0b0b0b" stroke-width="1.2"/>
  <line x1="837" y1="346.1" x2="847" y2="346.1" stroke="#0b0b0b" stroke-width="1.2"/>
  <text x="852" y="238" font-size="12" font-weight="600" fill="#0b0b0b">1 894 espúrios</text>
  <text x="852" y="253" font-size="11" fill="#52514e">38 % da coorte</text>
  <text x="852" y="268" font-size="11" fill="#52514e">0 silenciados</text>

  <text x="600" y="460" text-anchor="middle" font-size="11" fill="#52514e">afim (exata)</text>
  <text x="700" y="460" text-anchor="middle" font-size="11" fill="#52514e">soma ingênua</text>
  <text x="800" y="460" text-anchor="middle" font-size="11" fill="#52514e">cadeia ep_* inteira</text>
  <text x="750" y="484" text-anchor="middle" font-size="11" fill="#52514e">Var ingênua / verdadeira = 1,204 (soma final) · 300,7 (cadeia)</text>
  <text x="750" y="499" text-anchor="middle" font-size="10.5" fill="#52514e">(Cov &lt; 0: a adição independente sobrestima — garbling, não anti-garbling)</text>

  <!-- legenda (empilhada) -->
  <g font-size="11.5" fill="#0b0b0b">
    <rect x="110" y="526" width="11" height="11" rx="3" fill="#2a78d6"/><text x="128" y="536">propagação afim — fontes de medição rastreadas; verdade de 1ª ordem (stdlib/epistemic/affine)</text>
    <rect x="110" y="546" width="11" height="11" rx="3" fill="#eb6834"/><text x="128" y="556">adição que assume independência entre os dois termos (ep_add), operandos exatos</text>
    <rect x="110" y="566" width="11" height="11" rx="3" fill="#1baf7a"/><text x="128" y="576">cadeia escalar ep_* completa — independência assumida em toda operação (stdlib/epistemic/knowledge)</text>
  </g>
  <text x="985" y="592" text-anchor="end" font-size="9.5" fill="#52514e">rq4_vanco_two_compartment_flip.sio · Madaros bf1fe608 · determinístico (LCG 20260831) · 2026-08-31</text>
</svg>
