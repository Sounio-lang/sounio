schema = "sounio.registry-attestation-policy.v1"

[registry]
id = "sounio-local-preview"
namespace = "scientific-packages"
authority-scope = "local-catalog-index"
publication-status = "disabled"

[acceptance]
allowed-rings = ["scientific-package", "research"]
allowed-visibilities = ["public", "protected"]
allowed-claim-classes = ["compile", "runtime", "validated_research"]
allowed-assurance-levels = ["identity-only"]
required-boundary-mode = "strict"
required-boundary-verdict = "OK"
